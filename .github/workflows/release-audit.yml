name: Release readiness audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "stata/**"
      - "bundle/**"
      - "release/targets.json"
      - "release/macos-universal.json"
      - "release/memory-stress-macos-arm64.json"
      - "licenses/generated/STATUS.json"
      - "tools/check_release_readiness.py"
      - ".github/workflows/release-audit.yml"

concurrency:
  group: texpdf-release-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require synchronized fail-closed release state
        run: /usr/bin/python3 tools/sync_project_state.py --check

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-release-audit-${{ github.sha }}-${{ github.run_id }}
          path: |
            release/READINESS.json
            release/READINESS.md
          if-no-files-found: error
          retention-days: 30
