name: Fix license-tool Python compatibility once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-license-tool-python-compat-once.yml"

concurrency:
  group: texpdf-fix-license-tool-python-compat-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('.github/workflows/build-exact-license-inventory-once.yml'),
              Path('tools/build_tex_resource_license_inventory.py'),
          ]
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('from typing import Any\n', 'from typing import Any, Optional\n')
              text = text.replace('Path | None', 'Optional[Path]')
              path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-license-tool-python-compat-once.yml').unlink()
          PY
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: support system Python in license inventory tooling"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
