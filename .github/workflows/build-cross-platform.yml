name: Build unqualified Windows and Linux plugins

on:
  workflow_dispatch:

concurrency:
  group: texpdf-cross-platform-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: Prepare the locked curated bundle
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 120
    env:
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and test the qualified source bundle
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh
      - name: Upload exact curated bundle build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-curated-bundle-${{ github.sha }}
          path: |
            bundle/generated/texpdf-bundle.zip
            bundle/generated/bundle-info.json
            bundle/generated/curated-manifest.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build-only ${{ matrix.target }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            triplet: x64-linux
            library: libtexpdf_stata.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static-md
            library: texpdf_stata.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TECTONIC_DEP_BACKEND: vcpkg
      VCPKGRS_TRIPLET: ${{ matrix.triplet }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Check out texpdf
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out pinned vcpkg
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: microsoft/vcpkg
          ref: a62ce77d56ee07513b4b67de1ec2daeaebfae51a
          path: vcpkg

      - name: Download the exact curated bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: texpdf-curated-bundle-${{ github.sha }}
          path: bundle/generated

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
          rustc --version
          cargo --version

      - name: Bootstrap vcpkg on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg install \
            --triplet "$VCPKGRS_TRIPLET" \
            fontconfig freetype 'harfbuzz[graphite2]' icu libpng zlib
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install `
            --triplet $env:VCPKGRS_TRIPLET `
            fontconfig freetype "harfbuzz[graphite2]" icu libpng zlib
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify bundle identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_stub_bundle.py --help >/dev/null 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          info = json.loads(Path("bundle/generated/bundle-info.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(Path("bundle/generated/texpdf-bundle.zip").read_bytes()).hexdigest()
          if digest != info["zip_sha256"]:
              raise SystemExit(f"bundle SHA mismatch: {digest} != {info['zip_sha256']}")
          print(f"TEXPDF_CROSS_BUNDLE_OK bytes={Path('bundle/generated/texpdf-bundle.zip').stat().st_size} sha256={digest}")
          PY

      - name: Format, lint, test, and build
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          cargo build --locked --release --package texpdf-stata

      - name: Stage Stata plugin
        shell: bash
        run: >-
          python tools/stage_plugin.py
          --target-dir "$CARGO_TARGET_DIR"
          --output "dist/${{ matrix.target }}/_texpdf_plugin.plugin"
          --manifest "dist/${{ matrix.target }}/plugin-manifest.json"

      - name: Verify Windows exports
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dump = & dumpbin /exports "dist\${{ matrix.target }}\_texpdf_plugin.plugin"
          if (-not ($dump -match "pginit")) { throw "pginit export is missing" }
          if (-not ($dump -match "stata_call")) { throw "stata_call export is missing" }

      - name: Inspect Linux dynamic dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          file "dist/${{ matrix.target }}/_texpdf_plugin.plugin"
          ldd "dist/${{ matrix.target }}/_texpdf_plugin.plugin" | tee "dist/${{ matrix.target }}/ldd.txt"
          if grep -E '(fontconfig|freetype|harfbuzz|graphite|icu|png|zlib)' "dist/${{ matrix.target }}/ldd.txt"; then
            echo "one or more intended static dependencies remain dynamically linked" >&2
            exit 1
          fi

      - name: Mark build as not Stata-runtime qualified
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          target = "${{ matrix.target }}"
          path = Path("dist") / target / "BUILD_ONLY.json"
          path.write_text(json.dumps({
              "schema_version": 1,
              "source_sha": "${{ github.sha }}",
              "target": target,
              "rust_build_and_tests": "success",
              "stata_runtime_qualified": False,
              "qualification_note": "This artifact has not been loaded in Stata on the target platform."
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload build-only artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-build-only-${{ matrix.target }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

# These are build-only artifacts. They must not be published as supported
# plugins until the same source artifact loads and passes the release corpus in
# an actual Stata process on the target platform.
