name: Generate Rust dependency license inventory once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-cargo-license-inventory-once.yml"

concurrency:
  group: texpdf-cargo-license-inventory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inventory:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate strict inventory
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          if [[ ! -f Cargo.lock ]]; then
            "$cargo_bin" generate-lockfile
          fi
          /usr/bin/python3 tools/generate_cargo_license_inventory.py \
            --cargo "$cargo_bin" \
            --strict
          rm -f .github/workflows/generate-cargo-license-inventory-once.yml
          git add Cargo.lock licenses/CARGO_LICENSE_INVENTORY.json \
            licenses/CARGO_LICENSE_INVENTORY.md
          git add -u .github/workflows/generate-cargo-license-inventory-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: inventory locked Rust dependency licenses"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
