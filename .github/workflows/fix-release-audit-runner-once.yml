name: Keep release audit on self-hosted runner once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-release-audit-runner-once.yml"

concurrency:
  group: texpdf-release-audit-runner-fix
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and commit workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/release-audit.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    runs-on: ubuntu-latest\n",
              "    runs-on: [self-hosted, macOS, ARM64, texpdf]\n",
              1,
          )
          text = text.replace(
              "        run: python3 tools/check_release_readiness.py\n",
              "        run: /usr/bin/python3 tools/check_release_readiness.py\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/fix-release-audit-runner-once.yml").unlink(missing_ok=True)
          PY
          git add .github/workflows/release-audit.yml
          git add -u .github/workflows/fix-release-audit-runner-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: keep routine release audit self-hosted"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
