name: Build and test macOS universal plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "bundle/**"
      - "crates/**"
      - "stata/**"
      - "tools/prepare_native_deps*.sh"
      - "tools/build_macos_universal.sh"
      - "tools/package_release.py"
      - "ci/prepare_release_license_evidence.sh"
      - "ci/run_license_audit.py"
      - "licenses/**"
      - ".github/workflows/build-macos-universal.yml"

concurrency:
  group: texpdf-macos-universal
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  TEXPDF_PYTHON: /usr/bin/python3
  TEXPDF_VCPKG_ROOT: /private/tmp/texpdf-vcpkg-a62ce77d56ee
  TEXPDF_VCPKG_BINARY_CACHE: /private/tmp/texpdf-vcpkg-binary-cache
  TEXPDF_PKGCONF_ROOT: /private/tmp/texpdf-pkgconf-4fc570f91d9d
  STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
  TEXPDF_RUST_PROFILE: engine

jobs:
  universal:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build and test the qualified ARM engine
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh

      - name: Preserve Rust evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/texpdf-universal-rust"
          mkdir -p "$RUNNER_TEMP/texpdf-universal-rust"
          cp -R .ci/stata/run/. "$RUNNER_TEMP/texpdf-universal-rust/"

      - name: Build universal plugin
        shell: bash
        run: >-
          /bin/bash tools/build_macos_universal.sh
          dist/macos-universal/_texpdf_plugin_macosx.plugin
          dist/macos-universal/manifest.json

      - name: Materialize complete source-bound notice tree
        shell: bash
        run: /bin/bash ci/prepare_release_license_evidence.sh

      - name: Assemble public universal candidate with notices
        shell: bash
        run: |
          set -euo pipefail
          candidate_version=$(/usr/bin/python3 -c 'import json; print(json.load(open("release/scope.json"))["candidate_version"])')
          /usr/bin/python3 tools/package_release.py \
            --plugin dist/macos-universal/_texpdf_plugin_macosx.plugin \
            --embedded-helper-manifest dist/macos-universal/manifest.json \
            --bundle-info bundle/generated/bundle-info.json \
            --output-dir dist/macos-universal/texpdf \
            --zip "dist/macos-universal/texpdf-macos-universal-${candidate_version}.zip" \
            --manifest dist/macos-universal/package-manifest.json \
            --target universal2-apple-darwin \
            --package-version "$candidate_version" \
            --public-release

      - name: Stage universal plugin for licensed Stata
        shell: bash
        run: |
          set -euo pipefail
          cp dist/macos-universal/_texpdf_plugin_macosx.plugin stata/_texpdf_plugin_macosx.plugin
          git add -f stata/_texpdf_plugin_macosx.plugin

      - name: Test ARM slice in licensed Stata
        shell: bash
        env:
          TEXPDF_STATA_PACKAGE_DIR: ${{ github.workspace }}/dist/macos-universal/texpdf
        run: /bin/bash ci/run_stata_ci.sh quick

      - name: Combine and validate evidence
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/texpdf-universal-rust/." .ci/stata/run/
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json \
            .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          path = Path("dist/macos-universal/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          receipt = json.loads(
              Path(".ci/stata/run/receipt.json").read_text(encoding="utf-8")
          )
          data["source_sha"] = os.environ["GITHUB_SHA"]
          data["arm_runtime_qualified"] = True
          data["arm_stata_profile"] = "quick"
          data["arm_stata_receipt"] = ".ci/stata/run/receipt.json"
          data["arm_stata_version"] = receipt["stata_version"]
          data["arm_stata_edition"] = receipt["stata_edition"]
          package = json.loads(
              Path("dist/macos-universal/package-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          data["candidate_package"] = {
              "version": package.get("package_version"),
              "zip_sha256": package.get("package_zip_sha256"),
              "zip_size_bytes": package.get("package_zip_size_bytes"),
              "license_evidence_included": package.get("license_evidence_included"),
              "license_audit_source_sha": package.get("license_audit_source_sha"),
              "public_release": package.get("public_release_mode"),
          }
          data["intel_runtime_qualified"] = False
          data["qualification_boundary"] = (
              "Both Mach-O slices were built and inspected. The universal plugin "
              "was loaded and tested only through its ARM64 slice in licensed "
              f"Stata/{receipt['stata_edition']} {receipt['stata_version']}. "
              "Intel runtime qualification remains pending."
          )
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Publish honest universal build record
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/dist/macos-universal/manifest.json"
          publish_tree="$RUNNER_TEMP/texpdf-universal-publish"
          rm -rf "$publish_tree"
          git fetch origin main
          git worktree add --detach "$publish_tree" origin/main
          trap 'git -C "$GITHUB_WORKSPACE" worktree remove --force "$publish_tree" 2>/dev/null || true' EXIT
          candidate_source_sha=$(
            /usr/bin/python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["candidate_source_sha"])' \
              "$publish_tree/release/scope.json"
          )
          if [[ "$GITHUB_SHA" != "$candidate_source_sha" ]]; then
            echo "Skipping release-record publication for non-candidate source $GITHUB_SHA"
            exit 0
          fi
          mkdir -p "$publish_tree/release"
          cp "$manifest" "$publish_tree/release/macos-universal.json"
          /usr/bin/python3 - "$publish_tree/release/targets.json" "$manifest" <<'PY'
          from pathlib import Path
          import json
          import sys

          targets_path = Path(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          targets = json.loads(targets_path.read_text(encoding="utf-8"))
          intel = manifest["slices"]["x86_64"]
          arm = manifest["slices"]["arm64"]
          universal = manifest["universal"]
          package = manifest["candidate_package"]
          source_sha = manifest["source_sha"]

          arm_record = targets["targets"]["aarch64-apple-darwin"]
          arm_record.update(
              {
                  "universal_build_source_sha": source_sha,
                  "universal_plugin_sha256": universal["sha256"],
                  "universal_plugin_size_bytes": universal["size_bytes"],
                  "universal_arm_slice_sha256": arm["sha256"],
                  "embedded_helper_sha256": arm["embedded_helper"]["sha256"],
                  "embedded_helper_size_bytes": arm["embedded_helper"]["size_bytes"],
                  "universal_arm_runtime_qualified": True,
                  "candidate_package_sha256": package["zip_sha256"],
                  "candidate_package_size_bytes": package["zip_size_bytes"],
                  "candidate_package_version": package["version"],
                  "candidate_package_license_evidence_included": package[
                      "license_evidence_included"
                  ],
                  "candidate_package_public_release": package["public_release"],
              }
          )

          intel_record = targets["targets"]["x86_64-apple-darwin"]
          intel_record.update(
              {
                  "artifact": "_texpdf_plugin_macosx.plugin",
                  "build_qualified": True,
                  "build_source_sha": source_sha,
                  "plugin_sha256": intel["sha256"],
                  "plugin_size_bytes": intel["size_bytes"],
                  "embedded_helper_sha256": intel["embedded_helper"]["sha256"],
                  "embedded_helper_size_bytes": intel["embedded_helper"]["size_bytes"],
                  "universal_plugin_sha256": universal["sha256"],
                  "universal_plugin_size_bytes": universal["size_bytes"],
                  "qualification_profile": "build + ARM licensed-Stata universal smoke",
                  "qualified_source_sha": "",
                  "stata_runtime_qualified": False,
                  "stata_version": "",
                  "candidate_package_sha256": package["zip_sha256"],
                  "candidate_package_size_bytes": package["zip_size_bytes"],
                  "candidate_package_version": package["version"],
                  "status": (
                      "Intel slice built, inspected, and packaged into an ARM-tested "
                      "universal plugin; Intel Stata runtime qualification pending"
                  ),
              }
          )
          targets_path.write_text(
              json.dumps(targets, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git -C "$publish_tree" config user.name "github-actions[bot]"
          git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_tree" add release/macos-universal.json release/targets.json
          git -C "$publish_tree" commit -m "ci(target): record macOS universal build [skip ci]"
          git -C "$publish_tree" push origin HEAD:main

      - name: Upload universal development artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-macos-universal-${{ github.sha }}-${{ github.run_id }}
          path: |
            dist/macos-universal/
            .ci/stata/run/
          if-no-files-found: error
          retention-days: 30
