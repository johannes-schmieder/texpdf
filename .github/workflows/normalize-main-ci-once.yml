name: Normalize main CI triggers once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-main-ci-once.yml"

concurrency:
  group: texpdf-normalize-main-ci
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize concurrency and generated-file exclusions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/stata-ci.yml")
          text = path.read_text(encoding="utf-8")
          concurrency_anchor = "  cancel-in-progress: false\n"
          if concurrency_anchor in text:
              text = text.replace(concurrency_anchor, "  cancel-in-progress: true\n", 1)
          elif "  cancel-in-progress: true\n" not in text:
              raise SystemExit("cannot identify main CI concurrency setting")

          ignored = [
              '.ci/artifacts/**',
              '.ci/implementation-failures/**',
              'docs/generated/**',
              'licenses/generated/**',
              'release/*.json',
              '**/*.md',
          ]
          if "paths-ignore:" not in text:
              raise SystemExit("main CI has no paths-ignore block")
          lines = text.splitlines()
          path_index = next(
              index for index, line in enumerate(lines) if line.strip() == "paths-ignore:"
          )
          indentation = lines[path_index].split("paths-ignore:", 1)[0] + "  "
          insertion = path_index + 1
          while insertion < len(lines) and lines[insertion].startswith(indentation + "-"):
              insertion += 1
          existing = {line.strip().lstrip("-").strip().strip('"').strip("'") for line in lines[path_index + 1:insertion]}
          additions = [f'{indentation}- "{pattern}"' for pattern in ignored if pattern not in existing]
          lines[insertion:insertion] = additions
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          Path(".github/workflows/normalize-main-ci-once.yml").unlink()
          PY

          git add .github/workflows/stata-ci.yml
          git add -u .github/workflows/normalize-main-ci-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: avoid superseded and documentation-only engine runs [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
