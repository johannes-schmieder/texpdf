name: Cancel stale normal CI runs once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-stale-normal-ci-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Cancel queued and running ordinary CI copies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "texpdf-ci-queue-cleaner",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              "stata-ci.yml/runs?branch=main&per_page=100"
          )
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          cancelled = []
          skipped = []
          for run in payload.get("workflow_runs", []):
              status = run.get("status")
              run_id = run.get("id")
              if status not in {"queued", "in_progress", "waiting", "pending"}:
                  skipped.append((run_id, status))
                  continue
              cancel = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel",
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(cancel, timeout=30) as response:
                      response.read()
                  cancelled.append(run_id)
              except urllib.error.HTTPError as error:
                  if error.code not in {409, 422}:
                      raise
          print(
              "TEXPDF_STALE_CI_CANCELLED "
              f"count={len(cancelled)} ids={','.join(map(str, cancelled))}"
          )
          PY

      - name: Remove queue-cleaner workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/cancel-stale-normal-ci-once.yml
          git add -u .github/workflows/cancel-stale-normal-ci-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove stale-run queue cleaner [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
