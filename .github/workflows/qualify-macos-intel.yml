name: Qualify macOS Intel Stata runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact already-green source SHA to qualify
        required: true
        type: string
      arm_run_id:
        description: Workflow run that produced the exact ARM-qualified universal candidate
        required: true
        type: string

concurrency:
  group: texpdf-macos-intel-runtime
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 300
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TEXPDF_BUNDLE_CACHE: /private/tmp/texpdf-bundle-cache
      TEXPDF_PYTHON: /usr/bin/python3
      TEXPDF_VCPKG_ROOT: /private/tmp/texpdf-vcpkg-a62ce77d56ee
      TEXPDF_VCPKG_BINARY_CACHE: /private/tmp/texpdf-vcpkg-binary-cache
      TEXPDF_PKGCONF_ROOT: /private/tmp/texpdf-pkgconf-4fc570f91d9d
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Require exact green source and Intel runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git show origin/main:release/targets.json > "$RUNNER_TEMP/texpdf-targets.json"
          git show origin/main:release/scope.json > "$RUNNER_TEMP/texpdf-release-scope.json"
          receipt="$RUNNER_TEMP/texpdf-source-receipt.json"
          git show "origin/main:.ci/stata/results/$SOURCE_SHA.json" > "$receipt"
          /usr/bin/python3 ci/check_stata_receipt.py \
            "$receipt" \
            --expect-tested-sha "$SOURCE_SHA" \
            --require-success \
            --require-rust-success
          stata_real=/Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
          test -x "$stata_real"
          /usr/bin/lipo -archs "$stata_real" | /usr/bin/grep -qw x86_64
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Download exact ARM-qualified candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: texpdf-macos-universal-${{ inputs.source_sha }}-${{ inputs.arm_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.arm_run_id }}

      - name: Require identical ARM-qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          targets = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "texpdf-targets.json").read_text(
                  encoding="utf-8"
              )
          )["targets"]
          arm = targets["aarch64-apple-darwin"]
          manifest = json.loads(
              Path("dist/macos-universal/manifest.json").read_text(encoding="utf-8")
          )
          package = json.loads(
              Path("dist/macos-universal/package-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          scope = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "texpdf-release-scope.json").read_text(
                  encoding="utf-8"
              )
          )
          if scope.get("candidate_source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("release scope belongs to another source SHA")
          if scope.get("candidate_version") != package.get("package_version"):
              raise SystemExit("universal package version differs from release scope")
          expected_public_release = scope.get("public_distribution_enabled") is True
          if package.get("public_release_mode") is not expected_public_release:
              raise SystemExit("universal package publication mode differs from release scope")
          expected = {
              "universal_build_source_sha": os.environ["SOURCE_SHA"],
              "universal_plugin_sha256": manifest["universal"]["sha256"],
              "universal_plugin_size_bytes": manifest["universal"]["size_bytes"],
              "universal_arm_slice_sha256": manifest["slices"]["arm64"]["sha256"],
              "universal_arm_runtime_qualified": True,
              "candidate_package_sha256": package["package_zip_sha256"],
              "candidate_package_size_bytes": package["package_zip_size_bytes"],
              "candidate_package_version": package["package_version"],
              "candidate_package_license_evidence_included": True,
              "candidate_package_public_release": expected_public_release,
          }
          if str(manifest.get("source_sha", os.environ["SOURCE_SHA"])) != os.environ["SOURCE_SHA"]:
              raise SystemExit("downloaded universal manifest belongs to another source SHA")
          mismatches = {
              key: {"expected": value, "actual": arm.get(key)}
              for key, value in expected.items()
              if arm.get(key) != value
          }
          if mismatches:
              raise SystemExit(
                  "candidate differs from exact ARM-qualified bytes: "
                  + json.dumps(mismatches, sort_keys=True)
              )
          print(
              "TEXPDF_IDENTICAL_ARM_CANDIDATE "
              f"zip_sha256={package['package_zip_sha256']} "
              f"plugin_sha256={manifest['universal']['sha256']}"
          )
          PY

      - name: Run actual x86_64 Stata process
        shell: bash
        run: |
          set -euo pipefail
          cp dist/macos-universal/_texpdf_plugin_macosx.plugin stata/_texpdf_plugin_macosx.plugin
          git add -f stata/_texpdf_plugin_macosx.plugin
          wrapper="$RUNNER_TEMP/texpdf-stata-x86_64"
          cat > "$wrapper" <<'SH'
          #!/bin/bash
          exec /usr/bin/arch -x86_64 /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp "$@"
          SH
          chmod +x "$wrapper"
          export STATA_BIN="$wrapper"
          export TEXPDF_STATA_PACKAGE_DIR="$GITHUB_WORKSPACE/dist/macos-universal/texpdf"
          # workflow_dispatch keeps GITHUB_SHA pinned to the workflow definition,
          # while this job deliberately checks out and tests SOURCE_SHA.
          GITHUB_SHA="$SOURCE_SHA" /bin/bash ci/run_stata_ci.sh quick
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$SOURCE_SHA" \
            --expect-profile quick \
            --require-success
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          receipt = json.loads(
              Path(".ci/stata/run/receipt.json").read_text(encoding="utf-8")
          )
          if "Intel" not in str(receipt.get("platform")):
              raise SystemExit(
                  f"Stata did not report an Intel process: {receipt.get('platform')}"
              )
          PY

      - name: Build exact Intel runtime record
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          receipt = json.loads(Path(".ci/stata/run/receipt.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("dist/macos-universal/manifest.json").read_text(encoding="utf-8"))
          package = json.loads(Path("dist/macos-universal/package-manifest.json").read_text(encoding="utf-8"))
          source = os.environ["SOURCE_SHA"]
          if receipt.get("tested_sha") != source or receipt.get("status") != "success":
              raise SystemExit("Intel Stata receipt is not exact and green")
          record = {
              "schema_version": 1,
              "source_sha": source,
              "runtime": "macOS x86_64 Stata process under Rosetta",
              "qualified": True,
              "receipt": receipt,
              "universal_plugin_size_bytes": manifest["universal"]["size_bytes"],
              "universal_plugin_sha256": manifest["universal"]["sha256"],
              "intel_slice_size_bytes": manifest["slices"]["x86_64"]["size_bytes"],
              "intel_slice_sha256": manifest["slices"]["x86_64"]["sha256"],
              "intel_helper_size_bytes": manifest["slices"]["x86_64"]["embedded_helper"]["size_bytes"],
              "intel_helper_sha256": manifest["slices"]["x86_64"]["embedded_helper"]["sha256"],
              "candidate_package_version": package["package_version"],
              "candidate_package_size_bytes": package["package_zip_size_bytes"],
              "candidate_package_sha256": package["package_zip_sha256"],
              "candidate_package_license_evidence_included": package["license_evidence_included"],
              "candidate_package_license_audit_source_sha": package["license_audit_source_sha"],
              "candidate_package_public_release": package["public_release_mode"],
          }
          Path("release/macos-intel-runtime.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          manifest["source_sha"] = source
          manifest["arm_runtime_qualified"] = True
          manifest["arm_runtime_source_sha"] = source
          manifest["intel_runtime_qualified"] = True
          manifest["intel_runtime_source_sha"] = source
          manifest["candidate_package"] = {
              "version": package["package_version"],
              "zip_sha256": package["package_zip_sha256"],
              "zip_size_bytes": package["package_zip_size_bytes"],
              "license_evidence_included": package["license_evidence_included"],
              "license_audit_source_sha": package["license_audit_source_sha"],
              "public_release": package["public_release_mode"],
              "arm_and_intel_runtime_tested": True,
          }
          manifest["qualification_boundary"] = (
              "Both slices were built from the exact source. The universal plugin was "
              "loaded and exercised in licensed ARM64 and x86_64 Stata/MP 18 processes."
          )
          Path("release/macos-universal.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Publish exact Intel qualification
        shell: bash
        run: |
          set -euo pipefail
          record="$GITHUB_WORKSPACE/release/macos-intel-runtime.json"
          universal="$GITHUB_WORKSPACE/release/macos-universal.json"
          publish_tree="$RUNNER_TEMP/texpdf-intel-publish"
          git fetch origin main
          git worktree add --detach "$publish_tree" origin/main
          trap 'git -C "$GITHUB_WORKSPACE" worktree remove --force "$publish_tree" 2>/dev/null || true' EXIT
          cp "$record" "$publish_tree/release/macos-intel-runtime.json"
          cp "$universal" "$publish_tree/release/macos-universal.json"
          /usr/bin/python3 - \
            "$publish_tree/release/targets.json" \
            "$record" \
            "$universal" <<'PY'
          from pathlib import Path
          import json
          import sys

          path = Path(sys.argv[1])
          registry = json.loads(path.read_text(encoding="utf-8"))
          record = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          universal = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          candidate = universal["candidate_package"]
          arm = registry["targets"]["aarch64-apple-darwin"]
          arm.update({
              "candidate_package_sha256": candidate["zip_sha256"],
              "candidate_package_size_bytes": candidate["zip_size_bytes"],
              "candidate_package_version": candidate["version"],
              "candidate_package_license_evidence_included": candidate[
                  "license_evidence_included"
              ],
              "candidate_package_public_release": candidate["public_release"],
          })
          intel_slice = universal["slices"]["x86_64"]
          universal_plugin = universal["universal"]
          target = registry["targets"]["x86_64-apple-darwin"]
          target.update({
              "artifact": "_texpdf_plugin_macosx.plugin",
              "build_qualified": True,
              "build_source_sha": record["source_sha"],
              "plugin_sha256": intel_slice["sha256"],
              "plugin_size_bytes": intel_slice["size_bytes"],
              "embedded_helper_sha256": intel_slice["embedded_helper"]["sha256"],
              "embedded_helper_size_bytes": intel_slice["embedded_helper"]["size_bytes"],
              "universal_plugin_sha256": universal_plugin["sha256"],
              "universal_plugin_size_bytes": universal_plugin["size_bytes"],
              "qualified_source_sha": record["source_sha"],
              "qualification_profile": "licensed x86_64 Stata quick",
              "stata_runtime_qualified": True,
              "stata_version": record["receipt"].get("stata_version"),
              "stata_edition": record["receipt"].get("stata_edition"),
              "runtime_plugin_sha256": record["universal_plugin_sha256"],
              "runtime_plugin_size_bytes": record["universal_plugin_size_bytes"],
              "runtime_helper_sha256": record["intel_helper_sha256"],
              "runtime_helper_size_bytes": record["intel_helper_size_bytes"],
              "candidate_package_sha256": record["candidate_package_sha256"],
              "candidate_package_size_bytes": record["candidate_package_size_bytes"],
              "candidate_package_version": record["candidate_package_version"],
              "candidate_package_license_evidence_included": record[
                  "candidate_package_license_evidence_included"
              ],
              "candidate_package_public_release": record[
                  "candidate_package_public_release"
              ],
              "status": "qualified in an actual x86_64 Stata process under Rosetta",
          })
          path.write_text(json.dumps(registry, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git -C "$publish_tree" config user.name "github-actions[bot]"
          git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_tree" add release/macos-intel-runtime.json release/macos-universal.json release/targets.json
          git -C "$publish_tree" commit -m "ci(target): qualify macOS Intel Stata runtime [skip ci]"
          git -C "$publish_tree" push origin HEAD:main

      - name: Upload exact Intel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-macos-intel-${{ inputs.source_sha }}-${{ github.run_id }}
          path: |
            .ci/stata/run/
            dist/macos-universal/manifest.json
            dist/macos-universal/package-manifest.json
            dist/macos-universal/texpdf-macos-universal-0.1.0-rc.2.zip
            release/macos-intel-runtime.json
          if-no-files-found: warn
          retention-days: 90
