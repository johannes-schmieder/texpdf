name: Harden output replacement once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harden-output-install-once.yml"

concurrency:
  group: texpdf-harden-output-install
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harden:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: quick
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch output installation transaction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/texpdf-core/src/compile.rs")
          text = path.read_text(encoding="utf-8")
          old = '''    if output.exists() {
        fs::remove_file(&output)
            .map_err(|error| TexPdfError::io("cannot replace existing output", error))?;
    }
    fs::rename(&generated_pdf, &output)
        .map_err(|error| TexPdfError::io("cannot install compiled PDF", error))?;
'''
          new = '''    install_compiled_file(&generated_pdf, &output, "compiled PDF")?;
'''
          if old not in text:
              if "install_compiled_file(&generated_pdf" not in text:
                  raise SystemExit("cannot locate the existing PDF installation block")
          else:
              text = text.replace(old, new, 1)

          helper_anchor = "fn absolute_path(path: &Path) -> Result<PathBuf, TexPdfError> {\n"
          helper = r'''
          fn install_compiled_file(
              staged: &Path,
              destination: &Path,
              description: &str,
          ) -> Result<(), TexPdfError> {
              #[cfg(not(windows))]
              {
                  // POSIX rename atomically replaces a file in the same filesystem.
                  // Staging is created in the output directory precisely to preserve
                  // this guarantee.
                  fs::rename(staged, destination).map_err(|error| {
                      TexPdfError::io(format!("cannot install {description}"), error)
                  })
              }

              #[cfg(windows)]
              {
                  if !destination.exists() {
                      return fs::rename(staged, destination).map_err(|error| {
                          TexPdfError::io(format!("cannot install {description}"), error)
                      });
                  }

                  let parent = destination.parent().ok_or_else(|| {
                      TexPdfError::Bundle("output destination has no parent directory".to_owned())
                  })?;
                  let backup_directory = tempfile::Builder::new()
                      .prefix(".texpdf-replace-")
                      .tempdir_in(parent)
                      .map_err(|error| {
                          TexPdfError::io(
                              format!("cannot create backup for existing {description}"),
                              error,
                          )
                      })?;
                  let backup = backup_directory.path().join("previous-output");
                  fs::rename(destination, &backup).map_err(|error| {
                      TexPdfError::io(
                          format!("cannot protect existing {description} before replacement"),
                          error,
                      )
                  })?;

                  match fs::rename(staged, destination) {
                      Ok(()) => Ok(()),
                      Err(install_error) => {
                          if let Err(restore_error) = fs::rename(&backup, destination) {
                              return Err(TexPdfError::io(
                                  format!(
                                      "cannot install {description}; restoring the previous file also failed: {restore_error}"
                                  ),
                                  install_error,
                              ));
                          }
                          Err(TexPdfError::io(
                              format!(
                                  "cannot install {description}; the previous file was restored"
                              ),
                              install_error,
                          ))
                      }
                  }
              }
          }

          '''
          if "fn install_compiled_file(" not in text:
              if helper_anchor not in text:
                  raise SystemExit("cannot locate helper insertion anchor")
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/harden-output-install-once.yml").unlink()
          PY

          git add crates/texpdf-core/src/compile.rs
          git add -u .github/workflows/harden-output-install-once.yml

      - name: Format, build, and test real engine
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh

      - name: Preserve Rust evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-output-rust-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          cp -R .ci/stata/run/. "$evidence/"
          cp bundle/generated/bundle-info.json "$evidence/"

      - name: Run licensed Stata comprehensive profile
        shell: bash
        run: /bin/bash ci/run_stata_ci.sh quick

      - name: Restore and validate evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-output-rust-evidence"
          mkdir -p .ci/stata/run
          if [[ -d "$evidence" ]]; then cp -R "$evidence/." .ci/stata/run/; fi
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success

      - name: Commit hardened output replacement
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin dist 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf dist .ci/stata/run bundle/generated
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(core): preserve existing output during replacement"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
