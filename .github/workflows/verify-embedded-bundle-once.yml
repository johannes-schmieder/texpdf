name: Verify embedded bundle bytes at runtime once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-embedded-bundle-once.yml"

concurrency:
  group: texpdf-verify-embedded-bundle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: quick
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add runtime ZIP integrity validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          workspace = Path("Cargo.toml")
          text = workspace.read_text(encoding="utf-8")
          if '\nsha2 = "0.10"\n' not in text:
              anchor = 'serde_json = "1.0"\n'
              if anchor not in text:
                  raise SystemExit("cannot locate workspace dependency anchor")
              text = text.replace(anchor, anchor + 'sha2 = "0.10"\n', 1)
              workspace.write_text(text, encoding="utf-8")

          crate = Path("crates/texpdf-core/Cargo.toml")
          text = crate.read_text(encoding="utf-8")
          if "sha2.workspace = true" not in text:
              anchor = "serde_json.workspace = true\n"
              if anchor not in text:
                  raise SystemExit("cannot locate core dependency anchor")
              text = text.replace(anchor, anchor + "sha2.workspace = true\n", 1)
              crate.write_text(text, encoding="utf-8")

          source = Path("crates/texpdf-core/src/bundle.rs")
          text = source.read_text(encoding="utf-8")
          if "use sha2::{Digest, Sha256};" not in text:
              anchor = "use serde::Deserialize;\n"
              if anchor not in text:
                  raise SystemExit("cannot locate bundle import anchor")
              text = text.replace(anchor, anchor + "use sha2::{Digest, Sha256};\n", 1)

          old = '''    match BUNDLE_INFO.get_or_init(|| {
        serde_json::from_str(BUNDLE_INFO_TEXT)
            .map_err(|error| format!("cannot parse bundle-info.json: {error}"))
    }) {
'''
          new = '''    match BUNDLE_INFO.get_or_init(parse_and_validate_bundle_info) {
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "get_or_init(parse_and_validate_bundle_info)" not in text:
              raise SystemExit("cannot locate bundle metadata initializer")

          helper_anchor = "/// Return validated metadata for the embedded bundle.\n"
          helper = '''fn parse_and_validate_bundle_info() -> Result<BundleInfo, String> {
    let info: BundleInfo = serde_json::from_str(BUNDLE_INFO_TEXT)
        .map_err(|error| format!("cannot parse bundle-info.json: {error}"))?;
    if info.zip_size_bytes != BUNDLE_BYTES.len() as u64 {
        return Err(format!(
            "embedded ZIP byte length mismatch: metadata={}, actual={}",
            info.zip_size_bytes,
            BUNDLE_BYTES.len()
        ));
    }
    let actual_sha256 = format!("{:x}", Sha256::digest(BUNDLE_BYTES));
    if actual_sha256 != info.zip_sha256 {
        return Err(format!(
            "embedded ZIP SHA-256 mismatch: metadata={}, actual={actual_sha256}",
            info.zip_sha256
        ));
    }
    Ok(info)
}

'''
          if "fn parse_and_validate_bundle_info()" not in text:
              if helper_anchor not in text:
                  raise SystemExit("cannot locate bundle helper insertion anchor")
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          source.write_text(text, encoding="utf-8")
          Path(".github/workflows/verify-embedded-bundle-once.yml").unlink()
          PY

          git add Cargo.toml crates/texpdf-core/Cargo.toml \
            crates/texpdf-core/src/bundle.rs
          git add -u .github/workflows/verify-embedded-bundle-once.yml

      - name: Build, lint, and test real engine
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh

      - name: Preserve Rust evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-integrity-rust-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          cp -R .ci/stata/run/. "$evidence/"
          cp bundle/generated/bundle-info.json "$evidence/"

      - name: Verify runtime integrity through licensed Stata
        shell: bash
        run: /bin/bash ci/run_stata_ci.sh quick

      - name: Restore and validate evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-integrity-rust-evidence"
          mkdir -p .ci/stata/run
          if [[ -d "$evidence" ]]; then cp -R "$evidence/." .ci/stata/run/; fi
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success

      - name: Commit runtime integrity verification
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin dist 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf dist .ci/stata/run bundle/generated
          git add Cargo.lock
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: verify embedded bundle bytes at runtime"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
