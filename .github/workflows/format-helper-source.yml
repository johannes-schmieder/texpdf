name: Format and lock embedded-helper source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-helper-source.yml"

concurrency:
  group: texpdf-format-helper-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve registry graph, update path packages, and format
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          export RUSTC="$($rustup_bin which --toolchain 1.97.1 rustc)"
          export PATH="$(dirname "$cargo_bin"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          "$cargo_bin" metadata --format-version 1 >/dev/null
          /usr/bin/python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock <<'PY'
          from pathlib import Path
          import re
          import sys

          package_blocks = re.compile(
              r"^\[\[package\]\]\n(.*?)(?=^\[\[package\]\]|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          fields = re.compile(r'^([a-z_]+) = "([^"]*)"$', re.MULTILINE)

          def external(path):
              values = set()
              for block in package_blocks.findall(Path(path).read_text(encoding="utf-8")):
                  item = dict(fields.findall(block))
                  if item.get("source"):
                      values.add(
                          (
                              item.get("name"),
                              item.get("version"),
                              item.get("source"),
                              item.get("checksum"),
                          )
                      )
              return values

          before = external(sys.argv[1])
          after = external(sys.argv[2])
          if before != after:
              raise SystemExit(
                  f"registry graph changed; added={sorted(after-before)} removed={sorted(before-after)}"
              )
          lock = Path(sys.argv[2]).read_text(encoding="utf-8")
          for name in ("texpdf-helper", "texpdf-protocol", "texpdf-stata"):
              if f'name = "{name}"' not in lock:
                  raise SystemExit(f"lockfile lacks {name}")
          PY
          "$cargo_bin" fmt --all

      - name: Commit formatted source and remove temporary gates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-helper-lock.yml
          rm -f .github/workflows/update-helper-lock-v2.yml
          rm -f .github/workflows/format-helper-source.yml
          git add Cargo.lock Cargo.toml crates ci/run_rust_quick.sh .github/workflows/stata-ci.yml
          git add -u .github/workflows/update-helper-lock.yml \
            .github/workflows/update-helper-lock-v2.yml \
            .github/workflows/format-helper-source.yml || true
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format and lock embedded helper source"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
