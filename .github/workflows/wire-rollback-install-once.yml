name: Wire rollback-safe output installation once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wire-rollback-install-once.yml"

concurrency:
  group: texpdf-output-install-safety
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 120
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wire transactional installer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          lib_path = Path("crates/texpdf-core/src/lib.rs")
          lib = lib_path.read_text(encoding="utf-8")
          if "mod install;" not in lib:
              anchor = "mod error;\n"
              if anchor not in lib:
                  raise SystemExit("cannot locate core module list")
              lib = lib.replace(anchor, anchor + "mod install;\n", 1)
              lib_path.write_text(lib, encoding="utf-8")

          compile_path = Path("crates/texpdf-core/src/compile.rs")
          text = compile_path.read_text(encoding="utf-8")
          old_import = '''    diagnostics::DiagnosticCollector,
    CompileRequest, CompileResult, TexPdfError, TECTONIC_VERSION,
'''
          new_import = '''    diagnostics::DiagnosticCollector,
    install::install_file,
    CompileRequest, CompileResult, TexPdfError, TECTONIC_VERSION,
'''
          if new_import not in text:
              if text.count(old_import) != 1:
                  raise SystemExit("cannot locate compile import block")
              text = text.replace(old_import, new_import, 1)

          output_preflight_anchor = '''        if !request.replace {
            return Err(TexPdfError::OutputExists(output));
        }
    }

    let input_dir = input
'''
          output_preflight_replacement = '''        if !request.replace {
            return Err(TexPdfError::OutputExists(output));
        }
    }
    if request.keep_log {
        let output_log = output.with_extension("log");
        if output_log.exists() && !request.replace {
            return Err(TexPdfError::OutputExists(output_log));
        }
    }

    let input_dir = input
'''
          if output_preflight_replacement not in text:
              if text.count(output_preflight_anchor) != 1:
                  raise SystemExit("cannot locate output preflight block")
              text = text.replace(output_preflight_anchor, output_preflight_replacement, 1)

          old_pdf = '''    if output.exists() {
        fs::remove_file(&output)
            .map_err(|error| TexPdfError::io("cannot replace existing output", error))?;
    }
    fs::rename(&generated_pdf, &output)
        .map_err(|error| TexPdfError::io("cannot install compiled PDF", error))?;
'''
          new_pdf = '''    install_file(&generated_pdf, &output, "cannot install compiled PDF")?;
'''
          if new_pdf not in text:
              if text.count(old_pdf) != 1:
                  raise SystemExit("cannot locate PDF installation block")
              text = text.replace(old_pdf, new_pdf, 1)

          old_log = '''            if output_log.exists() && request.replace {
                fs::remove_file(&output_log)
                    .map_err(|error| TexPdfError::io("cannot replace existing log", error))?;
            }
            fs::rename(generated_log, output_log)
                .map_err(|error| TexPdfError::io("cannot install TeX log", error))?;
'''
          new_log = '''            install_file(&generated_log, &output_log, "cannot install TeX log")?;
'''
          if new_log not in text:
              if text.count(old_log) != 1:
                  raise SystemExit("cannot locate log installation block")
              text = text.replace(old_log, new_log, 1)
          compile_path.write_text(text, encoding="utf-8")
          Path(".github/workflows/wire-rollback-install-once.yml").unlink(missing_ok=True)
          PY
          git add crates/texpdf-core/src/lib.rs crates/texpdf-core/src/compile.rs \
            crates/texpdf-core/src/install.rs
          git add -u .github/workflows/wire-rollback-install-once.yml

      - name: Run full Rust and licensed Stata qualification
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/record_rust_quick.sh
          rm -rf "$RUNNER_TEMP/texpdf-install-rust"
          mkdir -p "$RUNNER_TEMP/texpdf-install-rust"
          cp -R .ci/stata/run/. "$RUNNER_TEMP/texpdf-install-rust/"
          /bin/bash ci/run_stata_ci.sh quick
          cp -R "$RUNNER_TEMP/texpdf-install-rust/." .ci/stata/run/
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json \
            .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success

      - name: Commit rollback-safe implementation
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin 2>/dev/null || true
          rm -rf stata/_texpdf_plugin.plugin .ci/stata/run bundle/generated
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(core): make output replacement rollback-safe"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "failed to publish rollback-safe output installation" >&2
          exit 1
