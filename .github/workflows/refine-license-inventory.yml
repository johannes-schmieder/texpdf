name: Refine embedded resource license inventory once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-license-inventory.yml"

concurrency:
  group: texpdf-generate-license-inventory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refine:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refine runtime ownership rules
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/generate_license_inventory.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'FILE_SECTIONS = {"runfiles", "docfiles", "srcfiles", "binfiles"}',
              'FILE_SECTIONS = {"runfiles", "binfiles"}',
          )
          old = '''        elif "ambiguous" in method:
            status = "ambiguous"
        else:
            status = "mapped"
'''
          new = '''        elif "ambiguous" in method and len(licenses) > 1:
            status = "ambiguous"
        else:
            if "ambiguous" in method:
                method += "-same-license-conservative"
            status = "mapped"
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("cannot locate conservative ambiguity rule")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Download locked TeX Live metadata
        shell: bash
        run: |
          set -euo pipefail
          cache="${TEXPDF_LICENSE_CACHE:-/private/tmp/texpdf-license-cache}"
          mkdir -p "$cache"
          /usr/bin/python3 - "$cache" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import sys
          import urllib.request

          cache = Path(sys.argv[1])
          lock_path = Path("bundle/license-sources.lock.json")
          if lock_path.is_file():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              url = lock["url"]
              expected = lock["sha256"]
          else:
              url = "https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2022/tlnet-final/tlpkg/texlive.tlpdb.xz"
              expected = ""
          destination = cache / "texlive-2022-final.tlpdb.xz"
          if destination.is_file():
              actual = hashlib.sha256(destination.read_bytes()).hexdigest()
              if expected and actual != expected:
                  destination.unlink()
          if not destination.is_file():
              temporary = destination.with_suffix(destination.suffix + ".part")
              temporary.unlink(missing_ok=True)
              request = urllib.request.Request(url, headers={"User-Agent": "texpdf-license-inventory/0.1"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  with temporary.open("wb") as output:
                      while chunk := response.read(1024 * 1024):
                          output.write(chunk)
              actual = hashlib.sha256(temporary.read_bytes()).hexdigest()
              if expected and actual != expected:
                  temporary.unlink(missing_ok=True)
                  raise SystemExit(f"TeX Live metadata checksum mismatch: {actual}")
              os.replace(temporary, destination)
          print(destination)
          Path(os.environ["GITHUB_ENV"]).write_text(
              f"TEXPDF_TLPDB_PATH={destination}\n",
              encoding="utf-8",
              errors="strict",
          )
          PY

      - name: Regenerate inventory and residual review
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/generate_license_inventory.py \
            --manifest bundle/curated-manifest.json \
            --tlpdb "$TEXPDF_TLPDB_PATH" \
            --overrides bundle/license-overrides.toml \
            --output bundle/LICENSE_INVENTORY.json \
            --markdown bundle/LICENSE_INVENTORY.md
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          inventory = json.loads(Path("bundle/LICENSE_INVENTORY.json").read_text(encoding="utf-8"))
          summary = inventory["summary"]
          review = [row for row in inventory["resources"] if row["status"] != "mapped"]
          Path("bundle/LICENSE_REVIEW.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "summary": summary,
                      "resources": review,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          status = f'''# Embedded resource license-mapping status

- Total embedded resources: {summary["resource_count"]}
- Unambiguously/conservatively mapped: {summary["mapped"]}
- Ambiguous license mappings: {summary["ambiguous"]}
- Unmapped resources: {summary["unmapped"]}
- Mappings missing a license code: {summary["missing_license"]}

`LICENSE_REVIEW.json` contains every remaining item. A public binary release is
blocked until all three residual counts are zero and the required license texts
and notices are included in the installation package.
'''
          Path("bundle/LICENSE_STATUS.md").write_text(status, encoding="utf-8")
          marker = Path("bundle/LICENSE_MAPPING_COMPLETE")
          unresolved = summary["ambiguous"] + summary["unmapped"] + summary["missing_license"]
          if unresolved == 0 and summary["resource_count"] == 477:
              marker.write_text("all 477 embedded resources have package/component license mappings\n", encoding="utf-8")
          else:
              marker.unlink(missing_ok=True)
          print("TEXPDF_LICENSE_REVIEW", summary)
          PY

      - name: Commit refined inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/generate-license-inventory.yml
          rm -f .github/workflows/refine-license-inventory.yml
          git add tools/generate_license_inventory.py bundle/LICENSE_INVENTORY.json \
            bundle/LICENSE_INVENTORY.md bundle/LICENSE_REVIEW.json \
            bundle/LICENSE_STATUS.md bundle/LICENSE_MAPPING_COMPLETE 2>/dev/null || true
          git add -u .github/workflows/generate-license-inventory.yml \
            .github/workflows/refine-license-inventory.yml || true
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refine embedded resource license mapping"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "failed to publish refined license inventory" >&2
          exit 1
