          name: Sync project state after exact green CI

          on:
            workflow_run:
              workflows:
                - Licensed Stata and Rust CI
              types:
                - completed

          concurrency:
            group: texpdf-sync-project-state
            cancel-in-progress: false

          permissions:
            contents: write

          jobs:
            sync:
              if: ${{ github.event.workflow_run.conclusion == 'success' }}
              runs-on: [self-hosted, macOS, ARM64, texpdf]
              timeout-minutes: 20
              env:
                TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
              steps:
                - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                  with:
                    ref: main
                    fetch-depth: 0
                - name: Wait for exact receipt and synchronize
                  shell: bash
                  run: |
                    set -euo pipefail
                    git fetch origin main
                    git reset --hard origin/main
                    receipt=".ci/stata/results/$TESTED_SHA.json"
                    if [[ ! -f "$receipt" ]]; then
                      echo "Exact receipt is not committed for $TESTED_SHA; refusing to infer success" >&2
                      exit 2
                    fi
                    /usr/bin/python3 ci/check_stata_receipt.py \
                      "$receipt" \
                      --expect-tested-sha "$TESTED_SHA" \
                      --expect-profile quick \
                      --require-success \
                      --require-rust-success
                    /usr/bin/python3 tools/sync_project_state.py
                - name: Commit generated state if changed
                  shell: bash
                  run: |
                    set -euo pipefail
                    git add STATUS.md PLAN.md IMPLEMENTATION.md README.md
                    git add docs/V1_READINESS.md docs/WORKFLOWS.md
                    git add release/V1_READINESS.json
                    if git diff --cached --quiet; then
                      exit 0
                    fi
                    git diff --cached --check
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git commit -m "docs: sync exact-SHA project state [skip ci]"
                    git fetch origin main
                    git rebase origin/main
                    git push origin HEAD:main
          YAML

