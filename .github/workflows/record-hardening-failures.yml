name: Record hardening workflow failures

on:
  workflow_run:
    workflows:
      - Pin Cargo.lock once
      - Generate TeX resource license inventory once
      - Refine embedded resource license inventory once
      - Generate Rust dependency license inventory once
      - Collect static native dependency notices once
      - Include provenance notices in Stata package once
      - Validate exact manifest-driven bundle rebuild once
      - Validate exact bundle metadata rebuild v2
      - Optimize standalone plugin size once
      - Wire rollback-safe output installation once
      - Wire plugin ABI smoke into builds once
      - Record macOS ARM64 memory stress once
      - Qualify macOS universal plugin once
      - Qualify both macOS universal runtime slices once
      - Keep release audit on self-hosted runner once
      - Enable latest-checkpoint normal CI once
    types:
      - completed

concurrency:
  group: texpdf-hardening-failure-receipts
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
      FAILED_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Write sanitized job/step receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["FAILED_RUN_ID"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "texpdf-hardening-failure-recorder",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              jobs_payload = json.load(response)

          jobs = []
          failed_steps = []
          for job in jobs_payload.get("jobs", []):
              steps = []
              for step in job.get("steps", []):
                  row = {
                      "number": step.get("number"),
                      "name": step.get("name"),
                      "status": step.get("status"),
                      "conclusion": step.get("conclusion"),
                  }
                  steps.append(row)
                  if row["conclusion"] == "failure":
                      failed_steps.append(f"{job.get('name')}: {row['name']}")
              jobs.append(
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "started_at": job.get("started_at"),
                      "completed_at": job.get("completed_at"),
                      "steps": steps,
                  }
              )

          payload = {
              "schema_version": 1,
              "repository": repository,
              "workflow": os.environ["FAILED_RUN_NAME"],
              "run_id": int(run_id),
              "run_attempt": int(os.environ["FAILED_RUN_ATTEMPT"]),
              "head_sha": os.environ["FAILED_RUN_HEAD_SHA"],
              "conclusion": "failure",
              "url": os.environ["FAILED_RUN_URL"],
              "failed_steps": failed_steps,
              "jobs": jobs,
          }
          output = Path(f".ci/hardening-failures/{run_id}.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("TEXPDF_HARDENING_FAILURE_RECEIPT", output, failed_steps)
          PY

      - name: Commit immutable failure receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/hardening-failures/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record hardening failure $FAILED_RUN_ID [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
