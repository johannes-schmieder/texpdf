The public release process is fail-closed. Development artifacts may be built
and retained privately, but a GitHub Release must not be published unless every
required gate below passes for the exact tagged source.

## Required gates

1. **Source and dependency lock**
   - clean tagged tree;
   - locked Cargo graph, Tectonic version, native dependency revisions, bundle
