   Release plus `net install` assets.

## Documentation hierarchy

- `STATUS.md`: current project and release-gate summary.
- `PLAN.md`: remaining milestone plan and completion checklist.
- `IMPLEMENTATION.md`: durable architecture and implemented behavior.
- `bundle/QUALIFICATION.json`: exact qualified bundle/plugin/package evidence.
- `release/targets.json`: per-target support registry.
- `.ci/stata/results/`: immutable exact-source-SHA test receipts.
'''
          Path("STATUS.md").write_text(status, encoding="utf-8")

