name: Reconcile project state once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reconcile-project-state-once.yml"

concurrency:
  group: texpdf-reconcile-project-state-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize and format Rust sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          "$rustup_bin" run 1.97.1 cargo fmt --all

      - name: Rebuild authoritative narrative documentation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from typing import Any

          REPO = "johannes-schmieder/texpdf"
          TODAY = "2026-08-24"


          def load_json(path: str) -> dict[str, Any]:
              return json.loads(Path(path).read_text(encoding="utf-8"))


          def successful_engine_receipts() -> list[dict[str, Any]]:
              receipts: list[dict[str, Any]] = []
              for path in Path(".ci/stata/results").glob("*.json"):
                  try:
                      receipt = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  if not (
                      receipt.get("status") == "success"
                      and receipt.get("stata_status") == "success"
                      and receipt.get("rust_status") == "success"
                      and receipt.get("rust_mode") == "repository-engine"
                  ):
                      continue
                  markers = receipt.get("required_log_markers", [])
                  if markers and not all(item.get("present") is True for item in markers):
                      continue
                  tested_sha = receipt.get("tested_sha")
                  if not isinstance(tested_sha, str) or len(tested_sha) != 40:
                      continue
                  receipts.append(receipt)
              receipts.sort(key=lambda item: item.get("completed_at", ""))
              return receipts


          receipts = successful_engine_receipts()
          if not receipts:
              raise SystemExit("no exact-SHA successful repository-engine receipt is available")
          green = receipts[-1]
          green_sha = green["tested_sha"]
          markers = [
              item["marker"]
              for item in green.get("required_log_markers", [])
              if item.get("present") is True
          ]

          qualification = load_json("bundle/QUALIFICATION.json")
          targets = load_json("release/targets.json").get("targets", {})
          arm = targets.get("aarch64-apple-darwin", {})
          arm_runtime = arm.get("stata_runtime_qualified") is True

          bundle_bytes = int(
              arm.get("bundle_zip_size_bytes")
              or qualification.get("bundle", {}).get("zip_size_bytes")
              or 0
          )
          plugin_bytes = int(
              arm.get("plugin_size_bytes")
              or qualification.get("plugin", {}).get("size_bytes")
              or 0
          )
          package_zip_bytes = int(
              qualification.get("package", {}).get("zip_size_bytes") or 0
          )
          installed_bytes = int(
              qualification.get("package", {}).get("installed_size_bytes") or 0
          )
          bundle_files = int(
              qualification.get("bundle", {}).get("file_count") or 0
          )
          bundle_sha = (
              arm.get("bundle_zip_sha256")
              or qualification.get("bundle", {}).get("zip_sha256")
              or ""
          )
          plugin_sha = (
              arm.get("plugin_sha256")
              or qualification.get("plugin", {}).get("sha256")
              or ""
          )


          def mib(value: int) -> str:
              return f"{value / 1024 / 1024:.2f} MiB"


          target_rows = []
          target_labels = {
              "aarch64-apple-darwin": "macOS Apple Silicon",
              "x86_64-apple-darwin": "macOS Intel",
              "x86_64-pc-windows-msvc": "Windows x86-64",
              "x86_64-unknown-linux-gnu": "Linux x86-64",
          }
          for triple, label in target_labels.items():
              record = targets.get(triple, {})
              runtime = "qualified" if record.get("stata_runtime_qualified") else "pending"
              build = record.get("status", "pending")
              target_rows.append(f"| {label} | `{triple}` | {runtime} | {build} |")
          target_table = "\n".join(target_rows)

          marker_lines = "\n".join(f"- `{marker}`" for marker in markers) or "- none recorded"

          status = f'''# texpdf development status

Updated: {TODAY}

## Executive status

The compiler-only **macOS Apple Silicon implementation is functional and
runtime-qualified in licensed Stata/MP 18**. `texpdf` is one native plugin that
contains the Rust bridge, Tectonic 0.17.0, its native dependencies, and a
curated offline TeX resource bundle.

The public command implemented today is:

```stata
