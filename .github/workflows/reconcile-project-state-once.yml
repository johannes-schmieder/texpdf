          implementation = f'''# texpdf implementation

Updated: {TODAY}

## Architecture

`texpdf` is a compiler-only Stata command backed by one native plugin per
platform:

```text
texpdf.ado
    -> Stata SPI 3.0 ABI bridge
    -> Rust texpdf-stata
    -> texpdf-core
    -> Tectonic 0.17.0 + embedded curated ZIP
    -> PDF
```

The plugin contains the Rust bridge, Tectonic's native engine components,
statically incorporated third-party libraries where required, and the curated
TeX resource ZIP. The runtime does not invoke a TeX executable, search a system
TeX tree, or fetch a remote bundle.

## Public interface

```stata
texpdf using filename.tex [, saving(filename.pdf) replace]
texpdf, version
```

The command is `rclass` and returns the PDF path, engine/version, bundle
version/digest, embedded ZIP digest, and warning count after success.

## Implemented guarantees

- complete-document compilation with paths resolved relative to the primary source;
- output installed only after successful typesetting;
- existing output preserved after a failed replacement compile;
- overwrite protection unless `replace` is specified;
- spaces and Unicode paths;
- relative `\\input` and graphics;
- structured, bounded diagnostics returned through a versioned result record;
- panic containment at the Rust ABI boundary;
- shell escape disabled;
- no runtime remote bundle provider;
- natbib and internal BibTeX support;
- deterministic package assembly and checksums;
- local Stata `net install` qualification.

## Embedded compatibility tier

The curated academic bundle covers the package corpus documented in
`docs/SUPPORTED_PACKAGES.md`, including core LaTeX, AMS mathematics, common
academic table/layout packages, hyperlinks, Latin Modern and selected TeX Gyre
fonts, figures, natbib, and BibTeX styles. Beamer, TikZ/PGF, PSTricks,
biblatex/Biber, minted, shell-dependent packages, and arbitrary helper programs
are outside v1.

## Exact qualification boundary

The newest exact full-engine green source identified from immutable receipts is:

```text
{green_sha}
```

Its receipt reports overall `{green.get("status", "")}`, Stata
`{green.get("stata_status", "")}`, Rust `{green.get("rust_status", "")}`, and
Rust mode `{green.get("rust_mode", "")}` on macOS Apple Silicon with Stata/MP
18. Exact artifact provenance remains in `bundle/QUALIFICATION.json` and
`release/targets.json`.

Current recorded scale:

```text
curated resource ZIP   {bundle_bytes:>12,} bytes  ({mib(bundle_bytes)})
ARM64 plugin           {plugin_bytes:>12,} bytes  ({mib(plugin_bytes)})
installation ZIP       {package_zip_bytes:>12,} bytes  ({mib(package_zip_bytes)})
```

## Security and failure boundary

TeX input is active input to an in-process native engine. Shell escape is
disabled and ordinary failures are converted into controlled errors, but this
is not a sandbox for hostile TeX. The release safety gate therefore includes
malformed-input, repeated-call, memory-growth, binary-policy, and dependency
checks. See `SECURITY.md` and `docs/ERRORS.md`.

## Portability boundary

Only macOS Apple Silicon is currently licensed-Stata runtime-qualified. The
repository contains build and qualification infrastructure for macOS Intel,
Windows x86-64, and Linux x86-64, but build-only artifacts are not labeled as
supported until their final plugin passes actual Stata runtime tests.

## Licensing boundary

Project-owned source is MIT licensed. Tectonic, Rust crates, native libraries,
TeX packages, formats, and fonts retain their upstream licenses. Public binary
release is intentionally blocked until the exact embedded-resource inventory
and all required notices are complete.
'''
