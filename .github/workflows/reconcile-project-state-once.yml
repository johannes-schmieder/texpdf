   - clean-machine installation from the release location;
   - offline document compile after installation;
   - checksums and machine-readable manifests published.

## Release assets

Each supported target should provide a versioned Stata package ZIP containing
the ado/help/package metadata, exactly one target plugin, checksums, build and
qualification metadata, project license, and all third-party notices. A top-level
manifest maps target triples to assets and hashes.

## Publication sequence

- run `tools/check_release_readiness.py` against the exact candidate;
- build and qualify all advertised target artifacts;
- tag `v1.0.0` only after the candidate is green;
- create the GitHub Release with immutable assets/checksums;
- test `net install` from the published release location;
- update `STATUS.md` and `release/targets.json` with the released evidence.

At present, public release is blocked by incomplete license mapping/notices and
pending non-ARM64 runtime qualification.
