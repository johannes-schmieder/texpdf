name: Complete real-engine validation v2

on:
  push:
    branches:
      - main
    paths:
      - STATUS.md
      - ".github/workflows/complete-validation-v2.yml"

concurrency:
  group: texpdf-post-package-validation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: validation
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select action
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if /usr/bin/grep -q '^## Real-engine path and recovery validation' STATUS.md 2>/dev/null; then
            echo "action=cleanup" >> "$GITHUB_OUTPUT"
          elif /usr/bin/grep -q '^## Development installation artifact' STATUS.md 2>/dev/null; then
            echo "action=implement" >> "$GITHUB_OUTPUT"
          else
            echo "action=wait" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove redundant fallback
        if: ${{ steps.state.outputs.action == 'cleanup' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-validation.yml
          rm -f .github/workflows/complete-validation-v2.yml
          git add -u .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove completed validation fallback [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Add schema-compatible Rust/Stata validation
        if: ${{ steps.state.outputs.action == 'implement' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(text).lstrip(), encoding="utf-8")

          write("crates/texpdf-core/tests/full_engine.rs", r'''
          use std::fs;

          use texpdf_core::{compile, CompileRequest, TexPdfError};

          const ARTICLE: &str = r#"\documentclass{article}
          \begin{document}
          Hello. $\widehat\beta=(X'X)^{-1}X'y$.
          \end{document}
          "#;

          #[test]
          fn relative_include_spaces_and_unicode_paths_compile() {
              let workspace = tempfile::tempdir().expect("temporary workspace");
              let root = workspace.path().join("project space é");
              fs::create_dir_all(root.join("sections")).expect("create source tree");
              fs::write(
                  root.join("main file é.tex"),
                  r#"\documentclass{article}
          \begin{document}
          \input{sections/content.tex}
          \end{document}
          "#,
              )
              .expect("write main source");
              fs::write(
                  root.join("sections/content.tex"),
                  "Unicode path content: $\\alpha+\\beta$.",
              )
              .expect("write included source");
              let output = root.join("compiled result é.pdf");
              let result = compile(&CompileRequest::new(
                  root.join("main file é.tex"),
                  output.clone(),
              ))
              .expect("compile relative include");
              assert!(fs::read(result.output).expect("read PDF").starts_with(b"%PDF-"));
          }

          #[test]
          fn failed_recompile_preserves_existing_output() {
              let workspace = tempfile::tempdir().expect("temporary workspace");
              let input = workspace.path().join("document.tex");
              let output = workspace.path().join("document.pdf");
              fs::write(&input, ARTICLE).expect("write valid source");
              compile(&CompileRequest::new(input.clone(), output.clone()))
                  .expect("initial compile");
              let original = fs::read(&output).expect("read original PDF");

              fs::write(
                  &input,
                  "\\documentclass{article}\\begin{document}\\undefinedcommand\\end{document}",
              )
              .expect("write invalid source");
              let mut request = CompileRequest::new(input.clone(), output.clone());
              request.replace = true;
              let error = compile(&request).expect_err("invalid replacement must fail");
              assert!(matches!(error, TexPdfError::Engine { .. }));
              assert_eq!(fs::read(&output).expect("read preserved PDF"), original);
          }

          #[test]
          fn repeated_compiles_in_one_process_succeed() {
              let workspace = tempfile::tempdir().expect("temporary workspace");
              let input = workspace.path().join("repeat.tex");
              let output = workspace.path().join("repeat.pdf");
              fs::write(&input, ARTICLE).expect("write source");
              for iteration in 0..10 {
                  let mut request = CompileRequest::new(input.clone(), output.clone());
                  request.replace = iteration > 0;
                  let result = compile(&request).expect("repeated compile");
                  assert!(fs::read(result.output).expect("read PDF").starts_with(b"%PDF-"));
              }
          }

          #[test]
          fn input_cannot_also_be_output() {
              let workspace = tempfile::tempdir().expect("temporary workspace");
              let input = workspace.path().join("same.tex");
              fs::write(&input, ARTICLE).expect("write source");
              let error = compile(&CompileRequest::new(input.clone(), input.clone()))
                  .expect_err("same input/output must fail");
              assert!(matches!(error, TexPdfError::OutputIsInput(_)));
          }
          ''')

          write("ci/stata_validation.do", r'''
          version 18.0
          clear all
          set more off

          local repo `"`c(pwd)'"'
          adopath ++ `"`repo'/stata"'
          texpdf, version
          assert `"`r(engine)'"' == "tectonic"

          local runid : environment GITHUB_RUN_ID
          if `"`runid'"' == "" local runid "local"
          local root = c(tmpdir) + "/texpdf path é " + `"`runid'"'
          capture mkdir `"`root'"'
          local sections = `"`root'"' + "/sections"
          capture mkdir `"`sections'"'
          local source = `"`root'"' + "/main file é.tex"
          local part = `"`sections'"' + "/part.tex"
          local output = `"`root'"' + "/result file é.pdf"

          tempname handle
          file open `handle' using `"`source'"', write text replace
          file write `handle' "\documentclass{article}" _n
          file write `handle' "\begin{document}" _n
          file write `handle' "\input{sections/part.tex}" _n
          file write `handle' "\end{document}" _n
          file close `handle'
          file open `handle' using `"`part'"', write text replace
          file write `handle' "Relative include and Unicode path: $\alpha+\beta$." _n
          file close `handle'

          texpdf using `"`source'"', saving(`"`output'"')
          confirm file `"`output'"'
          capture noisily texpdf using `"`source'"', saving(`"`output'"')
          assert _rc == 602
          texpdf using `"`source'"', saving(`"`output'"') replace

          local bad = `"`root'"' + "/bad.tex"
          local badpdf = `"`root'"' + "/bad.pdf"
          file open `handle' using `"`bad'"', write text replace
          file write `handle' "\documentclass{article}\begin{document}\undefinedcontrolsequence\end{document}" _n
          file close `handle'
          capture noisily texpdf using `"`bad'"', saving(`"`badpdf'"')
          assert _rc == 459
          capture confirm file `"`badpdf'"'
          assert _rc != 0

          texpdf, version
          assert `"`r(engine)'"' == "tectonic"
          forvalues iteration = 1/5 {
              texpdf using `"`source'"', saving(`"`output'"') replace
              confirm file `"`output'"'
          }

          capture erase `"`source'"'
          capture erase `"`part'"'
          capture erase `"`output'"'
          capture erase `"`bad'"'
          capture erase `"`badpdf'"'
          capture rmdir `"`sections'"'
          capture rmdir `"`root'"'
          display as result "TEXPDF REAL ENGINE VALIDATION PASS"
          ''')

          write("ci/stata_stress.do", r'''
          version 18.0
          clear all
          set more off

          local iterations : environment TEXPDF_STRESS_ITERATIONS
          if `"`iterations'"' == "" local iterations "100"
          local repetitions = real(`"`iterations'"')
          assert `repetitions' >= 1
          assert `repetitions' <= 10000

          local repo `"`c(pwd)'"'
          adopath ++ `"`repo'/stata"'
          tempfile source output bad badoutput
          tempname handle
          file open `handle' using `"`source'"', write text replace
          file write `handle' "\documentclass{article}\begin{document}Stress test.\end{document}" _n
          file close `handle'
          file open `handle' using `"`bad'"', write text replace
          file write `handle' "\documentclass{article}\begin{document}\undefinedcontrolsequence\end{document}" _n
          file close `handle'

          forvalues iteration = 1/`repetitions' {
              texpdf using `"`source'"', saving(`"`output'"') replace
              confirm file `"`output'"'
              if mod(`iteration', 10) == 0 {
                  capture noisily texpdf using `"`bad'"', saving(`"`badoutput'"') replace
                  assert _rc == 459
                  texpdf, version
                  assert `"`r(engine)'"' == "tectonic"
              }
          }
          display as result "TEXPDF STRESS PASS"
          ''')

          profiles_path = Path("ci/stata_profiles.json")
          profiles = json.loads(profiles_path.read_text(encoding="utf-8"))

          def clone_profile(suite: str, marker: str, timeout: int) -> dict:
              profile = dict(profiles["quick"])
              do_keys = [
                  key for key, value in profile.items()
                  if isinstance(value, str) and value.endswith(".do")
              ]
              if len(do_keys) != 1:
                  raise SystemExit(f"cannot identify profile do-file field: {do_keys}")
              profile[do_keys[0]] = suite
              marker_keys = [key for key in profile if "marker" in key.lower()]
              if marker_keys:
                  profile[marker_keys[0]] = [marker]
              else:
                  profile["required_log_markers"] = [marker]
              timeout_keys = [key for key in profile if "timeout" in key.lower()]
              if timeout_keys:
                  profile[timeout_keys[0]] = timeout
              for key in list(profile):
                  if "arg" in key.lower():
                      profile.pop(key)
              return profile

          profiles["validation"] = clone_profile(
              "ci/stata_validation.do", "TEXPDF REAL ENGINE VALIDATION PASS", 900
          )
          profiles["stress"] = clone_profile(
              "ci/stata_stress.do", "TEXPDF STRESS PASS", 3600
          )
          profiles_path.write_text(json.dumps(profiles, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          write(".github/workflows/stress-macos.yml", r'''
          name: Manual macOS in-process stress qualification

          on:
            workflow_dispatch:
              inputs:
                iterations:
                  description: Successful compile calls (1--10000)
                  required: true
                  default: "100"

          concurrency:
            group: texpdf-macos-stress
            cancel-in-progress: false

          permissions:
            contents: read

          jobs:
            stress:
              runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
              timeout-minutes: 180
              env:
                STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
                TEXPDF_RUST_PROFILE: engine
                TEXPDF_STRESS_ITERATIONS: ${{ inputs.iterations }}
                CARGO_TERM_COLOR: always
                RUST_BACKTRACE: "1"
              steps:
                - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                - name: Validate iteration input
                  run: |
                    case "$TEXPDF_STRESS_ITERATIONS" in
                      ''|*[!0-9]*) exit 2 ;;
                    esac
                    test "$TEXPDF_STRESS_ITERATIONS" -ge 1
                    test "$TEXPDF_STRESS_ITERATIONS" -le 10000
                - name: Build real plugin and run Rust suite
                  run: /bin/bash ci/record_rust_quick.sh
                - name: Run licensed Stata stress profile
                  run: /bin/bash ci/run_stata_ci.sh stress
                - name: Validate stress receipt
                  run: >-
                    /usr/bin/python3 ci/check_stata_receipt.py
                    .ci/stata/run/receipt.json
                    --expect-tested-sha "$GITHUB_SHA"
                    --expect-profile stress
                    --require-success
                - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
                  with:
                    name: texpdf-stress-${{ github.sha }}-${{ github.run_id }}
                    path: .ci/stata/run/
                    if-no-files-found: error
                    retention-days: 30
          ''')

          for path in (
              ".github/workflows/complete-validation.yml",
              ".github/workflows/complete-validation-v2.yml",
          ):
              Path(path).unlink(missing_ok=True)
          PY

          git add crates/texpdf-core/tests/full_engine.rs ci/stata_validation.do \
            ci/stata_stress.do ci/stata_profiles.json .github/workflows/stress-macos.yml
          git add -u .github/workflows/complete-validation.yml \
            .github/workflows/complete-validation-v2.yml || true

      - name: Run full Rust and licensed Stata validation
        if: ${{ steps.state.outputs.action == 'implement' }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/record_rust_quick.sh
          /usr/bin/grep -qx 'rust_status=success' .ci/stata/run/rust-quick.status
          /bin/bash ci/run_stata_ci.sh validation
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile validation \
            --require-success

      - name: Commit validation checkpoint
        if: ${{ steps.state.outputs.action == 'implement' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          status_path = Path("STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          heading = "## Real-engine path and recovery validation"
          if heading in status:
              status = status[: status.index(heading)].rstrip() + "\n"
          status += f'''\n{heading}

The full Rust suite and licensed Stata validation cover spaces and Unicode in
paths, relative `\\input`, replacement semantics, preservation of a prior PDF
after a failed replacement compile, ordinary TeX errors, and repeated calls in
one Stata process. A manual workflow supports 1--10,000 successful calls with
periodic injected TeX failures.
'''
          status_path.write_text(status, encoding="utf-8")

          plan_path = Path("PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          plan = plan.replace(
              "- [ ] Handle spaces/Unicode and concise failures.",
              "- [x] Handle spaces/Unicode, relative inputs, and concise recoverable failures.",
          )
          plan = plan.replace(
              "- [ ] Confirm that the required one-plugin design is release-safe.",
              "- [ ] Complete the high-iteration safety gate; bounded repeated-call and recovery tests are green.",
          )
          plan_path.write_text(plan, encoding="utf-8")
          PY

          git reset -- stata/_texpdf_plugin.plugin 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf .ci/stata/run bundle/generated
          git add STATUS.md PLAN.md
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: add real-engine path and recovery validation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
