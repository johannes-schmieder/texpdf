name: Install exact license inventory workflow

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-license-inventory-workflow-once.yml"
      - "tools/sync_project_state.py"
      - "tools/build_tex_resource_license_inventory.py"

concurrency:
  group: texpdf-install-license-inventory-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  install:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install after convergence and exact inventory tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ ! -x tools/sync_project_state.py ]] ||
             [[ ! -x tools/build_tex_resource_license_inventory.py ]]; then
            exit 0
          fi
          cat > .github/workflows/generate-license-inventory.yml <<'YAML'
          name: Generate exact dependency and embedded-resource inventories

          on:
            workflow_dispatch:
            push:
              branches:
                - main
              paths:
                - "Cargo.lock"
                - "bundle/curated-manifest.json"
                - "bundle/package-resolution.json"
                - "bundle/license-overrides.toml"
                - "licenses/tex-resource-overrides.json"
                - "tools/build_tex_resource_license_inventory.py"
                - "tools/generate_*inventory.py"
                - "tools/collect_*notices.py"

          concurrency:
            group: texpdf-license-inventory
            cancel-in-progress: true

          permissions:
            contents: write

          jobs:
            inventory:
              runs-on: [self-hosted, macOS, ARM64, texpdf]
              timeout-minutes: 240
              env:
                TEXPDF_RUST_PROFILE: engine
                CARGO_TERM_COLOR: always
                RUST_BACKTRACE: "1"
              steps:
                - name: Check out exact source
                  uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                  with:
                    fetch-depth: 0

                - name: Build and test the exact embedded plugin
                  run: /bin/bash ci/record_rust_quick.sh

                - name: Verify Rust result and exact bundle
                  shell: bash
                  run: |
                    set -euo pipefail
                    /usr/bin/grep -qx 'rust_status=success' .ci/stata/run/rust-quick.status
                    test -f bundle/generated/texpdf-bundle.zip
                    test -f bundle/generated/bundle-info.json

                - name: Generate exact embedded-resource mapping
                  run: /usr/bin/python3 tools/build_tex_resource_license_inventory.py

                - name: Refresh optional dependency inventories
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p licenses/generated
                    if [[ -x tools/generate_dependency_inventory.py ]]; then
                      /usr/bin/python3 tools/generate_dependency_inventory.py --require-declared
                    fi
                    if [[ -x tools/generate_cargo_license_inventory.py ]]; then
                      /usr/bin/python3 tools/generate_cargo_license_inventory.py
                    fi
                    if [[ -x tools/collect_vcpkg_notices.py ]]; then
                      /usr/bin/python3 tools/collect_vcpkg_notices.py || true
                    fi
                    if [[ -x tools/collect_dependency_license_texts.py ]]; then
                      /usr/bin/python3 tools/collect_dependency_license_texts.py || true
                    fi

                - name: Update readiness and review queue
                  shell: bash
                  run: |
                    set -euo pipefail
                    /usr/bin/python3 tools/sync_project_state.py
                    if [[ -x tools/report_v1_readiness.py ]]; then
                      /usr/bin/python3 tools/report_v1_readiness.py
                    fi

                - name: Commit generated evidence
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf bundle/generated .ci/stata/run dist target
                    rm -f stata/_texpdf_plugin.plugin
                    git add licenses/ docs/RESOURCE_LICENSE_STATUS.md docs/LICENSE_REVIEW_QUEUE.md 2>/dev/null || true
                    git add STATUS.md PLAN.md docs/V1_READINESS.md release/V1_READINESS.json
                    if git diff --cached --quiet; then
                      exit 0
                    fi
                    git diff --cached --check
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git commit -m "license: refresh exact v1 inventory [skip ci]"
                    git fetch origin main
                    git rebase origin/main
                    git push origin HEAD:main

                - name: Upload exact inventory evidence
                  if: ${{ always() }}
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
                  with:
                    name: texpdf-license-inventory-${{ github.sha }}-${{ github.run_id }}
                    path: |
                      licenses/
                      release/V1_READINESS.json
                      docs/V1_READINESS.md
                      bundle/generated/bundle-info.json
                    if-no-files-found: warn
                    retention-days: 90
          YAML
          rm -f .github/workflows/install-license-inventory-workflow-once.yml
          git add .github/workflows/generate-license-inventory.yml
          git add -u .github/workflows/install-license-inventory-workflow-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: generate licenses from the exact embedded bundle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
