name: Qualify real embedded Tectonic engine v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qualify-full-engine-v2.yml"

concurrency:
  group: texpdf-one-shot-full-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: quick
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize and stage full-engine source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f stata/texpdf.ado
          test -f crates/texpdf-stata/src/lib.rs

          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(text).lstrip(), encoding="utf-8")

          write("tests/fixtures/full/academic.tex", r'''
          \documentclass{article}
          \usepackage{amsmath}
          \usepackage{booktabs}
          \usepackage{hyperref}
          \usepackage{natbib}
          \begin{document}
          \section*{Standalone texpdf qualification}
          The fitted coefficient is
          \[
            \widehat\beta=(X'X)^{-1}X'y.
          \]
          \begin{center}
          \begin{tabular}{lr}
          \toprule
          Statistic & Value \\
          \midrule
          Observations & 100 \\
          Coefficient & 1.25 \\
          \bottomrule
          \end{tabular}
          \end{center}
          The bibliography is processed internally \citep{smith2020}.
          \bibliographystyle{plainnat}
          \bibliography{references}
          \end{document}
          ''')
          write("tests/fixtures/full/references.bib", r'''
          @article{smith2020,
            author = {Smith, Jane},
            title = {A Synthetic Qualification Reference},
            journal = {Journal of Reproducible Tests},
            year = {2020},
            volume = {1},
            pages = {1--2}
          }
          ''')
          write("ci/FULL_ENGINE", "full embedded bundle and PDF compilation profile\n")

          smoke = Path("ci/stata_smoke.do")
          text = smoke.read_text(encoding="utf-8")
          marker = "TEXPDF FULL ENGINE STATA PASS"
          if marker not in text:
              block = textwrap.dedent(r'''
              capture confirm file `"`repo'/ci/FULL_ENGINE"'
              if !_rc {
                  tempfile compiled
                  local compiled_pdf `"`compiled'.pdf"'
                  texpdf using `"`repo'/tests/fixtures/full/academic.tex"', saving(`"`compiled_pdf'"') replace
                  confirm file `"`compiled_pdf'"'
                  assert `"`r(engine)'"' == "tectonic"
                  assert `"`r(engine_version)'"' == "0.17.0"
                  assert strlen(`"`r(bundle_digest)'"') == 64
                  assert strlen(`"`r(bundle_zip_sha256)'"') == 64
                  assert r(warnings) >= 0
                  display as result "TEXPDF FULL ENGINE STATA PASS"
              }
              ''').lstrip()
              pass_line = 'display as result "TEXPDF STATA MATA SMOKE PASS"\n'
              if pass_line not in text:
                  raise SystemExit("cannot locate generic Stata PASS marker")
              text = text.replace(pass_line, block + "\n" + pass_line, 1)
              smoke.write_text(text, encoding="utf-8")

          profiles_path = Path("ci/stata_profiles.json")
          profiles = json.loads(profiles_path.read_text(encoding="utf-8"))
          if "quick" not in profiles:
              raise SystemExit("quick Stata profile is missing")
          profiles["quick"]["required_log_markers"] = [
              "TEXPDF FULL ENGINE STATA PASS",
              "TEXPDF STATA MATA SMOKE PASS",
          ]
          profiles_path.write_text(
              json.dumps(profiles, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          rust_script = Path("ci/run_rust_quick.sh")
          rust_text = rust_script.read_text(encoding="utf-8")
          anchor = '  /usr/bin/python3 tools/stage_plugin.py --target-dir "$CARGO_TARGET_DIR"\n'
          addition = anchor + '''  if [[ "$rust_profile" == engine ]]; then
            /bin/cp stata/_texpdf_plugin.plugin .ci/stata/run/_texpdf_plugin.plugin
          fi
'''
          if "run/_texpdf_plugin.plugin" not in rust_text:
              if anchor not in rust_text:
                  raise SystemExit("cannot locate native plugin staging anchor")
              rust_script.write_text(rust_text.replace(anchor, addition, 1), encoding="utf-8")

          for transient in (
              ".github/workflows/repair-bridge.yml",
              ".github/workflows/implement-stata-package.yml",
              ".github/workflows/qualify-full-engine.yml",
              ".github/workflows/qualify-full-engine-v2.yml",
          ):
              Path(transient).unlink(missing_ok=True)
          PY

          git add ci/FULL_ENGINE ci/stata_smoke.do ci/stata_profiles.json \
            ci/run_rust_quick.sh tests/fixtures/full
          git add -u .github/workflows/repair-bridge.yml \
            .github/workflows/implement-stata-package.yml \
            .github/workflows/qualify-full-engine.yml \
            .github/workflows/qualify-full-engine-v2.yml || true

      - name: Build real embedded bundle and plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/texpdf-full-engine-evidence"
          /bin/bash ci/record_rust_quick.sh
          /usr/bin/grep -qx 'rust_status=success' .ci/stata/run/rust-quick.status
          test -f bundle/generated/bundle-info.json
          test -f .ci/stata/run/plugin-manifest.json
          test -f .ci/stata/run/_texpdf_plugin.plugin
          mkdir -p "$RUNNER_TEMP/texpdf-full-engine-evidence"
          cp -R .ci/stata/run/. "$RUNNER_TEMP/texpdf-full-engine-evidence/"
          cp bundle/generated/bundle-info.json "$RUNNER_TEMP/texpdf-full-engine-evidence/bundle-info.json"

      - name: Run licensed Stata full-engine test
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/run_stata_ci.sh quick
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success
          cp -R "$RUNNER_TEMP/texpdf-full-engine-evidence/." .ci/stata/run/

      - name: Lock bundle and plugin provenance
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          evidence = Path(".ci/stata/run")
          info = json.loads((evidence / "bundle-info.json").read_text(encoding="utf-8"))
          plugin = json.loads((evidence / "plugin-manifest.json").read_text(encoding="utf-8"))
          source_sha = info["source_sha256"]
          index_sha = info["index_sha256"]
          for label, value in (("source", source_sha), ("index", index_sha)):
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit(f"invalid {label} checksum")

          lock_path = Path("bundle/bundle.lock.toml")
          lock = lock_path.read_text(encoding="utf-8")
          lock, source_count = re.subn(
              r'^source_sha256 = "[0-9a-f]*"$',
              f'source_sha256 = "{source_sha}"',
              lock,
              count=1,
              flags=re.MULTILINE,
          )
          lock, index_count = re.subn(
              r'^index_sha256 = "[0-9a-f]*"$',
              f'index_sha256 = "{index_sha}"',
              lock,
              count=1,
              flags=re.MULTILINE,
          )
          if source_count != 1 or index_count != 1:
              raise SystemExit("cannot update bundle checksum lock")
          lock_path.write_text(lock, encoding="utf-8")

          qualification = {
              key: info[key]
              for key in (
                  "bundle_name",
                  "bundle_version",
                  "transform_version",
                  "source_sha256",
                  "index_sha256",
                  "tectonic_bundle_digest",
                  "zip_sha256",
                  "file_count",
                  "zip_size_bytes",
              )
          }
          qualification.update(
              {
                  "schema_version": 1,
                  "engine": "tectonic",
                  "engine_version": "0.17.0",
                  "platform": plugin["platform"],
                  "plugin_size_bytes": plugin["size_bytes"],
                  "plugin_sha256": plugin["sha256"],
                  "plugin_exports": plugin["exports"],
                  "fixture": "tests/fixtures/full/academic.tex",
                  "qualification_scope": "macOS Apple Silicon, licensed Stata/MP 18, full embedded v33 bundle",
              }
          )
          Path("bundle/QUALIFICATION.json").write_text(
              json.dumps(qualification, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git add bundle/bundle.lock.toml bundle/QUALIFICATION.json Cargo.lock

      - name: Commit exact qualification source
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf .ci/stata/run bundle/generated
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(engine): qualify embedded offline Tectonic bundle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-full-engine-v2-${{ github.sha }}-${{ github.run_id }}
          path: |
            .ci/stata/run/
            bundle/generated/bundle-info.json
          if-no-files-found: warn
          retention-days: 30
