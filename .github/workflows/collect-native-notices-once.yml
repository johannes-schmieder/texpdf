name: Collect static native dependency notices once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-native-notices-once.yml"

concurrency:
  group: texpdf-native-license-notices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 90
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare pinned native dependency installation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          export RUSTC="$($rustup_bin which --toolchain 1.97.1 rustc)"
          source tools/prepare_native_deps.sh
          {
            echo "TEXPDF_NOTICE_VCPKG_ROOT=$VCPKG_ROOT"
            echo "TEXPDF_NOTICE_TRIPLET=$VCPKGRS_TRIPLET"
          } >> "$GITHUB_ENV"

      - name: Collect strict canonical notices
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/collect_vcpkg_notices.py \
            --vcpkg-root "$TEXPDF_NOTICE_VCPKG_ROOT" \
            --triplet "$TEXPDF_NOTICE_TRIPLET" \
            --revision a62ce77d56ee07513b4b67de1ec2daeaebfae51a
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          data = json.loads(Path("licenses/NATIVE_LICENSE_INVENTORY.json").read_text(encoding="utf-8"))
          if data["installed_package_count"] != data["notice_count"]:
              raise SystemExit("not every installed static port has a canonical notice")
          if data["missing_notice_count"] != 0:
              raise SystemExit("native notice inventory remains incomplete")
          print("TEXPDF_NATIVE_NOTICE_GATE_PASS", data["notice_count"])
          PY

      - name: Commit native license records
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/collect-native-notices-once.yml
          git add licenses/NATIVE_LICENSE_INVENTORY.json licenses/native/vcpkg/
          git add -u .github/workflows/collect-native-notices-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: collect static native dependency notices"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
