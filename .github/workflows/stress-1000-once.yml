name: Qualify 1000 in-process compilations once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stress-1000-once.yml"

concurrency:
  group: texpdf-stress-1000-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stress:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 300
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: stress
      TEXPDF_RUST_PROFILE: engine
      TEXPDF_STRESS_ITERATIONS: "1000"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize and ensure stress profile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f ci/stata_stress.do
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path("ci/stata_profiles.json")
          profiles = json.loads(path.read_text(encoding="utf-8"))
          if "stress" not in profiles:
              profile = dict(profiles["quick"])
              suite_key = next(
                  key
                  for key, value in profile.items()
                  if isinstance(value, str) and value.endswith(".do")
              )
              profile[suite_key] = "ci/stata_stress.do"
              marker_key = next(
                  (key for key in profile if "marker" in key.lower()),
                  "required_log_markers",
              )
              profile[marker_key] = ["TEXPDF STRESS PASS"]
              timeout_key = next(
                  (key for key in profile if "timeout" in key.lower()),
                  "timeout_seconds",
              )
              profile[timeout_key] = 14400
              profiles["stress"] = profile
              path.write_text(
                  json.dumps(profiles, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          git add ci/stata_profiles.json ci/stata_stress.do

      - name: Build and test real engine
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh

      - name: Preserve Rust evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-stress-rust-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          cp -R .ci/stata/run/. "$evidence/"
          cp bundle/generated/bundle-info.json "$evidence/"
          cp bundle/generated/curated-manifest.json "$evidence/"

      - name: Run 1000-call licensed Stata stress profile with resource measurement
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l /bin/bash ci/run_stata_ci.sh stress \
            2> "$RUNNER_TEMP/texpdf-stress-time.txt"
          cat "$RUNNER_TEMP/texpdf-stress-time.txt"

      - name: Restore, combine, and validate receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-stress-rust-evidence"
          mkdir -p .ci/stata/run
          if [[ -d "$evidence" ]]; then cp -R "$evidence/." .ci/stata/run/; fi
          cp "$RUNNER_TEMP/texpdf-stress-time.txt" .ci/stata/run/stress-time.txt
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile stress \
            --require-success \
            --require-rust-success

      - name: Write committed stress qualification record
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          receipt = json.loads(
              Path(".ci/stata/run/receipt.json").read_text(encoding="utf-8")
          )
          timing_text = Path(".ci/stata/run/stress-time.txt").read_text(
              encoding="utf-8", errors="replace"
          )

          def find_number(pattern: str):
              match = re.search(pattern, timing_text, re.MULTILINE)
              return int(match.group(1)) if match else None

          maximum_rss = find_number(r"^\s*(\d+)\s+maximum resident set size")
          elapsed_match = re.search(r"^\s*([0-9.]+)\s+real", timing_text, re.MULTILINE)
          payload = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "iterations": int(os.environ["TEXPDF_STRESS_ITERATIONS"]),
              "injected_failure_interval": 10,
              "status": receipt.get("status"),
              "stata_status": receipt.get("stata_status"),
              "rust_status": receipt.get("rust_status"),
              "rust_mode": receipt.get("rust_mode"),
              "profile": receipt.get("profile"),
              "platform": receipt.get("platform"),
              "stata_version": receipt.get("stata_version"),
              "stata_edition": receipt.get("stata_edition"),
              "duration_seconds_receipt": receipt.get("duration_seconds"),
              "wall_seconds_time": float(elapsed_match.group(1)) if elapsed_match else None,
              "maximum_resident_set_size_bytes": maximum_rss,
              "qualification_note": (
                  "1000 successful in-process compilations with an ordinary TeX "
                  "failure every tenth iteration; engine version checked after each failure."
              ),
          }
          destination = Path("release/macos-arm64-stress-1000.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f .github/workflows/stress-1000-once.yml
          git reset -- stata/_texpdf_plugin.plugin dist 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf dist .ci/stata/run bundle/generated
          git add release/macos-arm64-stress-1000.json ci/stata_profiles.json ci/stata_stress.do
          git add -u .github/workflows/stress-1000-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record 1000-call macOS in-process stress qualification [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload complete stress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-stress-1000-${{ github.sha }}
          path: .ci/stata/run/
          if-no-files-found: error
          retention-days: 30
