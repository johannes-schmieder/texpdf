name: Diagnose embedded helper build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-helper-build.yml"

concurrency:
  group: texpdf-diagnose-helper-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Run bounded build diagnosis
        shell: bash
        run: |
          set -u
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          export RUSTC="$($rustup_bin which --toolchain 1.97.1 rustc)"
          export PATH="$(dirname "$cargo_bin"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-/private/tmp/texpdf-cargo-target}"
          mkdir -p .ci/helper/run
          "$cargo_bin" metadata --format-version 1 >/dev/null 2>.ci/helper/run/metadata.stderr
          metadata_rc=$?
          /usr/bin/python3 tools/prepare_stub_bundle.py >.ci/helper/run/bundle.stdout 2>.ci/helper/run/bundle.stderr
          bundle_rc=$?
          source tools/prepare_native_deps.sh >.ci/helper/run/native.stdout 2>.ci/helper/run/native.stderr
          native_rc=$?

          run_stage() {
            name="$1"
            shift
            "$@" >".ci/helper/run/$name.stdout" 2>".ci/helper/run/$name.stderr"
            printf '%s' "$?" > ".ci/helper/run/$name.rc"
          }

          run_stage fmt "$cargo_bin" fmt --all --check
          run_stage clippy "$cargo_bin" clippy --locked --workspace --all-targets --all-features -- -D warnings
          run_stage protocol_test "$cargo_bin" test --locked --package texpdf-protocol --all-targets
          run_stage helper_test "$cargo_bin" test --locked --package texpdf-helper --all-targets
          run_stage plugin_test "$cargo_bin" test --locked --package texpdf-stata --all-targets
          run_stage helper_release "$cargo_bin" build --locked --release --package texpdf-helper

          helper="$CARGO_TARGET_DIR/release/texpdf-helper"
          if [[ -f "$helper" ]]; then
            TEXPDF_HELPER_PATH="$helper" \
              "$cargo_bin" build --locked --release --package texpdf-stata \
              >.ci/helper/run/plugin_release.stdout \
              2>.ci/helper/run/plugin_release.stderr
            printf '%s' "$?" > .ci/helper/run/plugin_release.rc
          else
            printf '125' > .ci/helper/run/plugin_release.rc
            echo "helper release executable is absent" > .ci/helper/run/plugin_release.stderr
          fi
          printf '%s' "$metadata_rc" > .ci/helper/run/metadata.rc
          printf '%s' "$bundle_rc" > .ci/helper/run/bundle.rc
          printf '%s' "$native_rc" > .ci/helper/run/native.rc

          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          root = Path(".ci/helper/run")
          names = (
              "metadata",
              "bundle",
              "native",
              "fmt",
              "clippy",
              "protocol_test",
              "helper_test",
              "plugin_test",
              "helper_release",
              "plugin_release",
          )
          stages = []
          for name in names:
              try:
                  rc = int((root / f"{name}.rc").read_text(encoding="utf-8").strip())
              except (OSError, ValueError):
                  rc = 127
              def tail(kind):
                  try:
                      lines = (root / f"{name}.{kind}").read_text(
                          encoding="utf-8", errors="replace"
                      ).splitlines()
                  except OSError:
                      return ""
                  return "\n".join(lines[-80:])[-12000:]
              stages.append(
                  {
                      "name": name,
                      "return_code": rc,
                      "stdout_tail": tail("stdout"),
                      "stderr_tail": tail("stderr"),
                  }
              )
          payload = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "success": all(stage["return_code"] == 0 for stage in stages),
              "stages": stages,
          }
          Path(".ci/helper/STATUS.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("TEXPDF_HELPER_DIAGNOSIS", payload["success"])
          PY

      - name: Publish diagnosis and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          diagnosis="$GITHUB_WORKSPACE/.ci/helper/STATUS.json"
          publish_tree="$RUNNER_TEMP/texpdf-helper-diagnosis-publish"
          git fetch origin main
          rm -rf "$publish_tree"
          git worktree add --detach "$publish_tree" origin/main
          trap 'git -C "$GITHUB_WORKSPACE" worktree remove --force "$publish_tree" 2>/dev/null || true' EXIT
          mkdir -p "$publish_tree/.ci/helper"
          cp "$diagnosis" "$publish_tree/.ci/helper/STATUS.json"
          rm -f "$publish_tree/.github/workflows/diagnose-helper-build.yml"
          git -C "$publish_tree" config user.name "github-actions[bot]"
          git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_tree" add .ci/helper/STATUS.json
          git -C "$publish_tree" add -u .github/workflows/diagnose-helper-build.yml || true
          git -C "$publish_tree" commit -m "ci(helper): publish isolated build diagnosis [skip ci]"
          git -C "$publish_tree" push origin HEAD:main

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: texpdf-helper-diagnosis-${{ github.sha }}-${{ github.run_id }}
          path: .ci/helper/
          if-no-files-found: error
          retention-days: 30
