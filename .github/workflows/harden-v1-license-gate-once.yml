name: Harden v1 license gate once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harden-v1-license-gate-once.yml"
      - "tools/report_v1_readiness.py"

concurrency:
  group: texpdf-harden-v1-license-gate-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harden:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply only when report generator exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ ! -f tools/report_v1_readiness.py ]]; then
            exit 0
          fi
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/report_v1_readiness.py')
          text = path.read_text(encoding='utf-8')
          if 'notice_complete_flags' not in text:
              old = '''              complete_flags: list[bool] = []
              unresolved: set[str] = set()
'''
              new = '''              complete_flags: list[bool] = []
              notice_complete_flags: list[bool] = []
              redistribution_ready_flags: list[bool] = []
              unresolved: set[str] = set()
'''
              if old not in text:
                  raise SystemExit('cannot locate readiness license-state declaration')
              text = text.replace(old, new, 1)

              old = '''                  for value in recursively_collect(record, "license_complete"):
                      if isinstance(value, bool):
                          complete_flags.append(value)
                  for value in recursively_collect(record, "unresolved_resources"):
'''
              new = '''                  for value in recursively_collect(record, "license_complete"):
                      if isinstance(value, bool):
                          complete_flags.append(value)
                  for value in recursively_collect(record, "notice_texts_complete"):
                      if isinstance(value, bool):
                          notice_complete_flags.append(value)
                  for value in recursively_collect(record, "public_redistribution_ready"):
                      if isinstance(value, bool):
                          redistribution_ready_flags.append(value)
                  for value in recursively_collect(record, "unresolved_resources"):
'''
              if old not in text:
                  raise SystemExit('cannot locate readiness license-state collection')
              text = text.replace(old, new, 1)

              old = '''              complete = bool(complete_flags) and all(complete_flags)
              complete = complete and not unresolved and ambiguous == 0 and conflicts == 0
              complete = complete and not missing_license_packages and notice_files_present

              return {
'''
              new = '''              complete = bool(complete_flags) and all(complete_flags)
              complete = complete and bool(notice_complete_flags) and all(notice_complete_flags)
              complete = complete and bool(redistribution_ready_flags) and all(redistribution_ready_flags)
              complete = complete and not unresolved and ambiguous == 0 and conflicts == 0
              complete = complete and not missing_license_packages and notice_files_present

              return {
'''
              if old not in text:
                  raise SystemExit('cannot locate readiness completion predicate')
              text = text.replace(old, new, 1)

              old = '''                  "complete_flags": complete_flags,
                  "unresolved_resource_count": len(unresolved),
'''
              new = '''                  "complete_flags": complete_flags,
                  "notice_complete_flags": notice_complete_flags,
                  "redistribution_ready_flags": redistribution_ready_flags,
                  "unresolved_resource_count": len(unresolved),
'''
              if old not in text:
                  raise SystemExit('cannot locate readiness license output')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/harden-v1-license-gate-once.yml').unlink()
          PY
          /usr/bin/python3 -m unittest ci.tests.test_v1_readiness
          /usr/bin/python3 tools/report_v1_readiness.py
          git add tools/report_v1_readiness.py docs/V1_READINESS.md release/V1_READINESS.json
          git add -u .github/workflows/harden-v1-license-gate-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: require explicit notice coverage for v1"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
