name: Diagnose repeated compiler memory outside Stata

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Repeated texpdf-core compilations (100-10000)
        required: true
        default: "1000"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-rust-memory.yml"
      - "ci/run_rust_memory_probe.sh"
      - "crates/texpdf-core/examples/memory_probe.rs"
      - "crates/texpdf-core/src/memory.rs"
      - "crates/texpdf-core/src/lib.rs"

concurrency:
  group: texpdf-rust-memory-diagnosis
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 180
    env:
      TEXPDF_RUST_PROFILE: engine
      TEXPDF_RUST_MEMORY_ITERATIONS: ${{ inputs.iterations || '1000' }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build and test the real embedded engine
        id: build
        continue-on-error: true
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh

      - name: Run Rust-only repeated compilation with RSS sampling
        id: probe
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: /bin/bash ci/run_rust_memory_probe.sh

      - name: Write source-bound diagnosis record
        id: record
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .ci/rust-memory/run
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          path = Path(".ci/rust-memory/run/rust-memory-probe.json")
          try:
              memory = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              memory = {}
          record = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "build_outcome": os.environ.get("BUILD_OUTCOME", "unknown"),
              "probe_outcome": os.environ.get("PROBE_OUTCOME", "unknown"),
              "diagnosis_complete": bool(memory),
              "growth_gate": memory.get("growth_gate"),
              "memory": memory,
              "interpretation": (
                  "Growth in this Rust-only process implicates texpdf-core/Tectonic "
                  "or its native dependencies rather than Stata or the SPI bridge. "
                  "A flat Rust-only result would redirect investigation to the "
                  "Stata/bridge path."
              ),
          }
          Path(".ci/rust-memory/run/diagnosis.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("TEXPDF_RUST_MEMORY_DIAGNOSIS", record)
          PY

      - name: Publish diagnosis
        if: ${{ always() && steps.record.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source_record="$GITHUB_WORKSPACE/.ci/rust-memory/run/diagnosis.json"
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git -C "$GITHUB_WORKSPACE" worktree remove --force "$publish_tree" 2>/dev/null || true
              publish_tree=""
            fi
          }
          trap cleanup EXIT
          for attempt in 1 2 3; do
            git fetch origin main
            publish_tree="$RUNNER_TEMP/texpdf-rust-memory-publish-$attempt"
            rm -rf "$publish_tree"
            git worktree add --detach "$publish_tree" origin/main
            mkdir -p "$publish_tree/release"
            cp "$source_record" "$publish_tree/release/memory-probe-rust-macos-arm64.json"
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add release/memory-probe-rust-macos-arm64.json
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "ci(memory): publish Rust-only diagnosis [skip ci]"
            if git -C "$publish_tree" push origin HEAD:main; then
              exit 0
            fi
            cleanup
            sleep "$attempt"
          done
          exit 1

      - name: Upload exact diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-rust-memory-${{ github.sha }}-${{ github.run_id }}
          path: .ci/rust-memory/run/
          if-no-files-found: error
          retention-days: 30
