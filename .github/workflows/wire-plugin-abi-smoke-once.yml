name: Wire plugin ABI smoke into builds once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wire-plugin-abi-smoke-once.yml"

concurrency:
  group: texpdf-plugin-abi-smoke-wiring
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 150
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch build entrypoints
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          quick_path = Path("ci/run_rust_quick.sh")
          quick = quick_path.read_text(encoding="utf-8")
          anchor = '  /usr/bin/python3 tools/stage_plugin.py --target-dir "$CARGO_TARGET_DIR"\n'
          addition = anchor + '''  /usr/bin/python3 tools/plugin_smoke.py \\
    stata/_texpdf_plugin.plugin \\
    --output .ci/stata/run/plugin-abi-smoke.json
'''
          if "plugin-abi-smoke.json" not in quick:
              if quick.count(anchor) != 1:
                  raise SystemExit("cannot locate normal plugin staging call")
              quick_path.write_text(quick.replace(anchor, addition, 1), encoding="utf-8")

          hosted_path = Path(".github/workflows/build-linux-windows.yml")
          hosted = hosted_path.read_text(encoding="utf-8")
          linux_anchor = '''          if grep -Eiq '(fontconfig|freetype|harfbuzz|graphite|icu|libpng|libz\\.so|vcpkg)' dist/linux-x86_64/ldd.txt; then
            echo "unexpected dynamically linked typesetting dependency" >&2
            exit 2
          fi
'''
          linux_addition = linux_anchor + '''          python3 tools/plugin_smoke.py \\
            dist/linux-x86_64/_texpdf_plugin.plugin \\
            --output dist/linux-x86_64/plugin-abi-smoke.json
'''
          if "dist/linux-x86_64/plugin-abi-smoke.json" not in hosted:
              if hosted.count(linux_anchor) != 1:
                  raise SystemExit("cannot locate Linux dependency audit block")
              hosted = hosted.replace(linux_anchor, linux_addition, 1)

          windows_anchor = '''          if ($dependents -match '(?i)(fontconfig|freetype|harfbuzz|graphite|icu|libpng|zlib|vcpkg).*\\.dll') {
              throw "unexpected dynamically linked typesetting dependency"
          }
'''
          windows_addition = windows_anchor + '''          python tools/plugin_smoke.py `
            dist\\windows-x86_64\\_texpdf_plugin.plugin `
            --output dist\\windows-x86_64\\plugin-abi-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''
          if "dist\\windows-x86_64\\plugin-abi-smoke.json" not in hosted:
              if hosted.count(windows_anchor) != 1:
                  raise SystemExit("cannot locate Windows dependency audit block")
              hosted = hosted.replace(windows_anchor, windows_addition, 1)
          hosted_path.write_text(hosted, encoding="utf-8")
          Path(".github/workflows/wire-plugin-abi-smoke-once.yml").unlink(missing_ok=True)
          PY
          git add ci/run_rust_quick.sh tools/plugin_smoke.py \
            .github/workflows/build-linux-windows.yml
          git add -u .github/workflows/wire-plugin-abi-smoke-once.yml

      - name: Run full real-engine Rust and ABI smoke
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/record_rust_quick.sh
          test -f .ci/stata/run/plugin-abi-smoke.json
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          data = json.loads(Path(".ci/stata/run/plugin-abi-smoke.json").read_text(encoding="utf-8"))
          required = ("version", "compile", "existing_output", "bad_tex", "post_error_recovery")
          for key in required:
              if data.get(key) != "success":
                  raise SystemExit(f"ABI smoke did not pass {key}")
          PY

      - name: Preserve Rust evidence and run licensed Stata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/texpdf-abi-rust"
          mkdir -p "$RUNNER_TEMP/texpdf-abi-rust"
          cp -R .ci/stata/run/. "$RUNNER_TEMP/texpdf-abi-rust/"
          /bin/bash ci/run_stata_ci.sh quick
          cp -R "$RUNNER_TEMP/texpdf-abi-rust/." .ci/stata/run/
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json \
            .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success

      - name: Commit qualified ABI smoke integration
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin 2>/dev/null || true
          rm -rf stata/_texpdf_plugin.plugin .ci/stata/run bundle/generated
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: require plugin ABI smoke on every build"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
