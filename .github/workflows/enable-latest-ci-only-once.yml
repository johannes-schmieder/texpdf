name: Enable latest-checkpoint normal CI once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enable-latest-ci-only-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and publish concurrency policy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/stata-ci.yml")
          text = path.read_text(encoding="utf-8")
          old = "  cancel-in-progress: false\n"
          new = "  cancel-in-progress: true\n"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("cannot locate ordinary CI concurrency policy")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          Path(".github/workflows/enable-latest-ci-only-once.yml").unlink(missing_ok=True)
          PY
          git add .github/workflows/stata-ci.yml
          git add -u .github/workflows/enable-latest-ci-only-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: cancel superseded ordinary source runs"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
