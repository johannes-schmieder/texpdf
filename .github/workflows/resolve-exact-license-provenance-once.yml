name: Resolve exact TeX resource provenance once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/resolve-exact-license-provenance-once.yml"
      - "tools/sync_project_state.py"
      - "licenses/inventory/tex-resources.json"

concurrency:
  group: texpdf-resolve-exact-license-provenance-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 300
    env:
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize and check prerequisites
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ -x tools/sync_project_state.py ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add content-exact resolver and tests
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools ci/tests licenses/inventory
          cat > tools/resolve_exact_tex_provenance.py <<'PY'
          #!/usr/bin/env python3
          """Resolve embedded TeX resources through byte-identical source files.

          The resolver matches each member of the exact embedded ZIP against files
          in the pinned TeX Live source tar using basename, size, and SHA-256. It
          then maps matching source paths through texlive.tlpdb runfile ownership.
          Multiple packages are retained when they ship byte-identical content.
          Nothing is resolved solely from a suggestive filename.
          """

          from __future__ import annotations

          import argparse
          from collections import defaultdict
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile
          from typing import Any, DefaultDict, Dict, Iterable, List, Optional, Sequence, Set, Tuple
          import zipfile


          def normalize(path: str) -> str:
              value = path.replace("\\", "/")
              while value.startswith("./"):
                  value = value[2:]
              return value.lstrip("/")


          def digest_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def parse_tlpdb(text: str) -> Tuple[Dict[str, Set[str]], Dict[str, Dict[str, Any]]]:
              owners: DefaultDict[str, Set[str]] = defaultdict(set)
              packages: Dict[str, Dict[str, Any]] = {}
              current: Optional[str] = None
              section: Optional[str] = None

              for raw in text.splitlines():
                  if not raw.strip():
                      current = None
                      section = None
                      continue
                  if raw.startswith(" "):
                      if current and section == "runfiles":
                          value = raw.strip().split()[0]
                          if value and not value.startswith("!"):
                              owners[normalize(value)].add(current)
                      continue

                  section = None
                  key, separator, value = raw.partition(" ")
                  value = value.strip() if separator else ""
                  if key == "name":
                      current = value
                      packages.setdefault(current, {"name": current})
                  elif current and key == "catalogue-license":
                      packages[current]["license"] = value or None
                  elif current and key == "catalogue-version":
                      packages[current]["catalogue_version"] = value or None
                  elif current and key == "runfiles":
                      section = "runfiles"
              return dict(owners), packages


          def owner_candidates(path: str, owners: Dict[str, Set[str]]) -> Set[str]:
              normalized = normalize(path)
              candidates = set(owners.get(normalized, set()))
              if candidates:
                  return candidates
              suffix = "/" + normalized
              for runfile, packages in owners.items():
                  if normalized.endswith("/" + runfile) or runfile.endswith(suffix):
                      candidates.update(packages)
              return candidates


          def read_bundle(bundle: Path) -> Dict[str, Dict[str, Any]]:
              resources: Dict[str, Dict[str, Any]] = {}
              with zipfile.ZipFile(bundle) as archive:
                  for info in archive.infolist():
                      if info.is_dir():
                          continue
                      data = archive.read(info)
                      name = normalize(info.filename)
                      resources[name] = {
                          "size": len(data),
                          "sha256": digest_bytes(data),
                          "basename": PurePosixPath(name).name,
                      }
              return resources


          def scan_source_tar(
              source_tar: Path,
              resources: Dict[str, Dict[str, Any]],
          ) -> Tuple[str, Dict[Tuple[str, int, str], List[str]]]:
              wanted_basenames = {
                  record["basename"] for record in resources.values()
              }
              matches: DefaultDict[Tuple[str, int, str], List[str]] = defaultdict(list)
              tlpdb_text: Optional[str] = None

              with tarfile.open(source_tar, mode="r:*") as archive:
                  for member in archive:
                      if not member.isfile():
                          continue
                      name = normalize(member.name)
                      basename = PurePosixPath(name).name
                      is_tlpdb = basename == "texlive.tlpdb"
                      if not is_tlpdb and basename not in wanted_basenames:
                          continue
                      stream = archive.extractfile(member)
                      if stream is None:
                          continue
                      data = stream.read()
                      if is_tlpdb and tlpdb_text is None:
                          tlpdb_text = data.decode("utf-8", errors="replace")
                      if basename in wanted_basenames:
                          key = (basename, len(data), digest_bytes(data))
                          matches[key].append(name)

              if tlpdb_text is None:
                  raise ValueError("texlive.tlpdb was not found in the pinned source tar")
              return tlpdb_text, dict(matches)


          def load_overrides(path: Optional[Path]) -> Dict[str, Dict[str, Any]]:
              if path is None or not path.is_file():
                  return {}
              payload = json.loads(path.read_text(encoding="utf-8"))
              source = payload.get("overrides", payload) if isinstance(payload, dict) else payload
              result: Dict[str, Dict[str, Any]] = {}
              if isinstance(source, dict):
                  for resource, value in source.items():
                      if isinstance(value, str):
                          result[normalize(str(resource))] = {"package": value}
                      elif isinstance(value, dict):
                          result[normalize(str(resource))] = dict(value)
              elif isinstance(source, list):
                  for value in source:
                      if isinstance(value, dict) and value.get("resource"):
                          result[normalize(str(value["resource"]))] = dict(value)
              return result


          def resolve(
              bundle: Path,
              source_tar: Path,
              overrides_path: Optional[Path],
          ) -> Dict[str, Any]:
              resources = read_bundle(bundle)
              tlpdb_text, source_matches = scan_source_tar(source_tar, resources)
              owners, package_metadata = parse_tlpdb(tlpdb_text)
              overrides = load_overrides(overrides_path)

              resolved: List[Dict[str, Any]] = []
              ambiguous: List[Dict[str, Any]] = []
              unresolved: List[str] = []
              packages_used: Set[str] = set()
              missing_license: Set[str] = set()
              exact_match_count = 0
              override_count = 0

              for resource in sorted(resources):
                  record = resources[resource]
                  override = overrides.get(resource)
                  if override and override.get("package"):
                      package_names = [str(override["package"])]
                      license_value = override.get("license")
                      for package in package_names:
                          packages_used.add(package)
                          package_metadata.setdefault(package, {"name": package})
                          if license_value and not package_metadata[package].get("license"):
                              package_metadata[package]["license"] = license_value
                      resolved.append(
                          {
                              "resource": resource,
                              "packages": package_names,
                              "licenses": sorted(
                                  {
                                      str(package_metadata[name].get("license"))
                                      for name in package_names
                                      if package_metadata[name].get("license")
                                  }
                              ),
                              "mapping_source": "reviewed_override",
                              "review_note": override.get("note") or override.get("reason"),
                              "resource_sha256": record["sha256"],
                          }
                      )
                      override_count += 1
                      continue

                  key = (record["basename"], record["size"], record["sha256"])
                  source_paths = sorted(source_matches.get(key, []))
                  package_names: Set[str] = set()
                  path_evidence: List[Dict[str, Any]] = []
                  for source_path in source_paths:
                      candidates = owner_candidates(source_path, owners)
                      package_names.update(candidates)
                      path_evidence.append(
                          {
                              "source_path": source_path,
                              "packages": sorted(candidates),
                          }
                      )

                  if package_names:
                      licenses = {
                          str(package_metadata[name].get("license"))
                          for name in package_names
                          if package_metadata.get(name, {}).get("license")
                      }
                      for package in package_names:
                          packages_used.add(package)
                          if not package_metadata.get(package, {}).get("license"):
                              missing_license.add(package)
                      resolved.append(
                          {
                              "resource": resource,
                              "packages": sorted(package_names),
                              "licenses": sorted(licenses),
                              "mapping_source": "byte_identical_source_and_tlpdb",
                              "resource_sha256": record["sha256"],
                              "source_evidence": path_evidence,
                          }
                      )
                      exact_match_count += 1
                  elif source_paths:
                      ambiguous.append(
                          {
                              "resource": resource,
                              "reason": "byte-identical source found but no tlpdb owner",
                              "source_paths": source_paths,
                          }
                      )
                  else:
                      unresolved.append(resource)

              package_records = []
              for package in sorted(packages_used):
                  metadata = package_metadata.get(package, {})
                  package_records.append(
                      {
                          "name": package,
                          "catalogue_version": metadata.get("catalogue_version"),
                          "license": metadata.get("license"),
                      }
                  )

              complete = not unresolved and not ambiguous and not missing_license
              return {
                  "schema_version": 2,
                  "bundle": str(bundle),
                  "source_tar": str(source_tar),
                  "resource_count": len(resources),
                  "resolved_resource_count": len(resolved),
                  "exact_content_match_count": exact_match_count,
                  "reviewed_override_count": override_count,
                  "resolved_resources": resolved,
                  "unresolved_resources": unresolved,
                  "ambiguous_resources": ambiguous,
                  "packages": package_records,
                  "packages_without_license_metadata": sorted(missing_license),
                  "conflicts": [],
                  "license_complete": complete,
                  "notice_texts_complete": False,
                  "public_redistribution_ready": False,
              }


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument(
                  "--bundle",
                  type=Path,
                  default=Path("bundle/generated/texpdf-bundle.zip"),
              )
              parser.add_argument("--source-tar", type=Path, required=True)
              parser.add_argument(
                  "--overrides",
                  type=Path,
                  default=Path("licenses/tex-resource-overrides.json"),
              )
              parser.add_argument(
                  "--output",
                  type=Path,
                  default=Path("licenses/inventory/tex-resources.json"),
              )
              parser.add_argument("--require-complete", action="store_true")
              args = parser.parse_args()
              try:
                  result = resolve(args.bundle, args.source_tar, args.overrides)
                  args.output.parent.mkdir(parents=True, exist_ok=True)
                  args.output.write_text(
                      json.dumps(result, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
              except (OSError, ValueError, KeyError, json.JSONDecodeError, tarfile.TarError, zipfile.BadZipFile) as error:
                  print(f"TEXPDF_EXACT_PROVENANCE_ERROR {error}", file=sys.stderr)
                  return 2
              print(
                  "TEXPDF_EXACT_PROVENANCE "
                  f"resources={result['resource_count']} "
                  f"resolved={result['resolved_resource_count']} "
                  f"unresolved={len(result['unresolved_resources'])} "
                  f"ambiguous={len(result['ambiguous_resources'])} "
                  f"missing_license={len(result['packages_without_license_metadata'])} "
                  f"complete={str(result['license_complete']).lower()}"
              )
              return 1 if args.require_complete and not result["license_complete"] else 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x tools/resolve_exact_tex_provenance.py

          cat > ci/tests/test_exact_tex_provenance.py <<'PY'
          from __future__ import annotations

          import importlib.util
          import io
          import json
          from pathlib import Path
          import tarfile
          import tempfile
          import unittest
          import zipfile

          MODULE_PATH = Path(__file__).resolve().parents[2] / "tools/resolve_exact_tex_provenance.py"
          SPEC = importlib.util.spec_from_file_location("exact_tex_provenance", MODULE_PATH)
          assert SPEC is not None and SPEC.loader is not None
          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)


          class ExactProvenanceTests(unittest.TestCase):
              def make_inputs(self, root: Path) -> tuple[Path, Path]:
                  bundle = root / "bundle.zip"
                  with zipfile.ZipFile(bundle, "w") as archive:
                      archive.writestr("known.sty", b"same-content")
                  source_tar = root / "source.tar"
                  tlpdb = (
                      "name known-package\n"
                      "catalogue-version 1.0\n"
                      "catalogue-license lppl1.3c\n"
                      "runfiles size=1\n"
                      " texmf-dist/tex/latex/known/known.sty\n\n"
                  ).encode()
                  with tarfile.open(source_tar, "w") as archive:
                      for name, data in (
                          ("tlpkg/texlive.tlpdb", tlpdb),
                          ("texmf-dist/tex/latex/known/known.sty", b"same-content"),
                      ):
                          info = tarfile.TarInfo(name)
                          info.size = len(data)
                          archive.addfile(info, io.BytesIO(data))
                  return bundle, source_tar

              def test_byte_identical_source_maps_to_tlpdb_owner(self) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      bundle, source_tar = self.make_inputs(root)
                      result = MODULE.resolve(bundle, source_tar, None)
                      self.assertTrue(result["license_complete"])
                      self.assertEqual(result["resolved_resource_count"], 1)
                      self.assertEqual(
                          result["resolved_resources"][0]["packages"],
                          ["known-package"],
                      )

              def test_different_content_remains_unresolved(self) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      bundle, source_tar = self.make_inputs(root)
                      with zipfile.ZipFile(bundle, "w") as archive:
                          archive.writestr("known.sty", b"different")
                      result = MODULE.resolve(bundle, source_tar, None)
                      self.assertEqual(result["unresolved_resources"], ["known.sty"])
                      self.assertFalse(result["license_complete"])

              def test_tlpdb_parser_records_license(self) -> None:
                  owners, packages = MODULE.parse_tlpdb(
                      "name p\ncatalogue-license ofl\nrunfiles size=1\n a/b.ttf\n\n"
                  )
                  self.assertEqual(owners["a/b.ttf"], {"p"})
                  self.assertEqual(packages["p"]["license"], "ofl")


          if __name__ == "__main__":
              unittest.main()
          PY
          /usr/bin/python3 -m unittest ci.tests.test_exact_tex_provenance

      - name: Build exact bundle and resolve provenance
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/record_rust_quick.sh
          /usr/bin/grep -qx 'rust_status=success' .ci/stata/run/rust-quick.status
          source_tar="${TEXPDF_BUNDLE_CACHE:-/private/tmp/texpdf-bundle-cache}/tlextras-2022.0r0.tar"
          test -f "$source_tar"
          /usr/bin/python3 tools/resolve_exact_tex_provenance.py \
            --source-tar "$source_tar"
          /usr/bin/python3 tools/sync_project_state.py

      - name: Write exact review summary
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          inventory=json.loads(Path('licenses/inventory/tex-resources.json').read_text(encoding='utf-8'))
          unresolved=inventory.get('unresolved_resources',[])
          ambiguous=inventory.get('ambiguous_resources',[])
          missing=inventory.get('packages_without_license_metadata',[])
          preview='\n'.join(f'- `{item}`' for item in unresolved[:100]) or '- none'
          text=f'''# Exact embedded-resource provenance status

The resolver compared every member of the exact embedded ZIP against the pinned
TeX Live source tar by basename, byte size, and SHA-256, then mapped
byte-identical source paths through `texlive.tlpdb`.

- Embedded resources: **{inventory.get("resource_count",0)}**
- Resolved resources: **{inventory.get("resolved_resource_count",0)}**
- Exact content matches: **{inventory.get("exact_content_match_count",0)}**
- Reviewed overrides: **{inventory.get("reviewed_override_count",0)}**
- Unresolved resources: **{len(unresolved)}**
- Ambiguous resources: **{len(ambiguous)}**
- Packages without license metadata: **{len(missing)}**
- Package/license mapping complete: **{str(inventory.get("license_complete") is True).lower()}**
- Required notice texts complete: **{str(inventory.get("notice_texts_complete") is True).lower()}**

## First 100 unresolved resources

{preview}

The machine-readable evidence is `licenses/inventory/tex-resources.json`.
Multiple package owners are retained when identical content is shared. No item
is assigned from filename resemblance alone.
'''
          Path('docs/RESOURCE_LICENSE_STATUS.md').write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/resolve-exact-license-provenance-once.yml

      - name: Commit resolver and improved evidence
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target dist bundle/generated .ci/stata/run
          rm -f stata/_texpdf_plugin.plugin
          git add tools/resolve_exact_tex_provenance.py ci/tests/test_exact_tex_provenance.py
          git add licenses/inventory/tex-resources.json docs/RESOURCE_LICENSE_STATUS.md
          git add STATUS.md PLAN.md docs/V1_READINESS.md release/V1_READINESS.json
          git add -u .github/workflows/resolve-exact-license-provenance-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "license: resolve exact embedded resources by source content"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
