name: Complete qualified macOS Stata package v2

on:
  push:
    branches:
      - main
    paths:
      - STATUS.md
      - ".github/workflows/complete-macos-package-v2.yml"

concurrency:
  group: texpdf-post-qualification-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: release
      TEXPDF_RUST_PROFILE: engine
      TEXPDF_PACKAGE_DIR: dist/texpdf-macos-arm64
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select action
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if /usr/bin/grep -q '^## Development installation artifact' STATUS.md 2>/dev/null; then
            echo "action=cleanup" >> "$GITHUB_OUTPUT"
          elif [[ ! -f ci/FULL_ENGINE ]] &&
               [[ -f bundle/QUALIFICATION.json ]] &&
               /usr/bin/grep -q '^## Exact qualified checkpoint' STATUS.md 2>/dev/null; then
            echo "action=implement" >> "$GITHUB_OUTPUT"
          else
            echo "action=wait" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove redundant fallback
        if: ${{ steps.state.outputs.action == 'cleanup' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-macos-package.yml
          rm -f .github/workflows/complete-macos-package-v2.yml
          git add -u .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove completed package-builder fallback [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Write package builder and schema-compatible release profile
        if: ${{ steps.state.outputs.action == 'implement' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(text).lstrip(), encoding="utf-8")

          write("tools/package_release.py", r'''
          #!/usr/bin/env python3
          """Build a deterministic texpdf Stata installation directory and ZIP."""

          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sys
          import zipfile

          ZIP_TIME = (1980, 1, 1, 0, 0, 0)


          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  while chunk := stream.read(1024 * 1024):
                      value.update(chunk)
              return value.hexdigest()


          def copy_file(source: Path, destination: Path) -> None:
              if not source.is_file():
                  raise FileNotFoundError(source)
              destination.parent.mkdir(parents=True, exist_ok=True)
              temporary = destination.with_suffix(destination.suffix + ".tmp")
              shutil.copyfile(source, temporary)
              os.replace(temporary, destination)


          def zip_metadata(name: str) -> zipfile.ZipInfo:
              info = zipfile.ZipInfo(name, ZIP_TIME)
              info.compress_type = zipfile.ZIP_DEFLATED
              info.create_system = 3
              info.external_attr = 0o100644 << 16
              return info


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--plugin", type=Path, required=True)
              parser.add_argument("--output-dir", type=Path, required=True)
              parser.add_argument("--zip", dest="zip_path", type=Path, required=True)
              parser.add_argument("--target", default="aarch64-apple-darwin")
              args = parser.parse_args()

              qualification_path = Path("bundle/QUALIFICATION.json")
              if not qualification_path.is_file() or not args.plugin.is_file():
                  print("qualified bundle and compiled plugin are required", file=sys.stderr)
                  return 2

              shutil.rmtree(args.output_dir, ignore_errors=True)
              args.output_dir.mkdir(parents=True)
              sources = {
                  "texpdf.ado": Path("stata/texpdf.ado"),
                  "texpdf.sthlp": Path("stata/texpdf.sthlp"),
                  "texpdf.pkg": Path("stata/texpdf.pkg"),
                  "stata.toc": Path("stata/stata.toc"),
                  "_texpdf_plugin.plugin": args.plugin,
                  "LICENSE": Path("LICENSE"),
                  "QUALIFICATION.json": qualification_path,
              }
              try:
                  for name, source in sources.items():
                      copy_file(source, args.output_dir / name)
              except OSError as error:
                  print(f"cannot assemble package: {error}", file=sys.stderr)
                  return 2

              initial = {
                  path.name: digest(path)
                  for path in sorted(args.output_dir.iterdir())
                  if path.is_file()
              }
              (args.output_dir / "CHECKSUMS.sha256").write_text(
                  "".join(f"{value}  {name}\n" for name, value in sorted(initial.items())),
                  encoding="utf-8",
              )
              qualification = json.loads(qualification_path.read_text(encoding="utf-8"))
              build_info = {
                  "schema_version": 1,
                  "package": "texpdf",
                  "package_version": "0.1.0",
                  "target": args.target,
                  "engine": "tectonic",
                  "engine_version": "0.17.0",
                  "bundle_zip_sha256": qualification["zip_sha256"],
                  "plugin_sha256": initial["_texpdf_plugin.plugin"],
                  "plugin_size_bytes": args.plugin.stat().st_size,
                  "public_release_ready": False,
                  "release_blocker": "bundle-level package/font license inventory is incomplete",
              }
              (args.output_dir / "BUILD_INFO.json").write_text(
                  json.dumps(build_info, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              args.zip_path.parent.mkdir(parents=True, exist_ok=True)
              temporary = args.zip_path.with_suffix(args.zip_path.suffix + ".tmp")
              temporary.unlink(missing_ok=True)
              with zipfile.ZipFile(
                  temporary,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=9,
                  allowZip64=True,
                  strict_timestamps=True,
              ) as archive:
                  for path in sorted(args.output_dir.iterdir()):
                      if path.is_file():
                          archive.writestr(zip_metadata(path.name), path.read_bytes())
              os.replace(temporary, args.zip_path)
              print(
                  "TEXPDF_PACKAGE_READY "
                  f"zip={args.zip_path} zip_bytes={args.zip_path.stat().st_size} "
                  f"zip_sha256={digest(args.zip_path)} plugin_bytes={args.plugin.stat().st_size}"
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          ''')

          write("ci/stata_release_smoke.do", r'''
          version 18.0
          clear all
          set more off

          local package_dir : environment TEXPDF_PACKAGE_DIR
          if `"`package_dir'"' == "" {
              display as error "TEXPDF_PACKAGE_DIR is required"
              exit 198
          }
          net install texpdf, from(`"`package_dir'"') replace
          discard
          which texpdf
          texpdf, version
          assert `"`r(engine)'"' == "tectonic"
          assert `"`r(engine_version)'"' == "0.17.0"
          assert strlen(`"`r(bundle_digest)'"') == 64

          local repo `"`c(pwd)'"'
          tempfile output
          local pdf `"`output'.pdf"'
          texpdf using `"`repo'/tests/fixtures/full/academic.tex"', saving(`"`pdf'"') replace
          confirm file `"`pdf'"'
          assert `"`r(engine)'"' == "tectonic"
          assert r(warnings) >= 0
          display as result "TEXPDF RELEASE PACKAGE PASS"
          ''')

          profiles_path = Path("ci/stata_profiles.json")
          profiles = json.loads(profiles_path.read_text(encoding="utf-8"))
          base = dict(profiles["quick"])
          do_keys = [
              key for key, value in base.items()
              if isinstance(value, str) and value.endswith(".do")
          ]
          if len(do_keys) != 1:
              raise SystemExit(f"cannot identify profile do-file field: {do_keys}")
          base[do_keys[0]] = "ci/stata_release_smoke.do"
          marker_keys = [key for key in base if "marker" in key.lower()]
          if marker_keys:
              base[marker_keys[0]] = ["TEXPDF RELEASE PACKAGE PASS"]
          else:
              base["required_log_markers"] = ["TEXPDF RELEASE PACKAGE PASS"]
          timeout_keys = [key for key in base if "timeout" in key.lower()]
          if timeout_keys:
              base[timeout_keys[0]] = 900
          for key in list(base):
              if "arg" in key.lower():
                  base.pop(key)
          profiles["release"] = base
          profiles_path.write_text(json.dumps(profiles, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          write(".github/workflows/build-macos-artifact.yml", r'''
          name: Build qualified macOS ARM64 development artifact

          on:
            workflow_dispatch:

          concurrency:
            group: texpdf-macos-development-artifact
            cancel-in-progress: false

          permissions:
            contents: read

          jobs:
            build-and-test:
              runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
              timeout-minutes: 180
              env:
                STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
                STATA_PROFILE: release
                TEXPDF_RUST_PROFILE: engine
                TEXPDF_PACKAGE_DIR: dist/texpdf-macos-arm64
                CARGO_TERM_COLOR: always
                RUST_BACKTRACE: "1"
              steps:
                - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                - name: Build and test real plugin
                  run: /bin/bash ci/record_rust_quick.sh
                - name: Assemble deterministic package
                  run: >-
                    /usr/bin/python3 tools/package_release.py
                    --plugin stata/_texpdf_plugin.plugin
                    --output-dir dist/texpdf-macos-arm64
                    --zip dist/texpdf-macos-arm64.zip
                    --target aarch64-apple-darwin
                - name: Stage generated install tree
                  run: git add -f dist/texpdf-macos-arm64
                - name: Test local net install and compile
                  run: /bin/bash ci/run_stata_ci.sh release
                - name: Validate package receipt
                  run: >-
                    /usr/bin/python3 ci/check_stata_receipt.py
                    .ci/stata/run/receipt.json
                    --expect-tested-sha "$GITHUB_SHA"
                    --expect-profile release
                    --require-success
                - name: Upload private development artifact
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
                  with:
                    name: texpdf-macos-arm64-${{ github.sha }}
                    path: |
                      dist/texpdf-macos-arm64.zip
                      dist/texpdf-macos-arm64/
                      .ci/stata/run/
                    if-no-files-found: error
                    retention-days: 30

          # Public GitHub Release creation is deliberately disabled until all
          # embedded TeX package/font license notices are inventoried.
          ''')

          for path in (
              ".github/workflows/complete-macos-package.yml",
              ".github/workflows/complete-macos-package-v2.yml",
          ):
              Path(path).unlink(missing_ok=True)
          PY

          chmod +x tools/package_release.py
          git add tools/package_release.py ci/stata_release_smoke.do \
            ci/stata_profiles.json .github/workflows/build-macos-artifact.yml
          git add -u .github/workflows/complete-macos-package.yml \
            .github/workflows/complete-macos-package-v2.yml || true

      - name: Build and assemble real package
        if: ${{ steps.state.outputs.action == 'implement' }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/record_rust_quick.sh
          /usr/bin/grep -qx 'rust_status=success' .ci/stata/run/rust-quick.status
          /usr/bin/python3 tools/package_release.py \
            --plugin stata/_texpdf_plugin.plugin \
            --output-dir "$TEXPDF_PACKAGE_DIR" \
            --zip dist/texpdf-macos-arm64.zip \
            --target aarch64-apple-darwin
          git add -f "$TEXPDF_PACKAGE_DIR"

      - name: Test net install and real compile
        if: ${{ steps.state.outputs.action == 'implement' }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/run_stata_ci.sh release
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile release \
            --require-success

      - name: Commit package-builder checkpoint
        if: ${{ steps.state.outputs.action == 'implement' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          status_path = Path("STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          heading = "## Development installation artifact"
          if heading in status:
              status = status[: status.index(heading)].rstrip() + "\n"
          status += f'''\n{heading}

The repository can rebuild the real macOS ARM64 plugin, assemble a
deterministic Stata package ZIP, perform a local `net install`, and compile the
academic/BibTeX fixture in licensed Stata. The workflow uploads a private
Actions artifact; public Release publication remains blocked on the bundle
license inventory.
'''
          status_path.write_text(status, encoding="utf-8")

          plan_path = Path("PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          plan = plan.replace(
              "- [ ] GitHub Release + `net install` layout.",
              "- [ ] Public GitHub Release pending licenses; deterministic `net install` development artifact is implemented and tested.",
          )
          plan_path.write_text(plan, encoding="utf-8")
          PY

          git reset -- stata/_texpdf_plugin.plugin dist 2>/dev/null || true
          rm -rf stata/_texpdf_plugin.plugin dist .ci/stata/run bundle/generated
          git add STATUS.md PLAN.md
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(release): add qualified macOS Stata package builder"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
