name: Finalize embedded helper architecture

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-helper-architecture.yml"
  workflow_dispatch:

concurrency:
  group: texpdf-finalize-helper-architecture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      TEXPDF_RUST_PROFILE: engine
      TEXPDF_HELPER_CACHE_DIR: ${{ runner.temp }}/texpdf-helper-final-${{ github.run_id }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize and apply deterministic repairs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          manifest = Path("crates/texpdf-helper/Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          if "[dev-dependencies]" not in text:
              text = text.rstrip() + "\n\n[dev-dependencies]\ntempfile.workspace = true\n"
          elif "tempfile.workspace" not in text:
              text = text.replace(
                  "[dev-dependencies]\n",
                  "[dev-dependencies]\ntempfile.workspace = true\n",
                  1,
              )
          manifest.write_text(text, encoding="utf-8")

          source = Path("crates/texpdf-helper/src/main.rs")
          text = source.read_text(encoding="utf-8")
          text = text.replace(
              "PathBuf::from(&arguments[1]),\n        PathBuf::from(&arguments[2]),",
              "PathBuf::from(arguments[1].clone()),\n        PathBuf::from(arguments[2].clone()),",
          )
          anchor = "    let diagnostics = convert_diagnostics(&result.diagnostics);\n"
          if "let warning_count = result.warning_count();" not in text:
              if anchor not in text:
                  raise SystemExit("cannot locate helper diagnostic anchor")
              text = text.replace(anchor, anchor + "    let warning_count = result.warning_count();\n", 1)
          text = text.replace(
              '("warnings".to_owned(), result.warning_count().to_string()),',
              '("warnings".to_owned(), warning_count.to_string()),',
          )
          source.write_text(text, encoding="utf-8")
          PY

      - name: Update lock without changing external registry graph
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          export RUSTC="$($rustup_bin which --toolchain 1.97.1 rustc)"
          export PATH="$(dirname "$cargo_bin"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          "$cargo_bin" metadata --format-version 1 >/dev/null
          /usr/bin/python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock <<'PY'
          from pathlib import Path
          import re
          import sys

          blocks = re.compile(r"^\[\[package\]\]\n(.*?)(?=^\[\[package\]\]|\Z)", re.M | re.S)
          fields = re.compile(r'^([a-z_]+) = "([^"]*)"$', re.M)
          def external(path):
              values = set()
              for block in blocks.findall(Path(path).read_text(encoding="utf-8")):
                  item = dict(fields.findall(block))
                  if item.get("source"):
                      values.add((item.get("name"), item.get("version"), item.get("source"), item.get("checksum")))
              return values
          before = external(sys.argv[1])
          after = external(sys.argv[2])
          if before != after:
              raise SystemExit(f"registry graph changed; added={sorted(after-before)} removed={sorted(before-after)}")
          lock = Path(sys.argv[2]).read_text(encoding="utf-8")
          for name in ("texpdf-helper", "texpdf-protocol", "texpdf-stata"):
              if f'name = "{name}"' not in lock:
                  raise SystemExit(f"lockfile lacks {name}")
          PY

      - name: Format source
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          "$cargo_bin" fmt --all
          "$cargo_bin" fmt --all --check

      - name: Prepare engine build inputs
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          export RUSTC="$($rustup_bin which --toolchain 1.97.1 rustc)"
          export PATH="$(dirname "$cargo_bin"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-/private/tmp/texpdf-cargo-target}"
          export TEXPDF_BUNDLE_CACHE="${TEXPDF_BUNDLE_CACHE:-/private/tmp/texpdf-bundle-cache}"
          /usr/bin/python3 tools/prepare_stub_bundle.py
          source tools/prepare_native_deps.sh
          if [[ -f bundle/curated-manifest.json ]]; then
            source_tar="$TEXPDF_BUNDLE_CACHE/tlextras-2022.0r0.tar"
            args=(--manifest bundle/curated-manifest.json --cache-dir "$TEXPDF_BUNDLE_CACHE")
            if [[ -f "$source_tar" ]]; then args+=(--source-tar "$source_tar"); fi
            /usr/bin/python3 tools/prepare_curated_bundle.py "${args[@]}"
          fi

      - name: Strict Rust qualification
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          export RUSTC="$($rustup_bin which --toolchain 1.97.1 rustc)"
          export PATH="$(dirname "$cargo_bin"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-/private/tmp/texpdf-cargo-target}"
          source tools/prepare_native_deps.sh
          "$cargo_bin" clippy --locked --workspace --all-targets --all-features -- -D warnings
          "$cargo_bin" test --locked --workspace --all-targets --all-features
          "$cargo_bin" build --locked --release --package texpdf-helper
          helper="$CARGO_TARGET_DIR/release/texpdf-helper"
          test -x "$helper"
          TEXPDF_HELPER_PATH="$helper" "$cargo_bin" build --locked --release --package texpdf-stata
          /usr/bin/python3 tools/stage_plugin.py --target-dir "$CARGO_TARGET_DIR"
          git add -f stata/_texpdf_plugin.plugin

      - name: Licensed Stata helper-path qualification
        shell: bash
        run: |
          set -euo pipefail
          git add -f stata/_texpdf_plugin.plugin
          /bin/bash ci/run_stata_ci.sh quick
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success

      - name: Commit green source and remove temporary helper workflows
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf .ci/stata/run bundle/generated dist
          for path in \
            .github/workflows/update-helper-lock.yml \
            .github/workflows/update-helper-lock-v2.yml \
            .github/workflows/format-helper-source.yml \
            .github/workflows/repair-helper-build.yml \
            .github/workflows/apply-helper-source-repairs.yml \
            .github/workflows/diagnose-helper-build.yml \
            .github/workflows/finalize-helper-architecture.yml; do
            rm -f "$path"
          done
          git add Cargo.lock Cargo.toml crates ci/run_rust_quick.sh .github/workflows/stata-ci.yml
          git add -u .github/workflows || true
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(helper): qualify isolated compiler architecture"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
