name: Authoritative cleaned-source preflight v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/authoritative-cleanup-v2.yml"

concurrency:
  group: texpdf-authoritative-cleanup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clean-and-qualify:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 300
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: quick
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      KNOWN_GREEN_SOURCE: 5d85840783ad4406a1606e5b3af09a06cca2f657

    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize, record base, and remove transient workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git cat-file -e "$KNOWN_GREEN_SOURCE^{commit}"
          base_sha="$(git rev-parse HEAD)"
          echo "CLEANUP_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          durable = {
              "authoritative-cleanup-v2.yml",
              "build-cross-platform.yml",
              "build-development-artifacts.yml",
              "build-macos-universal.yml",
              "finalize-clean-source-receipt.yml",
              "generate-license-inventory.yml",
              "publish-artifact-manifest.yml",
              "publish-artifact-summary.yml",
              "publish-target-qualification.yml",
              "report-implementation-failure.yml",
              "stata-ci.yml",
          }
          directory = Path(".github/workflows")
          removed = []
          for path in sorted(directory.glob("*")):
              if path.is_file() and path.suffix in {".yml", ".yaml"} and path.name not in durable:
                  removed.append(path.name)
                  path.unlink()

          descriptions = {
              "stata-ci.yml": "exact-SHA Rust and licensed Stata CI with immutable receipts",
              "build-development-artifacts.yml": "manual macOS plugin/package build with quick or stress qualification",
              "build-macos-universal.yml": "manual universal Mach-O build and Apple Silicon Stata test",
              "build-cross-platform.yml": "manual Windows/Linux build-only matrix, explicitly not runtime support",
              "generate-license-inventory.yml": "pinned dependency and TeX-resource license inventory",
              "publish-artifact-manifest.yml": "immutable exact-SHA artifact measurements",
              "publish-artifact-summary.yml": "human-readable current artifact size record",
              "publish-target-qualification.yml": "exact macOS target qualification record",
              "report-implementation-failure.yml": "sanitized failure receipts",
              "finalize-clean-source-receipt.yml": "final exact-source evidence gate, self-removing after success",
          }
          lines = [
              "# Workflow inventory",
              "",
              "Reusable workflows retained in the cleaned source:",
              "",
          ]
          for name in sorted(durable - {"authoritative-cleanup-v2.yml"}):
              if (directory / name).is_file():
                  lines.append(f"- `{name}` — {descriptions[name]}.")
          lines.extend(
              [
                  "",
                  "Transient/self-modifying workflows removed:",
                  "",
              ]
          )
          lines.extend(f"- `{name}`" for name in removed)
          if not removed:
              lines.append("- none")
          lines.extend(
              [
                  "",
                  "Public release creation remains absent until the fail-closed",
                  "third-party license and target-runtime gates pass.",
                  "",
              ]
          )
          destination = Path("docs/WORKFLOWS.md")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text("\n".join(lines), encoding="utf-8")
          for marker in (
              "IMPLEMENTATION_PENDING",
              "FINALIZATION_PENDING",
              "FINAL_CLEANUP_PENDING",
          ):
              Path(marker).unlink(missing_ok=True)
          PY
          git add -u .github/workflows
          git add docs/WORKFLOWS.md

      - name: Define preflight helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-texpdf-preflight-v2.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          label="$1"
          evidence="$RUNNER_TEMP/texpdf-preflight-v2-$label"
          rm -rf "$evidence" .ci/stata/run bundle/generated dist
          rm -f stata/_texpdf_plugin.plugin
          /bin/bash ci/check_workflows.sh
          /usr/bin/python3 -m py_compile \
            tools/check_cargo_runtime_policy.py \
            tools/check_plugin_binary.py \
            tools/check_release_readiness.py \
            tools/collect_dependency_license_texts.py \
            tools/generate_dependency_inventory.py \
            tools/generate_tex_resource_inventory.py \
            tools/apply_tex_resource_overrides.py \
            tools/resolve_texlive_resources.py \
            tools/package_release.py tools/prepare_bundle.py \
            tools/prepare_curated_bundle.py tools/stage_plugin.py
          /usr/bin/python3 -m unittest discover -s ci/tests -p 'test_*.py'
          /bin/bash ci/record_rust_quick.sh
          /usr/bin/grep -qx 'rust_status=success' .ci/stata/run/rust-quick.status
          /usr/bin/python3 tools/check_cargo_runtime_policy.py
          mkdir -p "$evidence"
          cp -R .ci/stata/run/. "$evidence/"
          cp bundle/generated/bundle-info.json "$evidence/"
          if [[ -f bundle/generated/curated-manifest.json ]]; then
            cp bundle/generated/curated-manifest.json "$evidence/"
          fi
          /bin/bash ci/run_stata_ci.sh quick
          cp -R "$evidence/." .ci/stata/run/
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success
          SH
          chmod +x "$RUNNER_TEMP/run-texpdf-preflight-v2.sh"

      - name: Test current source, with a known-green production fallback
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/run-texpdf-preflight-v2.sh" current \
            > "$RUNNER_TEMP/current-preflight-v2.log" 2>&1
          current_rc=$?
          set -e
          cat "$RUNNER_TEMP/current-preflight-v2.log"
          if [[ "$current_rc" -eq 0 ]]; then
            echo "source=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Current experimental source failed; restoring qualified production paths." >&2
          mkdir -p docs/generated
          cp "$RUNNER_TEMP/current-preflight-v2.log" \
            docs/generated/FAILED_EXPERIMENTAL_PREFLIGHT.log
          git checkout "$KNOWN_GREEN_SOURCE" -- \
            Cargo.toml Cargo.lock rust-toolchain.toml \
            crates/texpdf-core crates/texpdf-stata \
            bundle/bundle.lock.toml bundle/packages.toml \
            bundle/required-resources.txt \
            ci/augment_ci_receipt.py ci/check_stata_receipt.py \
            ci/make_stata_receipt.py ci/record_rust_quick.sh \
            ci/run_rust_quick.sh ci/run_stata_ci.py ci/run_stata_ci.sh \
            ci/stata_ci.do ci/stata_profiles.json ci/stata_smoke.do \
            ci/stata_version.do ci/supervise_stata.py \
            stata \
            tools/package_release.py tools/prepare_bundle.py \
            tools/prepare_curated_bundle.py tools/prepare_native_deps.sh \
            tools/prepare_stub_bundle.py tools/stage_plugin.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import subprocess

          green = set(
              subprocess.check_output(
                  [
                      "git",
                      "ls-tree",
                      "-r",
                      "--name-only",
                      "5d85840783ad4406a1606e5b3af09a06cca2f657",
                      "crates",
                  ],
                  text=True,
              ).splitlines()
          )
          current = set(
              subprocess.check_output(["git", "ls-files", "crates"], text=True).splitlines()
          )
          for value in sorted(current - green):
              path = Path(value)
              if path.is_file():
                  path.unlink()
          PY
          git add Cargo.toml Cargo.lock rust-toolchain.toml crates bundle ci stata \
            tools/package_release.py tools/prepare_bundle.py \
            tools/prepare_curated_bundle.py tools/prepare_native_deps.sh \
            tools/prepare_stub_bundle.py tools/stage_plugin.py \
            docs/generated/FAILED_EXPERIMENTAL_PREFLIGHT.log
          git add -u crates
          "$RUNNER_TEMP/run-texpdf-preflight-v2.sh" fallback
          echo "source=known-green-fallback" >> "$GITHUB_OUTPUT"

      - name: Generate measured prequalification record
        shell: bash
        env:
          PREFLIGHT_SOURCE: ${{ steps.preflight.outputs.source }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          receipt = json.loads(Path(".ci/stata/run/receipt.json").read_text(encoding="utf-8"))
          bundle = json.loads(Path("bundle/generated/bundle-info.json").read_text(encoding="utf-8"))
          plugin = json.loads(Path(".ci/stata/run/plugin-manifest.json").read_text(encoding="utf-8"))
          package_path = Path(".ci/stata/run/package-manifest.json")
          package = json.loads(package_path.read_text(encoding="utf-8")) if package_path.is_file() else None
          bundle_bytes = bundle.get("zip_size_bytes")
          plugin_bytes = plugin.get("size_bytes") or plugin.get("plugin_size_bytes")
          bundle_sha = bundle.get("zip_sha256")
          plugin_sha = plugin.get("sha256") or plugin.get("plugin_sha256")
          sha_re = re.compile(r"^[0-9a-f]{64}$")
          if not isinstance(bundle_bytes, int) or bundle_bytes <= 0:
              raise SystemExit("invalid bundle byte count")
          if not isinstance(plugin_bytes, int) or plugin_bytes <= 0:
              raise SystemExit("invalid plugin byte count")
          if not isinstance(bundle_sha, str) or not sha_re.fullmatch(bundle_sha):
              raise SystemExit("invalid bundle SHA-256")
          if not isinstance(plugin_sha, str) or not sha_re.fullmatch(plugin_sha):
              raise SystemExit("invalid plugin SHA-256")
          record = {
              "schema_version": 1,
              "preflight_workflow_sha": os.environ["GITHUB_SHA"],
              "production_source_selection": os.environ["PREFLIGHT_SOURCE"],
              "profile": receipt.get("profile"),
              "status": receipt.get("status"),
              "stata_status": receipt.get("stata_status"),
              "rust_status": receipt.get("rust_status"),
              "rust_mode": receipt.get("rust_mode"),
              "bundle": {
                  "file_count": bundle.get("file_count"),
                  "size_bytes": bundle_bytes,
                  "sha256": bundle_sha,
                  "tectonic_digest": bundle.get("tectonic_bundle_digest"),
              },
              "plugin": {
                  "size_bytes": plugin_bytes,
                  "sha256": plugin_sha,
                  "target": plugin.get("target") or plugin.get("platform"),
              },
              "package": package,
              "qualification_boundary": (
                  "The source commit created after this preflight must receive its "
                  "own exact-SHA receipt before FINAL_CLEANUP_PENDING is removed."
              ),
          }
          destination = Path("release/PREFLIGHT.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("FINAL_CLEANUP_PENDING").write_text(
              "awaiting exact-SHA quick receipt for the cleaned source commit\n",
              encoding="utf-8",
          )
          PY
          git add release/PREFLIGHT.json FINAL_CLEANUP_PENDING

      - name: Commit and push only if remote main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/authoritative-cleanup-v2.yml
          git add -u .github/workflows/authoritative-cleanup-v2.yml
          git reset -- stata/_texpdf_plugin.plugin dist 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf dist .ci/stata/run bundle/generated \
            __pycache__ ci/__pycache__ ci/tests/__pycache__ tools/__pycache__
          git add Cargo.lock
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize cleaned macOS compiler source"
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$CLEANUP_BASE_SHA" ]]; then
            echo "origin/main moved from $CLEANUP_BASE_SHA to $remote_sha during preflight; refusing to push an untested rebase" >&2
            exit 1
          fi
          git push origin HEAD:main

      - name: Upload authoritative preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-authoritative-preflight-v2-${{ github.sha }}-${{ github.run_id }}
          path: |
            .ci/stata/run/
            release/PREFLIGHT.json
            docs/generated/FAILED_EXPERIMENTAL_PREFLIGHT.log
          if-no-files-found: warn
          retention-days: 30
