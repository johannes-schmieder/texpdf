name: Record implementation workflow failures

on:
  workflow_run:
    workflows:
      - Qualify real embedded Tectonic engine v2
      - Finalize exact full-engine qualification
      - Finalize exact full-engine qualification v2
      - Complete qualified macOS Stata package
      - Complete real-engine path and recovery validation
    types:
      - completed

concurrency:
  group: texpdf-implementation-failure-receipts
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
      FAILED_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Write sanitized failed-step receipt
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["FAILED_RUN_ID"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "texpdf-failure-receipt",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              jobs_payload = json.load(response)

          jobs = []
          for job in jobs_payload.get("jobs", []):
              jobs.append(
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "started_at": job.get("started_at"),
                      "completed_at": job.get("completed_at"),
                      "steps": [
                          {
                              "number": step.get("number"),
                              "name": step.get("name"),
                              "status": step.get("status"),
                              "conclusion": step.get("conclusion"),
                          }
                          for step in job.get("steps", [])
                      ],
                  }
              )

          payload = {
              "schema_version": 1,
              "repository": repository,
              "workflow": os.environ["FAILED_RUN_NAME"],
              "run_id": int(run_id),
              "run_attempt": int(os.environ["FAILED_RUN_ATTEMPT"]),
              "head_sha": os.environ["FAILED_RUN_HEAD_SHA"],
              "conclusion": "failure",
              "url": os.environ["FAILED_RUN_URL"],
              "jobs": jobs,
          }
          output = Path(f".ci/implementation-failures/{run_id}.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"TEXPDF_FAILURE_RECEIPT_READY path={output}")
          PY

      - name: Commit failure receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/implementation-failures/
          git commit -m "ci: record failed implementation run $FAILED_RUN_ID [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
