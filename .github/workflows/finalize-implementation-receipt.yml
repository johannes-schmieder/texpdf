name: Finalize cleaned implementation receipt

on:
  workflow_run:
    workflows:
      - Licensed Stata and Rust CI
    types:
      - completed

concurrency:
  group: texpdf-final-clean-receipt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify final source and exact receipt
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if ! git cat-file -e "$SOURCE_SHA:IMPLEMENTATION_PENDING" 2>/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          receipt=".ci/stata/results/$SOURCE_SHA.json"
          if [[ ! -f "$receipt" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          /usr/bin/python3 - "$receipt" "$SOURCE_SHA" <<'PY'
          from pathlib import Path
          import json
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2]
          required = {
              "tested_sha": expected,
              "profile": "quick",
              "status": "success",
              "stata_status": "success",
              "rust_status": "success",
          }
          problems = [
              f"{key}: expected {value!r}, got {receipt.get(key)!r}"
              for key, value in required.items()
              if receipt.get(key) != value
          ]
          markers = {
              item.get("marker"): item.get("present")
              for item in receipt.get("required_log_markers", [])
          }
          if markers.get("TEXPDF STATA MATA SMOKE PASS") is not True:
              problems.append("generic Stata PASS marker is absent")
          if problems:
              raise SystemExit("final cleaned receipt rejected: " + "; ".join(problems))
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Record final cleaned source status
        if: ${{ steps.verify.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          sha = os.environ["SOURCE_SHA"]
          receipt = json.loads(Path(f".ci/stata/results/{sha}.json").read_text(encoding="utf-8"))
          path = Path("IMPLEMENTATION.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("Final cleaned source SHA: pending", f"Final cleaned source SHA: `{sha}`")
          text = text.replace("Final quick CI status: pending", "Final quick CI status: `success`")
          text = text.replace("Final licensed Stata status: pending", "Final licensed Stata status: `success`")
          text = text.replace("Final Rust status: pending", "Final Rust status: `success`")
          text += (
              "\nThe immutable final receipt used profile `quick`, required the "
              "`TEXPDF STATA MATA SMOKE PASS` marker, and reported Rust mode `"
              + str(receipt.get("rust_mode"))
              + "`.\n"
          )
          path.write_text(text, encoding="utf-8")
          Path("IMPLEMENTATION_PENDING").unlink()
          Path(".github/workflows/finalize-implementation-receipt.yml").unlink()
          PY

          git add IMPLEMENTATION.md
          git add -u IMPLEMENTATION_PENDING .github/workflows/finalize-implementation-receipt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: record final cleaned implementation receipt [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
