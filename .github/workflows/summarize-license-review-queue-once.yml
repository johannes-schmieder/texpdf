name: Summarize license review queue once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/summarize-license-review-queue-once.yml"
      - "licenses/inventory/tex-resources.json"

concurrency:
  group: texpdf-summarize-license-review-queue-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summarize:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Generate review queue
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ ! -f licenses/inventory/tex-resources.json ]]; then
            exit 0
          fi
          /usr/bin/python3 - <<'PY'
          from collections import Counter, defaultdict
          import json
          from pathlib import Path

          inventory = json.loads(
              Path('licenses/inventory/tex-resources.json').read_text(encoding='utf-8')
          )
          resolution_path = Path('bundle/package-resolution.json')
          resolution = (
              json.loads(resolution_path.read_text(encoding='utf-8'))
              if resolution_path.is_file()
              else {}
          )

          candidates = defaultdict(set)
          for record in resolution.get('matches', []):
              if isinstance(record, dict) and record.get('resource') and record.get('package'):
                  candidates[str(record['resource'])].add(str(record['package']))
          for record in resolution.get('ambiguous_runfiles', []):
              if not isinstance(record, dict) or not record.get('package'):
                  continue
              for resource in record.get('candidates', []):
                  candidates[str(resource)].add(str(record['package']))

          unresolved = sorted(inventory.get('unresolved_resources', []))
          ambiguous = inventory.get('ambiguous_resources', [])
          missing_license = sorted(inventory.get('packages_without_license_metadata', []))
          extension_counts = Counter(
              Path(resource).suffix.lower() or '<no extension>' for resource in unresolved
          )
          queue = {
              'schema_version': 1,
              'bundle_zip_sha256': inventory.get('bundle_zip_sha256'),
              'unresolved': [
                  {
                      'resource': resource,
                      'candidate_packages': sorted(candidates.get(resource, set())),
                      'extension': Path(resource).suffix.lower(),
                      'review_status': 'pending',
                  }
                  for resource in unresolved
              ],
              'ambiguous': ambiguous,
              'packages_without_license_metadata': missing_license,
              'extension_counts': dict(sorted(extension_counts.items())),
              'review_rules': [
                  'Do not infer one blanket license for TeX Live resources.',
                  'Every override must name provenance, license evidence, and reviewer rationale.',
                  'Generated metadata must be distinguished from upstream package/font content.',
                  'Notice-text obligations remain separate after mapping is complete.',
              ],
          }
          output = Path('licenses/inventory/review-queue.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(queue, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          extension_lines = '\n'.join(
              f'| `{extension}` | {count} |'
              for extension, count in sorted(extension_counts.items())
          ) or '| — | 0 |'
          preview = '\n'.join(
              f"- `{record['resource']}`"
              + (
                  ' — candidates: ' + ', '.join(f"`{item}`" for item in record['candidate_packages'])
                  if record['candidate_packages']
                  else ' — no package candidate recorded'
              )
              for record in queue['unresolved'][:100]
          ) or '- none'
          text = f'''# Embedded-resource license review queue

This queue is generated from the exact embedded-resource inventory. It is not a
license determination.

## Counts

- Unresolved resources: **{len(unresolved)}**
- Ambiguous resources: **{len(ambiguous)}**
- Packages without license metadata: **{len(missing_license)}**

| Extension | Unresolved resources |
|---|---:|
{extension_lines}

## Review rules

- Do not infer a blanket license for the bundle.
- Record provenance, license evidence, and rationale for every override.
- Distinguish generated bundle metadata from upstream TeX/font content.
- Treat required notice texts as a separate release gate.

## First 100 unresolved resources

{preview}

The complete machine-readable queue is
`licenses/inventory/review-queue.json`. Reviewed decisions belong in the
version-controlled override registry, not in this generated report.
'''
          Path('docs/LICENSE_REVIEW_QUEUE.md').write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/summarize-license-review-queue-once.yml
          git add licenses/inventory/review-queue.json docs/LICENSE_REVIEW_QUEUE.md
          git add -u .github/workflows/summarize-license-review-queue-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "license: publish the exact resource review queue"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
