name: Sync canonical project state

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Licensed Stata and Rust CI
      - Build and test macOS universal plugin
      - Publish macOS ARM64 target qualification
      - Audit third-party licenses and notices
      - macOS ARM64 1000-call memory stress
      - Qualify macOS Intel Stata runtime
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".ci/stata/results/**"
      - "bundle/QUALIFICATION.json"
      - "licenses/generated/STATUS.json"
      - "release/macos-intel-runtime.json"
      - "release/macos-universal.json"
      - "release/memory-stress-macos-arm64.json"
      - "release/scope.json"
      - "release/targets.json"
      - "tools/check_release_readiness.py"
      - "tools/sync_project_state.py"
      - ".github/workflows/sync-project-state-on-green.yml"

concurrency:
  group: texpdf-sync-project-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate, audit, and publish canonical state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            /usr/bin/python3 tools/sync_project_state.py
            /usr/bin/python3 tools/sync_project_state.py --check
            git add STATUS.md release/READINESS.json release/READINESS.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync canonical project state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "canonical project-state publication lost three branch races" >&2
          exit 1
