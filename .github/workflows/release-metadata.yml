name: Validate release-tag metadata

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require synchronized version and date metadata
        run: python3 ci/check_release_metadata.py --tag "$GITHUB_REF_NAME"
