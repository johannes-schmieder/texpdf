name: Include provenance notices in Stata package once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/include-package-notices-once.yml"

concurrency:
  group: texpdf-package-notices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch package manifest and deterministic builder
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          package_path = Path("stata/texpdf.pkg")
          package = package_path.read_text(encoding="utf-8").rstrip() + "\n"
          for file_name in ("LICENSE", "THIRD_PARTY_NOTICES.md", "QUALIFICATION.json"):
              line = f"f {file_name}\n"
              if line not in package:
                  package += line
          package_path.write_text(package, encoding="utf-8")

          builder_path = Path("tools/package_release.py")
          builder = builder_path.read_text(encoding="utf-8")
          if '"THIRD_PARTY_NOTICES.md"' not in builder:
              anchors = [
                  '"QUALIFICATION.json": qualification_path,\n',
                  '"QUALIFICATION.json": qualification_path\n',
              ]
              for anchor in anchors:
                  if anchor in builder:
                      replacement = anchor + '        "THIRD_PARTY_NOTICES.md": Path("THIRD_PARTY_NOTICES.md"),\n'
                      builder = builder.replace(anchor, replacement, 1)
                      break
              else:
                  raise SystemExit("cannot locate package builder source mapping")
          builder_path.write_text(builder, encoding="utf-8")

          Path(".github/workflows/include-package-notices-once.yml").unlink(missing_ok=True)
          PY
          git add stata/texpdf.pkg tools/package_release.py
          git add -u .github/workflows/include-package-notices-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "packaging: install qualification and third-party notices"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "failed to publish package notice changes" >&2
          exit 1
