name: Isolate per-process format cache once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/isolate-format-cache-once.yml"

concurrency:
  group: texpdf-isolate-format-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  isolate:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: quick
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch format-cache path and add concurrency test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/texpdf-core/src/compile.rs")
          text = source.read_text(encoding="utf-8")
          old = '''    if let Some(path) = env::var_os("TEXPDF_FORMAT_CACHE") {
        return PathBuf::from(path).join(bundle_digest);
    }
    env::temp_dir()
        .join("texpdf-format-cache")
        .join(bundle_digest)
'''
          new = '''    let process_component = std::process::id().to_string();
    if let Some(path) = env::var_os("TEXPDF_FORMAT_CACHE") {
        return PathBuf::from(path)
            .join(bundle_digest)
            .join(process_component);
    }
    env::temp_dir()
        .join("texpdf-format-cache")
        .join(bundle_digest)
        .join(process_component)
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif ".join(process_component)" not in text:
              raise SystemExit("cannot locate format cache function")
          source.write_text(text, encoding="utf-8")

          test = Path("crates/texpdf-core/tests/process_concurrency.rs")
          test.write_text(r'''use std::{
    env,
    fs,
    process::Command,
};

use texpdf_core::{compile, CompileRequest};

const HELPER_ENV: &str = "TEXPDF_PROCESS_CONCURRENCY_HELPER";

#[test]
fn separate_processes_can_compile_concurrently() {
    if env::var_os(HELPER_ENV).is_some() {
        let input = env::var_os("TEXPDF_PROCESS_INPUT").expect("helper input");
        let output = env::var_os("TEXPDF_PROCESS_OUTPUT").expect("helper output");
        compile(&CompileRequest::new(input, output)).expect("helper compile");
        return;
    }

    let workspace = tempfile::tempdir().expect("temporary workspace");
    let input = workspace.path().join("concurrent.tex");
    fs::write(
        &input,
        r#"\documentclass{article}
\begin{document}
Concurrent process compilation.
\end{document}
"#,
    )
    .expect("write source");

    let executable = env::current_exe().expect("current test executable");
    let mut children = Vec::new();
    for index in 0..2 {
        let output = workspace.path().join(format!("concurrent-{index}.pdf"));
        let child = Command::new(&executable)
            .arg("--exact")
            .arg("separate_processes_can_compile_concurrently")
            .arg("--nocapture")
            .env(HELPER_ENV, "1")
            .env("TEXPDF_PROCESS_INPUT", &input)
            .env("TEXPDF_PROCESS_OUTPUT", &output)
            .spawn()
            .expect("spawn helper process");
        children.push((child, output));
    }
    for (mut child, output) in children {
        let status = child.wait().expect("wait for helper");
        assert!(status.success(), "concurrent helper process failed");
        assert!(
            fs::read(output).expect("read concurrent PDF").starts_with(b"%PDF-")
        );
    }
}
''', encoding="utf-8")
          Path(".github/workflows/isolate-format-cache-once.yml").unlink()
          PY

          git add crates/texpdf-core/src/compile.rs \
            crates/texpdf-core/tests/process_concurrency.rs
          git add -u .github/workflows/isolate-format-cache-once.yml

      - name: Build and test real engine including process concurrency
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh

      - name: Preserve Rust evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-format-cache-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          cp -R .ci/stata/run/. "$evidence/"
          cp bundle/generated/bundle-info.json "$evidence/"

      - name: Run licensed Stata comprehensive profile
        shell: bash
        run: /bin/bash ci/run_stata_ci.sh quick

      - name: Restore and validate evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-format-cache-evidence"
          mkdir -p .ci/stata/run
          if [[ -d "$evidence" ]]; then cp -R "$evidence/." .ci/stata/run/; fi
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success

      - name: Commit per-process cache isolation
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin dist 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf dist .ci/stata/run bundle/generated
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(core): isolate format cache across Stata processes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
