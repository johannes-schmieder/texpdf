name: Restore formatting green once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-format-green-once.yml"

concurrency:
  group: texpdf-restore-format-green-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          "$rustup_bin" run 1.97.1 cargo fmt --all
          rm -f .github/workflows/restore-format-green-once.yml
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply canonical Rust formatting"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
