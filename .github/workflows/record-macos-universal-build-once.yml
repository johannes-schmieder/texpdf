name: Record verified macOS universal build once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/record-macos-universal-build-once.yml"
      - "docs/WORKFLOWS.md"

concurrency:
  group: texpdf-record-macos-universal-build-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 240
    env:
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ -f docs/WORKFLOWS.md ]] && [[ -x tools/build_macos_universal.sh ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build universal plugin
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash tools/build_macos_universal.sh
      - name: Verify both architectures and write build-only record
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess

          candidates = []
          for path in Path('.').rglob('*.plugin'):
              if '.git' in path.parts:
                  continue
              result = subprocess.run(
                  ['/usr/bin/lipo', '-archs', str(path)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  continue
              architectures = set(result.stdout.split())
              if {'arm64', 'x86_64'}.issubset(architectures):
                  candidates.append((path, sorted(architectures)))
          if not candidates:
              raise SystemExit('no plugin containing both arm64 and x86_64 was produced')
          candidates.sort(key=lambda item: item[0].stat().st_size, reverse=True)
          plugin, architectures = candidates[0]
          digest = hashlib.sha256(plugin.read_bytes()).hexdigest()
          source_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          record = {
              'schema_version': 1,
              'source_sha': source_sha,
              'artifact_path_at_build': str(plugin),
              'size_bytes': plugin.stat().st_size,
              'sha256': digest,
              'architectures': architectures,
              'binary_verified': True,
              'arm64_runtime_qualified_elsewhere': True,
              'x86_64_stata_runtime_qualified': False,
              'status': 'universal binary build verified; Intel Stata runtime qualification pending',
          }
          output = Path('release/macos-universal-build.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          registry_path = Path('release/targets.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          intel = registry.setdefault('targets', {}).setdefault('x86_64-apple-darwin', {})
          intel.update(
              {
                  'artifact': '_texpdf_plugin.plugin',
                  'build_source_sha': source_sha,
                  'build_artifact_sha256': digest,
                  'build_artifact_size_bytes': plugin.stat().st_size,
                  'build_architectures': architectures,
                  'stata_runtime_qualified': False,
                  'status': 'universal plugin build verified; Intel Stata runtime qualification pending',
              }
          )
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(
              'TEXPDF_MACOS_UNIVERSAL_BUILD_VERIFIED '
              f'path={plugin} size={plugin.stat().st_size} sha256={digest}'
          )
          PY
          rm -f .github/workflows/record-macos-universal-build-once.yml
      - name: Commit build-only evidence
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target dist bundle/generated .ci/stata/run
          rm -f stata/_texpdf_plugin.plugin
          git add release/macos-universal-build.json release/targets.json
          git add -u .github/workflows/record-macos-universal-build-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: record verified macOS universal plugin"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
