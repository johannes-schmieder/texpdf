name: Audit third-party licenses and notices

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/license-audit.yml"
      - "Cargo.lock"
      - "bundle/curated-manifest.json"
      - "bundle/license-overrides.toml"
      - "tools/generate_license_inventory.py"
      - "tools/generate_cargo_license_inventory.py"
      - "tools/generate_dependency_inventory.py"
      - "tools/collect_dependency_license_texts.py"
      - "tools/prepare_native_deps.sh"

concurrency:
  group: texpdf-license-audit
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  TLPDB_URL: https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2022/tlnet-final/tlpkg/texlive.tlpdb.xz

jobs:
  audit:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare pinned Rust and native dependency trees
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          toolchain="${RUST_TOOLCHAIN:-1.97.1}"
          cargo_bin="$($rustup_bin which --toolchain "$toolchain" cargo)"
          rustc_bin="$($rustup_bin which --toolchain "$toolchain" rustc)"
          echo "$(dirname "$cargo_bin")" >> "$GITHUB_PATH"
          echo "RUSTC=$rustc_bin" >> "$GITHUB_ENV"
          export PATH="$(dirname "$cargo_bin"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          export RUSTC="$rustc_bin"
          source tools/prepare_native_deps.sh
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "VCPKGRS_TRIPLET=$VCPKGRS_TRIPLET" >> "$GITHUB_ENV"
          echo "TECTONIC_DEP_BACKEND=$TECTONIC_DEP_BACKEND" >> "$GITHUB_ENV"

      - name: Fetch pinned TeX Live 2022 package metadata
        shell: bash
        run: |
          set -euo pipefail
          cache="${TEXPDF_LICENSE_CACHE:-/private/tmp/texpdf-license-cache}"
          mkdir -p "$cache"
          tlpdb="$cache/texlive-2022-final.tlpdb.xz"
          /usr/bin/python3 - "$TLPDB_URL" "$tlpdb" <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import sys
          import urllib.request

          url = sys.argv[1]
          destination = Path(sys.argv[2])
          if not destination.is_file() or destination.stat().st_size == 0:
              temporary = destination.with_suffix(destination.suffix + ".part")
              temporary.unlink(missing_ok=True)
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "texpdf-license-audit/0.1"},
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  with temporary.open("wb") as output:
                      while chunk := response.read(1024 * 1024):
                          output.write(chunk)
              os.replace(temporary, destination)
          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          print(
              "TEXPDF_TLPDB_READY "
              f"path={destination} bytes={destination.stat().st_size} sha256={digest}"
          )
          PY
          test -s "$tlpdb"
          echo "TEXPDF_TLPDB_PATH=$tlpdb" >> "$GITHUB_ENV"

      - name: Generate conservative inventories and collect texts
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf licenses/generated
          mkdir -p licenses/generated

          set +e
          /usr/bin/python3 tools/generate_license_inventory.py \
            --manifest bundle/curated-manifest.json \
            --tlpdb "$TEXPDF_TLPDB_PATH" \
            --overrides bundle/license-overrides.toml \
            --output licenses/generated/tex-resources.json \
            --markdown licenses/generated/tex-resources.md \
            --strict
          tex_rc=$?

          /usr/bin/python3 tools/generate_cargo_license_inventory.py \
            --output licenses/generated/cargo.json \
            --markdown licenses/generated/cargo.md \
            --strict
          cargo_rc=$?

          /usr/bin/python3 tools/generate_dependency_inventory.py \
            --json licenses/generated/dependencies.json \
            --markdown licenses/generated/dependencies.md \
            --require-declared
          dependency_rc=$?

          /usr/bin/python3 tools/collect_dependency_license_texts.py \
            --output-root licenses/generated/texts \
            --manifest licenses/generated/license-texts.json \
            --vcpkg-root "$VCPKG_ROOT" \
            --triplet "$VCPKGRS_TRIPLET" \
            --require-native
          texts_rc=$?
          set -e

          echo "tex_rc=$tex_rc" >> "$GITHUB_OUTPUT"
          echo "cargo_rc=$cargo_rc" >> "$GITHUB_OUTPUT"
          echo "dependency_rc=$dependency_rc" >> "$GITHUB_OUTPUT"
          echo "texts_rc=$texts_rc" >> "$GITHUB_OUTPUT"

      - name: Write source-bound audit status
        shell: bash
        env:
          TEX_RC: ${{ steps.inventory.outputs.tex_rc }}
          CARGO_RC: ${{ steps.inventory.outputs.cargo_rc }}
          DEPENDENCY_RC: ${{ steps.inventory.outputs.dependency_rc }}
          TEXTS_RC: ${{ steps.inventory.outputs.texts_rc }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          def load(path: str) -> dict:
              return json.loads(Path(path).read_text(encoding="utf-8"))

          tex = load("licenses/generated/tex-resources.json")
          cargo = load("licenses/generated/cargo.json")
          dependencies = load("licenses/generated/dependencies.json")
          texts = load("licenses/generated/license-texts.json")
          manifest = load("bundle/curated-manifest.json")
          tlpdb = Path(os.environ["TEXPDF_TLPDB_PATH"])
          tlpdb_sha = hashlib.sha256(tlpdb.read_bytes()).hexdigest()

          tex_summary = tex["summary"]
          manifest_count = int(manifest.get("file_count", 0))
          if tex_summary["resource_count"] != manifest_count:
              raise SystemExit(
                  "TeX inventory/manifest mismatch: "
                  f"{tex_summary['resource_count']} != {manifest_count}"
              )

          return_codes = {
              "tex_inventory": int(os.environ["TEX_RC"]),
              "cargo_inventory": int(os.environ["CARGO_RC"]),
              "dependency_inventory": int(os.environ["DEPENDENCY_RC"]),
              "notice_collection": int(os.environ["TEXTS_RC"]),
          }
          release_complete = (
              all(value == 0 for value in return_codes.values())
              and tex_summary["ambiguous"] == 0
              and tex_summary["unmapped"] == 0
              and tex_summary["missing_license"] == 0
              and cargo["summary"]["missing_license_metadata"] == 0
              and not dependencies["undeclared_rust_licenses"]
              and texts["complete"]
          )
          status = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "release_license_complete": release_complete,
              "return_codes": return_codes,
              "tex_resources": tex_summary,
              "cargo": cargo["summary"],
              "dependency_undeclared_count": len(
                  dependencies["undeclared_rust_licenses"]
              ),
              "missing_rust_notice_files": len(
                  texts["missing_rust_notice_files"]
              ),
              "missing_native_notice_files": len(
                  texts["missing_native_notice_files"]
              ),
              "tlpdb": {
                  "url": os.environ["TLPDB_URL"],
                  "sha256": tlpdb_sha,
                  "size_bytes": tlpdb.stat().st_size,
              },
              "curated_manifest_file_count": manifest_count,
              "qualification_boundary": (
                  "A green audit workflow means the audit completed and produced "
                  "evidence. Public release remains blocked unless "
                  "release_license_complete is true."
              ),
          }
          Path("licenses/generated/STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          lines = [
              "# Third-party license audit status",
              "",
              f"- Source SHA: `{status['source_sha']}`",
              f"- Release-license complete: **{str(release_complete).lower()}**",
              f"- Embedded resources: {tex_summary['resource_count']}",
              f"- Mapped resources: {tex_summary['mapped']}",
              f"- Ambiguous resources: {tex_summary['ambiguous']}",
              f"- Unmapped resources: {tex_summary['unmapped']}",
              f"- Resources missing license metadata: {tex_summary['missing_license']}",
              f"- Cargo packages: {cargo['summary']['package_count']}",
              f"- Cargo packages missing metadata: {cargo['summary']['missing_license_metadata']}",
              f"- Rust packages without collected notice files: {len(texts['missing_rust_notice_files'])}",
              f"- Native libraries without collected notice files: {len(texts['missing_native_notice_files'])}",
              "",
              "A successful workflow run means the audit executed. Public binary",
              "publication remains blocked until every count requiring review is zero",
              "and `release_license_complete` is true in `STATUS.json`.",
              "",
          ]
          Path("licenses/generated/STATUS.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          Path("licenses/generated/license-sources.lock.json").write_text(
              json.dumps(status["tlpdb"], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              "TEXPDF_LICENSE_AUDIT_STATUS "
              f"complete={str(release_complete).lower()} "
              f"mapped={tex_summary['mapped']} ambiguous={tex_summary['ambiguous']} "
              f"unmapped={tex_summary['unmapped']} missing_license={tex_summary['missing_license']}"
          )
          PY

      - name: Upload complete audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-license-audit-${{ github.sha }}-${{ github.run_id }}
          path: licenses/generated/
          if-no-files-found: error
          retention-days: 30

      - name: Publish generated summaries
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/licenses/generated"
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git -C "$GITHUB_WORKSPACE" worktree remove --force "$publish_tree" 2>/dev/null || true
              publish_tree=""
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin main
            publish_tree="$RUNNER_TEMP/texpdf-license-publish-$attempt"
            rm -rf "$publish_tree"
            git worktree add --detach "$publish_tree" origin/main
            mkdir -p "$publish_tree/licenses/generated"
            for name in \
              STATUS.json STATUS.md \
              tex-resources.json tex-resources.md \
              cargo.json cargo.md \
              dependencies.json dependencies.md \
              license-texts.json license-sources.lock.json; do
              cp "$source_dir/$name" "$publish_tree/licenses/generated/$name"
            done
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add licenses/generated
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "license: publish source-bound audit status [skip ci]"
            if git -C "$publish_tree" push origin HEAD:main; then
              exit 0
            fi
            cleanup
            sleep "$attempt"
          done
          echo "failed to publish license audit after three attempts" >&2
          exit 1
