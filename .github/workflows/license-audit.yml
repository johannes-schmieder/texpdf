name: Audit third-party licenses and notices

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/license-audit.yml"
      - "Cargo.lock"
      - "bundle/curated-manifest.json"
      - "bundle/license-evidence.json"
      - "bundle/license-overrides.toml"
      - "bundle/resource-policy.json"
      - "bundle/resources/**"
      - "bundle/required-resources.txt"
      - "bundle/resource-trace.txt.gz.b64"
      - "ci/run_license_audit.py"
      - "tools/generate_license_inventory.py"
      - "tools/generate_cargo_license_inventory.py"
      - "tools/generate_dependency_inventory.py"
      - "tools/collect_dependency_license_texts.py"
      - "tools/collect_tex_license_notices.py"
      - "licenses/canonical/**"
      - "licenses/texlive/**"
      - "release/scope.json"
      - "tools/summarize_license_review.py"
      - "tools/prepare_curated_bundle.py"
      - "tools/prepare_native_deps.sh"

concurrency:
  group: texpdf-license-audit
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"
  TEXPDF_BUNDLE_CACHE: /private/tmp/texpdf-bundle-cache
  TEXPDF_PYTHON: /usr/bin/python3
  TEXPDF_VCPKG_ROOT: /private/tmp/texpdf-vcpkg-a62ce77d56ee
  TEXPDF_VCPKG_BINARY_CACHE: /private/tmp/texpdf-vcpkg-binary-cache
  TEXPDF_PKGCONF_ROOT: /private/tmp/texpdf-pkgconf-4fc570f91d9d
  TLPDB_URL: https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2022/tlnet-final/tlpkg/texlive.tlpdb.xz

jobs:
  audit:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Select durable audit namespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          scope="$RUNNER_TEMP/texpdf-release-scope.json"
          git show origin/main:release/scope.json > "$scope"
          candidate_source=$(/usr/bin/python3 - "$scope" <<'PY'
          from pathlib import Path
          import json
          import sys

          scope = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(scope["candidate_source_sha"])
          PY
          )
          if [[ "$GITHUB_SHA" == "$candidate_source" ]]; then
            audit_root="licenses/generated"
          else
            audit_root="licenses/development-audit"
          fi
          echo "TEXPDF_LICENSE_OUTPUT_ROOT=$audit_root" >> "$GITHUB_ENV"
          echo "TEXPDF_LICENSE_NAMESPACE root=$audit_root source=$GITHUB_SHA candidate=$candidate_source"

      - name: Reconstruct and verify the source-bound curated manifest
        id: manifest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          trace="bundle/generated/license-audit-resource-trace.txt"
          generated_manifest="bundle/generated/curated-manifest.json"
          source_tar="$TEXPDF_BUNDLE_CACHE/tlextras-2022.0r0.tar"
          /usr/bin/python3 - "$trace" <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import sys

          destination = Path(sys.argv[1])
          source = Path("bundle/resource-trace.txt.gz.b64")
          compressed = base64.b64decode(source.read_bytes(), validate=True)
          names = set(gzip.decompress(compressed).decode("utf-8").splitlines())
          required = Path("bundle/required-resources.txt")
          if required.is_file():
              names.update(required.read_text(encoding="utf-8").splitlines())
          names.discard("")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text("\n".join(sorted(names)) + "\n", encoding="utf-8")
          print(f"TEXPDF_LICENSE_TRACE_READY names={len(names)} path={destination}")
          PY

          args=(
            --trace "$trace"
            --write-manifest "$generated_manifest"
            --cache-dir "$TEXPDF_BUNDLE_CACHE"
          )
          if [[ -f "$source_tar" ]]; then
            args+=(--source-tar "$source_tar")
          fi
          /usr/bin/python3 tools/prepare_curated_bundle.py "${args[@]}"

          /usr/bin/python3 - \
            "$generated_manifest" \
            "bundle/generated/bundle-info.json" \
            "bundle/curated-manifest.json" <<'PY'
          from pathlib import Path
          import json
          import sys

          generated_path = Path(sys.argv[1])
          info = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          committed = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          manifest = json.loads(generated_path.read_text(encoding="utf-8"))
          resources = manifest.get("resources", [])
          if len(resources) + 1 != info["file_count"]:
              raise SystemExit(
                  f"manifest/bundle count mismatch: {len(resources)} + 1 != {info['file_count']}"
              )
          for key in (
              "source_sha256",
              "index_sha256",
              "resource_policy_sha256",
              "excluded_resources",
              "resources",
          ):
              if manifest.get(key) != committed.get(key):
                  raise SystemExit(f"committed curated manifest differs at {key}")
          expected_info = {
              "file_count": committed.get("bundle_file_count"),
              "zip_sha256": committed.get("bundle_zip_sha256"),
              "tectonic_bundle_digest": committed.get("bundle_content_digest"),
          }
          for key, expected in expected_info.items():
              if info.get(key) != expected:
                  raise SystemExit(
                      f"curated bundle metadata mismatch at {key}: "
                      f"expected {expected}, got {info.get(key)}"
                  )
          print(
              "TEXPDF_CURATED_MANIFEST_VERIFIED "
              f"resources={len(resources)} bundle_files={info['file_count']} "
              f"zip_sha256={info['zip_sha256']}"
          )
          PY

      - name: Run source-bound fail-closed audit
        shell: bash
        run: /usr/bin/python3 ci/run_license_audit.py --output-root "$TEXPDF_LICENSE_OUTPUT_ROOT"

      - name: Generate compact review queues
        shell: bash
        run: |
          /usr/bin/python3 tools/summarize_license_review.py \
            --tex-inventory "$TEXPDF_LICENSE_OUTPUT_ROOT/tex-resources.json" \
            --rust-text-inventory "$TEXPDF_LICENSE_OUTPUT_ROOT/license-texts.json" \
            --tex-output "$TEXPDF_LICENSE_OUTPUT_ROOT/tex-review.json" \
            --rust-output "$TEXPDF_LICENSE_OUTPUT_ROOT/rust-notice-review.json"

      - name: Upload complete and partial audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-license-audit-${{ github.sha }}-${{ github.run_id }}
          path: |
            licenses/generated/
            licenses/development-audit/
            bundle/curated-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish durable audit summaries and verified manifest
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TEXPDF_LICENSE_OUTPUT_ROOT" in
            licenses/generated|licenses/development-audit) ;;
            *) echo "unexpected audit root: $TEXPDF_LICENSE_OUTPUT_ROOT" >&2; exit 2 ;;
          esac
          source_dir="$GITHUB_WORKSPACE/$TEXPDF_LICENSE_OUTPUT_ROOT"
          test -f "$source_dir/STATUS.json"
          test -f "$source_dir/STATUS.md"
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git -C "$GITHUB_WORKSPACE" worktree remove --force "$publish_tree" 2>/dev/null || true
              publish_tree=""
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin main
            publish_tree="$RUNNER_TEMP/texpdf-license-publish-$attempt"
            rm -rf "$publish_tree"
            git worktree add --detach "$publish_tree" origin/main
            mkdir -p "$publish_tree/$TEXPDF_LICENSE_OUTPUT_ROOT" "$publish_tree/bundle"
            for name in \
              STATUS.json STATUS.md \
              tex-resources.json tex-resources.md tex-review.json \
              cargo.json cargo.md \
              dependencies.json dependencies.md \
              license-texts.json tex-notices.json rust-notice-review.json \
              license-sources.lock.json; do
              if [[ -f "$source_dir/$name" ]]; then
                cp "$source_dir/$name" "$publish_tree/$TEXPDF_LICENSE_OUTPUT_ROOT/$name"
              else
                rm -f "$publish_tree/$TEXPDF_LICENSE_OUTPUT_ROOT/$name"
              fi
            done
            if [[ -f "$GITHUB_WORKSPACE/bundle/curated-manifest.json" ]]; then
              cp "$GITHUB_WORKSPACE/bundle/curated-manifest.json" \
                "$publish_tree/bundle/curated-manifest.json"
            fi
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add -A "$TEXPDF_LICENSE_OUTPUT_ROOT" bundle/curated-manifest.json
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "license: publish source-bound audit status [skip ci]"
            if git -C "$publish_tree" push origin HEAD:main; then
              exit 0
            fi
            cleanup
            sleep "$attempt"
          done
          echo "failed to publish license audit after three attempts" >&2
          exit 1

      - name: Enforce complete release-license status
        shell: bash
        run: |
          /usr/bin/python3 - "$TEXPDF_LICENSE_OUTPUT_ROOT/STATUS.json" <<'PY'
          from pathlib import Path
          import json
          import sys

          status = json.loads(
              Path(sys.argv[1]).read_text(encoding="utf-8")
          )
          if status.get("release_license_complete") is not True:
              raise SystemExit("release_license_complete is not true")
          print("TEXPDF_LICENSE_GATE_PASS release_license_complete=true")
          PY
