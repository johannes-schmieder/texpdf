name: Commit embedded-helper lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-helper-lock-v2.yml"

concurrency:
  group: texpdf-update-helper-lock-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lock:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update lockfile without changing registry versions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          toolchain="${RUST_TOOLCHAIN:-1.97.1}"
          cargo_bin="$($rustup_bin which --toolchain "$toolchain" cargo)"
          export RUSTC="$($rustup_bin which --toolchain "$toolchain" rustc)"
          export PATH="$(dirname "$cargo_bin"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          "$cargo_bin" metadata --format-version 1 >/dev/null
          /usr/bin/python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock <<'PY'
          from pathlib import Path
          import re
          import sys

          blocks = re.compile(r"^\[\[package\]\]\n(.*?)(?=^\[\[package\]\]|\Z)", re.M | re.S)
          fields = re.compile(r'^([a-z_]+) = "([^"]*)"$', re.M)

          def external(path):
              values = set()
              for block in blocks.findall(Path(path).read_text(encoding="utf-8")):
                  item = dict(fields.findall(block))
                  if item.get("source"):
                      values.add((item.get("name"), item.get("version"), item.get("source"), item.get("checksum")))
              return values

          before = external(sys.argv[1])
          after = external(sys.argv[2])
          if before != after:
              raise SystemExit(
                  f"registry graph changed; added={sorted(after-before)} removed={sorted(before-after)}"
              )
          text = Path(sys.argv[2]).read_text(encoding="utf-8")
          for name in ("texpdf-helper", "texpdf-protocol", "texpdf-stata"):
              if f'name = "{name}"' not in text:
                  raise SystemExit(f"updated lockfile lacks {name}")
          print("TEXPDF_HELPER_LOCK_READY external_registry_graph_unchanged=true")
          PY

      - name: Commit lockfile and remove both temporary gates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-helper-lock.yml
          rm -f .github/workflows/update-helper-lock-v2.yml
          git add Cargo.lock
          git add -u .github/workflows/update-helper-lock.yml \
            .github/workflows/update-helper-lock-v2.yml || true
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock embedded helper dependency graph"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
