name: Optimize standalone plugin size once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-plugin-size-once.yml"

concurrency:
  group: texpdf-plugin-size-optimization
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  optimize:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 150
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add safe platform stripping to staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/stage_plugin.py")
          text = path.read_text(encoding="utf-8")
          helper = '''

def strip_native_library(path: Path) -> None:
    """Remove nonessential symbols while preserving the Stata ABI exports."""
    if sys.platform == "darwin":
        subprocess.run(["/usr/bin/strip", "-x", str(path)], check=True)
    elif sys.platform.startswith("linux"):
        tool = shutil.which("strip")
        if tool is None:
            raise RuntimeError("strip is required for a Linux release plugin")
        subprocess.run([tool, "--strip-unneeded", str(path)], check=True)

'''
          if "def strip_native_library" not in text:
              anchor = "def verify_symbols(path: Path) -> list[str]:\n"
              if anchor not in text:
                  raise SystemExit("cannot locate plugin symbol verifier")
              text = text.replace(anchor, helper + anchor, 1)
          old = '''    shutil.copyfile(source, temporary)
    os.replace(temporary, args.output)
    try:
        exports = verify_symbols(args.output)
'''
          new = '''    shutil.copyfile(source, temporary)
    try:
        strip_native_library(temporary)
        os.replace(temporary, args.output)
        exports = verify_symbols(args.output)
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("cannot locate plugin staging block")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/optimize-plugin-size-once.yml").unlink(missing_ok=True)
          PY
          git add tools/stage_plugin.py
          git add -u .github/workflows/optimize-plugin-size-once.yml

      - name: Build optimized real plugin and run Rust suite
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/record_rust_quick.sh
          rm -rf "$RUNNER_TEMP/texpdf-size-rust"
          mkdir -p "$RUNNER_TEMP/texpdf-size-rust"
          cp -R .ci/stata/run/. "$RUNNER_TEMP/texpdf-size-rust/"

      - name: Run licensed Stata full qualification on optimized plugin
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ci/run_stata_ci.sh quick
          cp -R "$RUNNER_TEMP/texpdf-size-rust/." .ci/stata/run/
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json \
            .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success

      - name: Record size comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          manifest = json.loads(Path(".ci/stata/run/plugin-manifest.json").read_text(encoding="utf-8"))
          baseline = json.loads(Path("bundle/QUALIFICATION.json").read_text(encoding="utf-8"))["plugin"]
          optimized = Path("stata/_texpdf_plugin.plugin")
          payload = {
              "schema_version": 1,
              "qualified_source_sha": os.environ["GITHUB_SHA"],
              "platform": "macOS Apple Silicon",
              "operation": "strip -x",
              "baseline_size_bytes": baseline["size_bytes"],
              "optimized_size_bytes": optimized.stat().st_size,
              "bytes_saved": baseline["size_bytes"] - optimized.stat().st_size,
              "size_ratio": optimized.stat().st_size / baseline["size_bytes"],
              "optimized_sha256": hashlib.sha256(optimized.read_bytes()).hexdigest(),
              "exports": manifest["exports"],
              "dynamic_dependencies": manifest.get("dynamic_dependencies", []),
              "stata_profile": "quick",
              "stata_status": "success",
              "rust_status": "success",
          }
          if payload["bytes_saved"] <= 0:
              raise SystemExit("stripping did not reduce the plugin size")
          Path("platform/macos-arm64-size-optimization.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("TEXPDF_PLUGIN_SIZE_OPTIMIZED", payload)
          PY

      - name: Commit qualified size optimization
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin 2>/dev/null || true
          rm -rf stata/_texpdf_plugin.plugin .ci/stata/run bundle/generated
          git add platform/macos-arm64-size-optimization.json
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: strip nonessential plugin symbols"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
