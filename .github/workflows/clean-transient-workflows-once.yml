name: Clean transient workflows once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clean-transient-workflows-once.yml"
      - "licenses/inventory/tex-resources.json"

concurrency:
  group: texpdf-clean-transient-workflows-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clean:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ -f licenses/inventory/tex-resources.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove completed one-shot workflows
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          workflow_dir = Path(".github/workflows")
          keep = {
              "stata-ci.yml",
              "build-cross-platform.yml",
              "build-development-artifacts.yml",
              "build-linux-windows.yml",
              "build-macos-universal.yml",
              "build-macos-artifact.yml",
              "generate-license-inventory.yml",
              "release-audit.yml",
              "stress-memory-macos.yml",
              "publish-artifact-manifest.yml",
              "publish-artifact-summary.yml",
              "publish-target-qualification.yml",
              "record-hardening-failures.yml",
          }
          removed = []
          for path in sorted(workflow_dir.glob("*.yml")):
              if path.name in keep:
                  continue
              removed.append(path.name)
              path.unlink()
          Path("docs/WORKFLOWS.md").write_text(
              """# GitHub Actions workflows

The workflow directory is intentionally limited to reusable project
infrastructure. Temporary implementation and migration workflows are deleted
after their changes are committed.

## Authoritative runtime CI

- `stata-ci.yml`: exact-SHA Rust build/tests followed by licensed Stata tests on
  the repository-scoped Apple Silicon runner; publishes immutable receipts.

## Build and artifact workflows

- `build-development-artifacts.yml`: private development package artifacts.
- `build-cross-platform.yml`: cross-platform build orchestration.
- `build-linux-windows.yml`: Linux/Windows build-only matrix until licensed
  runtime runners are available.
- `build-macos-universal.yml`: macOS ARM64/Intel universal build.
- `build-macos-artifact.yml`: macOS installation artifact assembly.
- `publish-artifact-manifest.yml` and `publish-artifact-summary.yml`: exact
  artifact sizes and hashes.
- `publish-target-qualification.yml`: updates the per-target registry only from
  qualifying evidence.

## Audit workflows

- `generate-license-inventory.yml`: dependency and embedded-resource inventory.
- `release-audit.yml`: fail-closed release-readiness checks.
- `stress-memory-macos.yml`: repeated-call and memory-growth qualification.
- `record-hardening-failures.yml`: sanitized failure evidence for hardening jobs.

Build-only workflows never establish Stata runtime support. Runtime support is
recorded only after the target plugin passes actual Stata qualification.
""",
              encoding="utf-8",
          )
          print("TEXPDF_TRANSIENT_WORKFLOWS_REMOVED " + ",".join(removed))
          PY
          rm -f .github/workflows/clean-transient-workflows-once.yml
      - name: Validate retained workflows
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ci/check_workflows.sh ]]; then
            ci/check_workflows.sh
          fi
          git diff --check
      - name: Commit workflow cleanup
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git add docs/WORKFLOWS.md
          git add -u .github/workflows
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove completed one-shot workflows"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
