name: Reconcile project state fallback once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reconcile-project-state-v2-once.yml"
      - "crates/texpdf-core/tests/missing_package.rs"
      - "crates/texpdf-core/tests/pdf_figure.rs"
      - "crates/texpdf-core/tests/png_figure.rs"

concurrency:
  group: texpdf-reconcile-project-state-fallback
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile only if still stale
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          plan_path = Path('PLAN.md')
          status_path = Path('STATUS.md')
          already_clean = (
              plan_path.is_file()
              and status_path.is_file()
              and plan_path.read_text(encoding='utf-8').startswith('# texpdf plan to v1')
              and '## Documentation hierarchy' in status_path.read_text(encoding='utf-8')
          )
          if already_clean:
              Path('.github/workflows/reconcile-project-state-v2-once.yml').unlink()
              raise SystemExit(0)

          receipts = []
          for path in Path('.ci/stata/results').glob('*.json'):
              try:
                  item = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if (
                  item.get('status') == 'success'
                  and item.get('stata_status') == 'success'
                  and item.get('rust_status') == 'success'
                  and item.get('rust_mode') == 'repository-engine'
                  and all(
                      marker.get('present') is True
                      for marker in item.get('required_log_markers', [])
                  )
              ):
                  receipts.append(item)
          if not receipts:
              raise SystemExit('no exact green full-engine receipt')
          receipts.sort(key=lambda item: item.get('completed_at', ''))
          green = receipts[-1]
          sha = green['tested_sha']
          qualification = json.loads(
              Path('bundle/QUALIFICATION.json').read_text(encoding='utf-8')
          )
          targets = json.loads(
              Path('release/targets.json').read_text(encoding='utf-8')
          )['targets']
          arm = targets.get('aarch64-apple-darwin', {})
          bundle_bytes = int(
              arm.get('bundle_zip_size_bytes')
              or qualification.get('bundle', {}).get('zip_size_bytes', 0)
          )
          plugin_bytes = int(
              arm.get('plugin_size_bytes')
              or qualification.get('plugin', {}).get('size_bytes', 0)
          )
          package_bytes = int(
              qualification.get('package', {}).get('zip_size_bytes', 0)
          )
          mib = lambda value: f'{value / 1024 / 1024:.2f} MiB'

          status_path.write_text(f'''# texpdf development status

Updated: 2026-08-24

## Executive status

The compiler-only macOS Apple Silicon implementation is functional and exact-SHA
qualified in licensed Stata/MP 18. `texpdf` is one native plugin containing
Tectonic 0.17.0 and a curated offline academic TeX bundle.

```stata
texpdf using document.tex
texpdf using document.tex, saving(document.pdf) replace
texpdf, version
```

The project is not yet a public cross-platform v1 release.

## Authoritative exact qualification

- Source: `{sha}`
- Profile: `{green.get("profile", "")}`
- Overall / Rust / Stata: `{green.get("status", "")}` / `{green.get("rust_status", "")}` / `{green.get("stata_status", "")}`
- Rust mode: `{green.get("rust_mode", "")}`
- Platform: `{green.get("platform", "")}`
- Run: `{green.get("run_id", "")}`

## Artifact scale

- Curated resource ZIP: {bundle_bytes:,} bytes ({mib(bundle_bytes)})
- macOS ARM64 plugin: {plugin_bytes:,} bytes ({mib(plugin_bytes)})
- Stata installation ZIP: {package_bytes:,} bytes ({mib(package_bytes)})

Machine-readable hashes and provenance are in `bundle/QUALIFICATION.json` and
`release/targets.json`.

## Remaining v1 gates

1. Complete resource/package/font license mapping and required notices.
2. Complete the high-iteration and memory-growth safety review.
3. Build and inspect macOS Intel/universal, Windows x86-64, and Linux x86-64.
4. Run actual licensed Stata qualification on every advertised target.
5. Pass the clean-machine fail-closed release audit and publish GitHub assets.

## Documentation hierarchy

- `STATUS.md`: current release state.
- `PLAN.md`: completed and remaining milestones.
- `IMPLEMENTATION.md`: architecture and behavior.
- `bundle/QUALIFICATION.json`: exact artifact evidence.
- `release/targets.json`: per-target support registry.
- `.ci/stata/results/`: immutable source receipts.
''', encoding='utf-8')

          plan_path.write_text(f'''# texpdf plan to v1

Updated: 2026-08-24  
Development branch: **main**  
Last exact full-engine green source: `{sha}`

## Product definition

`texpdf` compiles complete LaTeX documents from Stata using one offline native
plugin per platform. v1 is compiler-only, uses embedded Tectonic, supports the
curated academic package tier and BibTeX/natbib, and is distributed through
GitHub Releases plus `net install`.

## Completed

- [x] Rust/Tectonic compilation core and structured diagnostics.
- [x] Deterministic embedded offline bundle.
- [x] Panic-contained SPI 3.0 Stata bridge.
- [x] `texpdf using`, `saving()`, `replace`, and `version`.
- [x] Academic corpus, figures, fonts, natbib, and internal BibTeX.
- [x] Spaces/Unicode, relative files, error recovery, output rollback.
- [x] Deterministic package assembly and local `net install`.
- [x] macOS Apple Silicon licensed-Stata runtime qualification.
- [x] Exact sizes, hashes, receipts, and target registry.

## Remaining

### License-complete redistribution

- [ ] Resolve every embedded resource to reviewed license evidence.
- [ ] Collect all required Rust/native/TeX/font notice texts.
- [ ] Pass the fail-closed licensing audit.

### Safety gate

- [x] Ordinary malformed-input and recovery testing.
- [x] Repeated in-process compilation qualification.
- [x] Shell escape denial and output-preservation testing.
- [ ] Complete 1,000-call/memory-growth review and residual-risk record.

### Cross-platform qualification

- [x] macOS ARM64 build and Stata runtime qualification.
- [ ] macOS Intel/universal build and Intel Stata runtime qualification.
- [ ] Windows x86-64 build and Stata runtime qualification.
- [ ] Linux x86-64 build and Stata runtime qualification.

### Release

- [x] Define package/checksum/manifest layout.
- [ ] Build license-complete target assets.
- [ ] Run clean-machine offline release qualification.
- [ ] Publish and verify v1.0.0 GitHub Release / `net install`.

## Immediate order

1. Keep `main` exact-SHA green.
2. Close the embedded-resource license inventory.
3. Review high-iteration/memory evidence.
4. Close macOS universal, then Linux and Windows build/runtime gates.
5. Run the fail-closed release audit and publish v1.
''', encoding='utf-8')

          Path('.github/workflows/reconcile-project-state-v2-once.yml').unlink()
          PY
          git add STATUS.md PLAN.md
          git add -u .github/workflows/reconcile-project-state-v2-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: reconcile status and v1 plan"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
