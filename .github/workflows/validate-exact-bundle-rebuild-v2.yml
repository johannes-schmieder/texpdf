name: Validate exact bundle metadata rebuild v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-exact-bundle-rebuild-v2.yml"

concurrency:
  group: texpdf-exact-bundle-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch complete metadata schema and rebuild
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/rebuild_curated_bundle.py")
          text = path.read_text(encoding="utf-8")
          if "import urllib.parse" not in text:
              text = text.replace("import urllib.request\n", "import urllib.parse\nimport urllib.request\n", 1)
          text = text.replace("urllib.request.urlparse(url)", "urllib.parse.urlparse(url)")
          old = '''            "bundle_version": qualification["bundle"]["version"],
            "tectonic_bundle_digest": qualification["bundle"]["content_digest"],
'''
          new = '''            "bundle_version": qualification["bundle"]["version"],
            "transform_version": qualification["bundle"]["transform_version"],
            "source_sha256": qualification["bundle"]["source_sha256"],
            "index_sha256": qualification["bundle"]["index_sha256"],
            "tectonic_bundle_digest": qualification["bundle"]["content_digest"],
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("cannot locate bundle-info metadata block")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -rf bundle/generated
          /usr/bin/python3 tools/rebuild_curated_bundle.py \
            --cache-dir "${TEXPDF_BUNDLE_CACHE:-/private/tmp/texpdf-bundle-cache}"
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          qualification = json.loads(Path("bundle/QUALIFICATION.json").read_text(encoding="utf-8"))
          expected = qualification["bundle"]
          info = json.loads(Path("bundle/generated/bundle-info.json").read_text(encoding="utf-8"))
          required_info = {
              "schema_version": 1,
              "bundle_name": expected["name"],
              "bundle_version": expected["version"],
              "transform_version": expected["transform_version"],
              "source_sha256": expected["source_sha256"],
              "index_sha256": expected["index_sha256"],
              "tectonic_bundle_digest": expected["content_digest"],
              "zip_sha256": expected["zip_sha256"],
              "file_count": expected["file_count"],
              "zip_size_bytes": expected["zip_size_bytes"],
          }
          for key, value in required_info.items():
              assert info.get(key) == value, (key, info.get(key), value)
          bundle = Path("bundle/generated/texpdf-bundle.zip")
          assert bundle.stat().st_size == expected["zip_size_bytes"]
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == expected["zip_sha256"]
          with zipfile.ZipFile(bundle) as archive:
              assert len(archive.namelist()) == expected["file_count"]
              assert archive.read("SHA256SUM")[:64].decode("ascii") == expected["content_digest"]
          print("TEXPDF_EXACT_BUNDLE_METADATA_PASS", required_info)
          PY

      - name: Compile core against rebuilt metadata
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain 1.97.1 cargo)"
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-/private/tmp/texpdf-cargo-target}"
          source tools/prepare_native_deps.sh
          "$cargo_bin" test --locked --package texpdf-core bundle::tests::embedded_bundle_opens_and_has_expected_digest

      - name: Commit validated exact rebuild implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle/generated
          rm -f .github/workflows/validate-exact-bundle-rebuild.yml
          rm -f .github/workflows/validate-exact-bundle-rebuild-v2.yml
          git add tools/rebuild_curated_bundle.py
          git add -u .github/workflows/validate-exact-bundle-rebuild.yml \
            .github/workflows/validate-exact-bundle-rebuild-v2.yml || true
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: validate exact cross-platform bundle rebuild"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "failed to publish exact bundle rebuild implementation" >&2
          exit 1
