name: Build Linux and Windows development artifacts

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hosted build target
        required: true
        type: choice
        options:
          - all
          - linux
          - windows
        default: all

permissions:
  contents: read

concurrency:
  group: texpdf-hosted-${{ inputs.platform }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  TEXPDF_RUST_TOOLCHAIN: "1.97.1"

jobs:
  linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 perl curl git
          rustup toolchain install "$TEXPDF_RUST_TOOLCHAIN" \
            --profile minimal --component rustfmt,clippy
          rustup target add --toolchain "$TEXPDF_RUST_TOOLCHAIN" \
            x86_64-unknown-linux-gnu

      - name: Range-build the exact qualified resource ZIP
        shell: bash
        run: >-
          python3 tools/prepare_curated_bundle.py
          --manifest bundle/curated-manifest.json
          --identity bundle/DEVELOPMENT.json
          --cache-dir "$RUNNER_TEMP/texpdf-bundle-cache"

      - name: Prepare pinned static native dependencies
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC="$(rustup which --toolchain "$TEXPDF_RUST_TOOLCHAIN" rustc)"
          export TEXPDF_VCPKG_ROOT="$RUNNER_TEMP/texpdf-vcpkg"
          export TEXPDF_VCPKG_BINARY_CACHE="$RUNNER_TEMP/texpdf-vcpkg-binary-cache"
          export TEXPDF_PKGCONF_ROOT="$RUNNER_TEMP/texpdf-pkgconf"
          source tools/prepare_native_deps_for_target.sh x86_64-unknown-linux-gnu
          {
            echo "VCPKG_ROOT=$VCPKG_ROOT"
            echo "VCPKGRS_TRIPLET=$VCPKGRS_TRIPLET"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_DEFAULT_BINARY_CACHE"
            echo "TECTONIC_DEP_BACKEND=$TECTONIC_DEP_BACKEND"
          } >> "$GITHUB_ENV"

      - name: Test and build Linux plugin
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$TEXPDF_RUST_TOOLCHAIN"
          export RUSTC="$(rustup which --toolchain "$TEXPDF_RUST_TOOLCHAIN" rustc)"
          cargo="$(rustup which --toolchain "$TEXPDF_RUST_TOOLCHAIN" cargo)"
          "$RUSTC" --version
          export CARGO_TARGET_DIR="$RUNNER_TEMP/texpdf-target"
          "$cargo" fmt --all --check
          "$cargo" build --locked --release --package texpdf-helper \
            --target x86_64-unknown-linux-gnu
          export TEXPDF_HELPER_PATH="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/texpdf-helper"
          test -f "$TEXPDF_HELPER_PATH"
          "$cargo" clippy --locked --workspace --all-targets --all-features -- -D warnings
          "$cargo" test --locked --workspace --all-targets --all-features
          "$cargo" build --locked --release --package texpdf-stata \
            --target x86_64-unknown-linux-gnu
          source="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/libtexpdf_stata.so"
          mkdir -p dist/linux-x86_64
          cp "$source" dist/linux-x86_64/_texpdf_plugin_unix.plugin
          nm -D --defined-only dist/linux-x86_64/_texpdf_plugin_unix.plugin | grep -Eq '(^|[[:space:]])pginit$'
          nm -D --defined-only dist/linux-x86_64/_texpdf_plugin_unix.plugin | grep -Eq '(^|[[:space:]])stata_call$'
          ldd dist/linux-x86_64/_texpdf_plugin_unix.plugin | tee dist/linux-x86_64/ldd.txt
          if grep -Eiq '(fontconfig|freetype|harfbuzz|graphite|icu|libpng|libz\.so|vcpkg)' dist/linux-x86_64/ldd.txt; then
            echo "unexpected dynamically linked typesetting dependency" >&2
            exit 2
          fi
          python3 tools/check_plugin_binary.py \
            dist/linux-x86_64/_texpdf_plugin_unix.plugin \
            --platform linux \
            --output dist/linux-x86_64/binary-policy.json
          python3 tools/plugin_smoke.py \
            dist/linux-x86_64/_texpdf_plugin_unix.plugin \
            --bundle-info bundle/generated/bundle-info.json \
            --output dist/linux-x86_64/plugin-smoke.json

      - name: Write Linux artifact manifest and package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import platform
          import subprocess

          plugin = Path("dist/linux-x86_64/_texpdf_plugin_unix.plugin")
          sha = hashlib.sha256(plugin.read_bytes()).hexdigest()
          payload = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "target": "x86_64-unknown-linux-gnu",
              "build_platform": platform.platform(),
              "plugin_size_bytes": plugin.stat().st_size,
              "plugin_sha256": sha,
              "exports": ["pginit", "stata_call"],
              "dynamic_dependencies": Path("dist/linux-x86_64/ldd.txt").read_text(encoding="utf-8").splitlines(),
              "rust_tests": "success",
              "canonical_release_builder": False,
              "glibc_2_28_qualified": False,
              "stata_runtime_qualified": False,
              "qualification_boundary": "Development-only hosted Ubuntu compiler/core build. The canonical Linux release binary and GLIBC 2.28 ceiling are qualified separately on SCC RHEL 8 with licensed Stata.",
          }
          Path("dist/linux-x86_64/manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("TEXPDF_LINUX_BUILD_READY", payload)
          PY
          candidate_version=$(python3 -c 'import json; print(json.load(open("release/scope.json"))["candidate_version"])')
          python3 tools/package_release.py \
            --plugin dist/linux-x86_64/_texpdf_plugin_unix.plugin \
            --embedded-helper "$RUNNER_TEMP/texpdf-target/x86_64-unknown-linux-gnu/release/texpdf-helper" \
            --bundle-info bundle/generated/bundle-info.json \
            --output-dir dist/texpdf-linux-x86_64 \
            --zip dist/texpdf-linux-x86_64.zip \
            --manifest dist/linux-x86_64/package-manifest.json \
            --target x86_64-unknown-linux-gnu \
            --package-version "$candidate_version"

      - name: Upload Linux development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-linux-x86_64-${{ github.sha }}
          path: |
            dist/linux-x86_64/
            dist/texpdf-linux-x86_64/
            dist/texpdf-linux-x86_64.zip
            bundle/generated/bundle-info.json
          if-no-files-found: error
          retention-days: 30

  windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:TEXPDF_RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          rustup target add --toolchain $env:TEXPDF_RUST_TOOLCHAIN x86_64-pc-windows-msvc

      - name: Range-build the exact qualified resource ZIP
        shell: pwsh
        run: |
          python tools/prepare_curated_bundle.py `
            --manifest bundle/curated-manifest.json `
            --identity bundle/DEVELOPMENT.json `
            --cache-dir "$env:RUNNER_TEMP\texpdf-bundle-cache"

      - name: Prepare pinned static native dependencies
        shell: pwsh
        run: |
          $env:TEXPDF_VCPKG_ROOT = "$env:RUNNER_TEMP\texpdf-vcpkg"
          $env:TEXPDF_VCPKG_BINARY_CACHE = "$env:RUNNER_TEMP\texpdf-vcpkg-binary-cache"
          & tools/prepare_native_deps_windows.ps1 -Target x86_64-pc-windows-msvc

      - name: Test and build Windows plugin
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = $env:TEXPDF_RUST_TOOLCHAIN
          $env:RUSTC = (rustup which --toolchain $env:TEXPDF_RUST_TOOLCHAIN rustc).Trim()
          $cargo = (rustup which --toolchain $env:TEXPDF_RUST_TOOLCHAIN cargo).Trim()
          & $env:RUSTC --version
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP\texpdf-target"
          & $cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cargo build --locked --release --package texpdf-helper --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEXPDF_HELPER_PATH = "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\texpdf-helper.exe"
          if (-not (Test-Path $env:TEXPDF_HELPER_PATH)) { throw "target-matching helper was not built" }
          & $cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cargo test --locked --workspace --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cargo build --locked --release --package texpdf-stata --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\texpdf_stata.dll"
          New-Item -ItemType Directory -Force -Path dist\windows-x86_64 | Out-Null
          Copy-Item $source dist\windows-x86_64\_texpdf_plugin_windows.plugin
          Copy-Item $env:TEXPDF_HELPER_PATH dist\windows-x86_64\texpdf-helper.exe

      - name: Audit Windows exports and dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found" }
          $dumpbin = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" |
              Select-Object -First 1
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) {
              throw "dumpbin.exe was not found through vswhere"
          }
          $plugin = "dist\windows-x86_64\_texpdf_plugin_windows.plugin"
          $helper = "dist\windows-x86_64\texpdf-helper.exe"
          $exports = & $dumpbin /exports $plugin
          $exports | Set-Content -Encoding UTF8 dist\windows-x86_64\exports.txt
          if (-not ($exports -match '\bpginit\b')) { throw "pginit export is missing" }
          if (-not ($exports -match '\bstata_call\b')) { throw "stata_call export is missing" }
          $dependents = & $dumpbin /dependents $plugin
          $dependents | Set-Content -Encoding UTF8 dist\windows-x86_64\dependents.txt
          $helperDependents = & $dumpbin /dependents $helper
          $helperDependents | Set-Content -Encoding UTF8 dist\windows-x86_64\helper-dependents.txt
          $allDependents = @($dependents) + @($helperDependents)
          if ($allDependents -match '(?i)(fontconfig|freetype|harfbuzz|graphite|icu|libpng|zlib|vcpkg).*\.dll') {
              throw "unexpected dynamically linked typesetting dependency"
          }
          if ($allDependents -match '(?i)(vcruntime|msvcp|ucrtbase|api-ms-win-crt).*\.dll') {
              throw "MSVC C/C++ runtime is dynamically linked"
          }

      - name: Write Windows artifact manifest and package
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib
          import json
          import os
          import platform
          import re

          plugin = Path(r"dist/windows-x86_64/_texpdf_plugin_windows.plugin")
          helper = Path(r"dist/windows-x86_64/texpdf-helper.exe")
          dependencies = {
              "plugin": Path(r"dist/windows-x86_64/dependents.txt").read_text(encoding="utf-8").splitlines(),
              "helper": Path(r"dist/windows-x86_64/helper-dependents.txt").read_text(encoding="utf-8").splitlines(),
          }
          forbidden = [
              line for lines in dependencies.values() for line in lines
              if re.search(r"(?i)(vcruntime|msvcp|ucrtbase|api-ms-win-crt).*\.dll", line)
          ]
          policy = {
              "schema_version": 1,
              "target": "x86_64-pc-windows-msvc",
              "static_msvc_crt": not forbidden,
              "forbidden_dynamic_crt_dependencies": forbidden,
              "violations": ([] if not forbidden else ["dynamic-msvc-crt"]),
          }
          Path(r"dist/windows-x86_64/binary-policy.json").write_text(
              json.dumps(policy, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          payload = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "target": "x86_64-pc-windows-msvc",
              "build_platform": platform.platform(),
              "plugin_size_bytes": plugin.stat().st_size,
              "plugin_sha256": hashlib.sha256(plugin.read_bytes()).hexdigest(),
              "helper_size_bytes": helper.stat().st_size,
              "helper_sha256": hashlib.sha256(helper.read_bytes()).hexdigest(),
              "exports": ["pginit", "stata_call"],
              "dynamic_dependencies": dependencies,
              "binary_policy": policy,
              "rust_tests": "success",
              "stata_runtime_qualified": False,
              "qualification_boundary": "Compiler/core tests passed on Windows; actual licensed Windows Stata loading is still required.",
          }
          Path(r"dist/windows-x86_64/manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("TEXPDF_WINDOWS_BUILD_READY", payload)
          '@ | python -
          $candidateVersion = (Get-Content release\scope.json | ConvertFrom-Json).candidate_version
          python tools/package_release.py `
            --plugin dist\windows-x86_64\_texpdf_plugin_windows.plugin `
            --embedded-helper "$env:RUNNER_TEMP\texpdf-target\x86_64-pc-windows-msvc\release\texpdf-helper.exe" `
            --bundle-info bundle\generated\bundle-info.json `
            --output-dir dist\texpdf-windows-x86_64 `
            --zip dist\texpdf-windows-x86_64.zip `
            --manifest dist\windows-x86_64\package-manifest.json `
            --target x86_64-pc-windows-msvc `
            --package-version $candidateVersion

      - name: Upload Windows development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-windows-x86_64-${{ github.sha }}
          path: |
            dist/windows-x86_64/
            dist/texpdf-windows-x86_64/
            dist/texpdf-windows-x86_64.zip
            bundle/generated/bundle-info.json
          if-no-files-found: error
          retention-days: 30
