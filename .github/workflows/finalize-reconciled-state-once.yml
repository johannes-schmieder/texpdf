name: Finalize reconciled state once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-reconciled-state-once.yml"
      - ".ci/stata/results/**"
      - "licenses/inventory/tex-resources.json"
      - "docs/WORKFLOWS.md"

concurrency:
  group: texpdf-finalize-reconciled-state-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Select exact green checkpoint
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ ! -x tools/report_v1_readiness.py ]] ||
             [[ ! -f licenses/inventory/tex-resources.json ]] ||
             [[ ! -f docs/WORKFLOWS.md ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          /usr/bin/python3 tools/report_v1_readiness.py
          source_sha="$(/usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('release/V1_READINESS.json').read_text(encoding='utf-8'))
          latest = report.get('latest_exact_green') or {}
          print(latest.get('tested_sha', ''))
          PY
          )"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          receipt=".ci/stata/results/$source_sha.json"
          /usr/bin/python3 ci/check_stata_receipt.py \
            "$receipt" \
            --expect-tested-sha "$source_sha" \
            --expect-profile quick \
            --require-success \
            --require-rust-success
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Update authoritative status from evidence
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          sha = os.environ['SOURCE_SHA']
          receipt = json.loads(
              Path(f'.ci/stata/results/{sha}.json').read_text(encoding='utf-8')
          )
          readiness = json.loads(
              Path('release/V1_READINESS.json').read_text(encoding='utf-8')
          )
          inventory = json.loads(
              Path('licenses/inventory/tex-resources.json').read_text(encoding='utf-8')
          )

          status_path = Path('STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          heading = '## Post-cleanup exact checkpoint'
          if heading in status:
              status = status[:status.index(heading)].rstrip() + '\n'
          blockers = readiness.get('blockers', [])
          blocker_text = '\n'.join(f'- {item}' for item in blockers) or '- none'
          status += f'''\n{heading}

The reconciled source/documentation line has an immutable exact-SHA green
checkpoint:

- source: `{sha}`;
- profile: `{receipt.get("profile", "")}`;
- overall: `{receipt.get("status", "")}`;
- Rust: `{receipt.get("rust_status", "")}` (`{receipt.get("rust_mode", "")}`);
- licensed Stata: `{receipt.get("stata_status", "")}`;
- run: `{receipt.get("run_id", "")}`.

The exact embedded-resource inventory currently reports
`{inventory.get("resolved_resource_count", 0)}` of
`{inventory.get("resource_count", 0)}` resources resolved,
`{len(inventory.get("unresolved_resources", []))}` unresolved,
`{len(inventory.get("ambiguous_resources", []))}` ambiguous, and
`{len(inventory.get("packages_without_license_metadata", []))}` packages without
license metadata. Notice-text completion remains a separate release gate.

Current fail-closed v1 blockers:

{blocker_text}

See `docs/V1_READINESS.md` and `release/V1_READINESS.json` for the generated
readiness record.
'''
          status_path.write_text(status, encoding='utf-8')

          plan_path = Path('PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          old = 'Last exact full-engine green source:'
          lines = []
          replaced = False
          for line in plan.splitlines():
              if line.startswith(old):
                  lines.append(f'Last exact full-engine green source: `{sha}`')
                  replaced = True
              else:
                  lines.append(line)
          if not replaced:
              lines.insert(3, f'Last exact full-engine green source: `{sha}`')
          plan_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          Path('.github/workflows/finalize-reconciled-state-once.yml').unlink()
          PY
      - name: Commit final evidence update
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git add STATUS.md PLAN.md docs/V1_READINESS.md release/V1_READINESS.json
          git add -u .github/workflows/finalize-reconciled-state-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record exact post-cleanup v1 readiness [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
