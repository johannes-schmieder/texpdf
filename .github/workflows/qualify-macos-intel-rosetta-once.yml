name: Qualify macOS Intel under Rosetta once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qualify-macos-intel-rosetta-once.yml"
      - "release/macos-universal-build.json"

concurrency:
  group: texpdf-qualify-macos-intel-rosetta-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 240
    env:
      TEXPDF_RUST_PROFILE: engine
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [[ -f release/macos-universal-build.json ]] && [[ -x tools/build_macos_universal.sh ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Intel Stata/Rosetta availability
        if: ${{ steps.state.outputs.ready == 'true' }}
        id: intel
        shell: bash
        run: |
          set -euo pipefail
          stata_real=/Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
          available=true
          reason=""
          if [[ ! -x "$stata_real" ]]; then
            available=false
            reason="Stata executable is absent"
          elif ! /usr/bin/lipo -archs "$stata_real" 2>/dev/null | /usr/bin/grep -qw x86_64; then
            available=false
            reason="installed Stata executable has no x86_64 slice"
          elif ! /usr/bin/arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            available=false
            reason="Rosetta x86_64 execution is unavailable"
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      - name: Record unavailable Intel runtime honestly
        if: ${{ steps.state.outputs.ready == 'true' && steps.intel.outputs.available != 'true' }}
        shell: bash
        env:
          REASON: ${{ steps.intel.outputs.reason }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          record = {
              'schema_version': 1,
              'source_sha': sha,
              'runtime': 'macOS x86_64 under Rosetta',
              'qualified': False,
              'reason': os.environ.get('REASON', 'unavailable'),
          }
          Path('release/macos-intel-runtime-attempt.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          registry_path = Path('release/targets.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          target = registry['targets']['x86_64-apple-darwin']
          target['stata_runtime_qualified'] = False
          target['status'] = 'Intel runtime qualification pending: ' + record['reason']
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Build universal plugin for Intel runtime test
        if: ${{ steps.intel.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash tools/build_macos_universal.sh
          universal="$(/usr/bin/python3 - <<'PY'
          from pathlib import Path
          import subprocess
          candidates=[]
          for path in Path('.').rglob('*.plugin'):
              result=subprocess.run(['/usr/bin/lipo','-archs',str(path)],text=True,capture_output=True)
              if result.returncode == 0 and {'arm64','x86_64'}.issubset(set(result.stdout.split())):
                  candidates.append(path)
          if not candidates:
              raise SystemExit('no universal plugin found')
          candidates.sort(key=lambda p:p.stat().st_size, reverse=True)
          print(candidates[0])
          PY
          )"
          cp "$universal" stata/_texpdf_plugin.plugin
          git add -f stata/_texpdf_plugin.plugin
      - name: Run licensed Intel Stata under Rosetta
        if: ${{ steps.intel.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/texpdf-stata-intel"
          cat > "$wrapper" <<'SH'
          #!/bin/bash
          exec /usr/bin/arch -x86_64 /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp "$@"
          SH
          chmod +x "$wrapper"
          export STATA_BIN="$wrapper"
          /bin/bash ci/run_stata_ci.sh quick
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success
      - name: Record successful Intel runtime qualification
        if: ${{ steps.intel.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          receipt = json.loads(Path('.ci/stata/run/receipt.json').read_text(encoding='utf-8'))
          plugin = Path('stata/_texpdf_plugin.plugin')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if receipt.get('status') != 'success' or receipt.get('stata_status') != 'success':
              raise SystemExit('Intel Stata receipt is not green')
          record = {
              'schema_version': 1,
              'source_sha': sha,
              'runtime': 'macOS x86_64 Stata under Rosetta',
              'qualified': True,
              'receipt': receipt,
              'plugin_size_bytes': plugin.stat().st_size,
              'plugin_sha256': hashlib.sha256(plugin.read_bytes()).hexdigest(),
              'architectures': ['arm64', 'x86_64'],
          }
          Path('release/macos-intel-runtime-attempt.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          registry_path = Path('release/targets.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          target = registry['targets']['x86_64-apple-darwin']
          target.update(
              {
                  'artifact': '_texpdf_plugin.plugin',
                  'plugin_sha256': record['plugin_sha256'],
                  'plugin_size_bytes': record['plugin_size_bytes'],
                  'qualification_profile': receipt.get('profile'),
                  'qualified_source_sha': sha,
                  'stata_runtime_qualified': True,
                  'stata_version': receipt.get('stata_version'),
                  'status': 'qualified in actual x86_64 Stata process under Rosetta',
              }
          )
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Commit attempt or qualification record
        if: ${{ steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target dist bundle/generated .ci/stata/run
          rm -f stata/_texpdf_plugin.plugin
          rm -f .github/workflows/qualify-macos-intel-rosetta-once.yml
          git add release/macos-intel-runtime-attempt.json release/targets.json
          git add -u .github/workflows/qualify-macos-intel-rosetta-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: record guarded macOS Intel runtime qualification"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
