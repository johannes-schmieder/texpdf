name: Commit exact qualified Cargo lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/commit-cargo-lock.yml"

concurrency:
  group: texpdf-commit-cargo-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lock:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 20
    env:
      EXPECTED_LOCK_SHA256: 169fb46d9fdb9ca748725d29800a78d09ae951c44bc88c6b4b72b015a4c8f265
      RUST_TOOLCHAIN: "1.97.1"
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate and verify the qualified dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rustup_bin="${RUSTUP_BIN:-/opt/homebrew/bin/rustup}"
          cargo_bin="$($rustup_bin which --toolchain "$RUST_TOOLCHAIN" cargo)"
          if [[ ! -f Cargo.lock ]]; then
            "$cargo_bin" generate-lockfile
          fi
          actual="$(/usr/bin/shasum -a 256 Cargo.lock | /usr/bin/awk '{print $1}')"
          if [[ "$actual" != "$EXPECTED_LOCK_SHA256" ]]; then
            echo "Cargo.lock does not match the exact lockfile from green run 32742605917" >&2
            echo "expected=$EXPECTED_LOCK_SHA256 actual=$actual" >&2
            exit 2
          fi
          rm -f .github/workflows/commit-cargo-lock.yml
          git add Cargo.lock
          git add -u .github/workflows/commit-cargo-lock.yml

      - name: Commit exact lockfile and remove this gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: commit exact qualified Cargo.lock"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
