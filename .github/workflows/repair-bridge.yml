name: One-shot bridge source repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-bridge.yml"

concurrency:
  group: texpdf-one-shot-bridge-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Replace redundant closures and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/texpdf-stata/src/lib.rs")
          text = source.read_text(encoding="utf-8")
          old = ".map_err(|error| map_core_error(error))?"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly two redundant closures, found {count}")
          source.write_text(text.replace(old, ".map_err(map_core_error)?"), encoding="utf-8")
          Path(".github/workflows/repair-bridge.yml").unlink()
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/texpdf-stata/src/lib.rs .github/workflows/repair-bridge.yml
          git commit -m "fix(plugin): simplify core error mapping"
          git push origin HEAD:main
