name: Generate TeX resource license inventory once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-license-inventory.yml"

concurrency:
  group: texpdf-generate-license-inventory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inventory:
    runs-on: [self-hosted, macOS, ARM64, texpdf]
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download pinned-era TeX Live package metadata
        shell: bash
        env:
          TLPDB_URL: https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2022/tlnet-final/tlpkg/texlive.tlpdb.xz
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cache="${TEXPDF_LICENSE_CACHE:-/private/tmp/texpdf-license-cache}"
          mkdir -p "$cache"
          tlpdb="$cache/texlive-2022-final.tlpdb.xz"
          /usr/bin/python3 - "$TLPDB_URL" "$tlpdb" <<'PY'
          from pathlib import Path
          import os
          import sys
          import urllib.request

          url = sys.argv[1]
          destination = Path(sys.argv[2])
          if not destination.is_file() or destination.stat().st_size == 0:
              temporary = destination.with_suffix(destination.suffix + ".part")
              temporary.unlink(missing_ok=True)
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "texpdf-license-inventory/0.1"},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  with temporary.open("wb") as output:
                      while chunk := response.read(1024 * 1024):
                          output.write(chunk)
              os.replace(temporary, destination)
          PY
          test -s "$tlpdb"
          echo "TEXPDF_TLPDB_PATH=$tlpdb" >> "$GITHUB_ENV"

      - name: Generate inventory and source lock
        shell: bash
        env:
          TLPDB_URL: https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2022/tlnet-final/tlpkg/texlive.tlpdb.xz
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/generate_license_inventory.py \
            --manifest bundle/curated-manifest.json \
            --tlpdb "$TEXPDF_TLPDB_PATH" \
            --overrides bundle/license-overrides.toml \
            --output bundle/LICENSE_INVENTORY.json \
            --markdown bundle/LICENSE_INVENTORY.md
          /usr/bin/python3 - "$TEXPDF_TLPDB_PATH" "$TLPDB_URL" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          path = Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          payload = {
              "schema_version": 1,
              "name": "TeX Live 2022 final package database",
              "url": sys.argv[2],
              "sha256": digest,
              "size_bytes": path.stat().st_size,
          }
          Path("bundle/license-sources.lock.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          inventory = json.loads(Path("bundle/LICENSE_INVENTORY.json").read_text(encoding="utf-8"))
          summary = inventory["summary"]
          print("TEXPDF_LICENSE_COVERAGE", summary)
          if summary["resource_count"] != 477:
              raise SystemExit("license inventory does not cover all 477 embedded resources")
          PY

      - name: Commit inventory and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/generate-license-inventory.yml
          git add bundle/LICENSE_INVENTORY.json bundle/LICENSE_INVENTORY.md \
            bundle/license-sources.lock.json
          git add -u .github/workflows/generate-license-inventory.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: inventory embedded TeX resource licenses"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "failed to publish license inventory after three attempts" >&2
          exit 1
