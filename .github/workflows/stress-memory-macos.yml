name: macOS ARM64 1000-call memory stress

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Successful compile calls (100-10000)
        required: true
        default: "1000"
      universal_run_id:
        description: Successful exact-source macOS universal workflow run ID
        required: true

concurrency:
  group: texpdf-macos-memory-stress
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  stress:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 180
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      TEXPDF_RUST_PROFILE: engine
      TEXPDF_STRESS_ITERATIONS: ${{ inputs.iterations || '1000' }}
      TEXPDF_UNIVERSAL_RUN_ID: ${{ inputs.universal_run_id }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TEXPDF_PYTHON: /usr/bin/python3
      TEXPDF_VCPKG_ROOT: /private/tmp/texpdf-vcpkg-a62ce77d56ee
      TEXPDF_VCPKG_BINARY_CACHE: /private/tmp/texpdf-vcpkg-binary-cache
      TEXPDF_PKGCONF_ROOT: /private/tmp/texpdf-pkgconf-4fc570f91d9d
    steps:
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate iteration count and committed profile
        id: profile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          case "$TEXPDF_STRESS_ITERATIONS" in
            ''|*[!0-9]*) echo "iterations must be an integer" >&2; exit 2 ;;
          esac
          test "$TEXPDF_STRESS_ITERATIONS" -ge 100
          test "$TEXPDF_STRESS_ITERATIONS" -le 10000
          case "$TEXPDF_UNIVERSAL_RUN_ID" in
            ''|*[!0-9]*) echo "universal_run_id must be a positive integer" >&2; exit 2 ;;
          esac
          test "$TEXPDF_UNIVERSAL_RUN_ID" -gt 0
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          profiles = json.loads(
              Path("ci/stata_profiles.json").read_text(encoding="utf-8")
          )["profiles"]
          profile = profiles.get("stress1000", {})
          if profile.get("suite") != "ci/stata_stress_1000.do":
              raise SystemExit("committed stress1000 profile has the wrong suite")
          if int(profile.get("timeout_seconds", 0)) < 7200:
              raise SystemExit("committed stress1000 profile timeout is too short")
          if "TEXPDF STRESS 1000 PASS" not in profile.get("required_log_markers", []):
              raise SystemExit("committed stress1000 profile lacks its success marker")
          PY

      - name: Download and validate exact universal candidate package
        id: build
        if: ${{ steps.profile.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/texpdf-universal-input"
          prepared="$RUNNER_TEMP/texpdf-memory-package-evidence"
          run_json="$RUNNER_TEMP/texpdf-universal-run.json"
          artifacts_json="$RUNNER_TEMP/texpdf-universal-artifacts.json"
          rm -rf "$input_root" "$prepared"
          mkdir -p "$input_root" "$prepared"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TEXPDF_UNIVERSAL_RUN_ID" \
            > "$run_json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TEXPDF_UNIVERSAL_RUN_ID/artifacts" \
            > "$artifacts_json"
          artifact_name="texpdf-macos-universal-$GITHUB_SHA-$TEXPDF_UNIVERSAL_RUN_ID"
          artifact_digest=$(/usr/bin/python3 - \
            "$run_json" "$artifacts_json" "$artifact_name" <<'PY'
          from pathlib import Path
          import json
          import os
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          artifacts = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected = {
              "name": "Build and test macOS universal plugin",
              "status": "completed",
              "conclusion": "success",
              "head_sha": os.environ["GITHUB_SHA"],
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"universal workflow run has invalid {key}")
          repository = run.get("head_repository") or {}
          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("universal workflow run belongs to another repository")
          matching = [
              row
              for row in artifacts.get("artifacts", [])
              if row.get("name") == sys.argv[3]
          ]
          if len(matching) != 1:
              raise SystemExit("expected exactly one exact-source universal artifact")
          artifact = matching[0]
          if artifact.get("expired") is not False:
              raise SystemExit("exact-source universal artifact is expired")
          workflow = artifact.get("workflow_run") or {}
          if workflow.get("head_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("universal artifact source does not match the tested source")
          digest = artifact.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("universal artifact lacks a SHA-256 digest")
          print(digest)
          PY
          )
          gh run download "$TEXPDF_UNIVERSAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$input_root"
          candidate_version=$(/usr/bin/python3 -c \
            'import json; print(json.load(open("release/scope.json"))["candidate_version"])')
          /usr/bin/python3 ci/prepare_macos_memory_input.py \
            --artifact-root "$input_root" \
            --output-dir "$prepared" \
            --expect-source-sha "$GITHUB_SHA" \
            --expect-package-version "$candidate_version" \
            --universal-run-id "$TEXPDF_UNIVERSAL_RUN_ID" \
            --artifact-name "$artifact_name" \
            --artifact-digest "$artifact_digest"

      - name: Run licensed Stata stress with RSS sampling
        id: stress
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          TEXPDF_STATA_PACKAGE_DIR: ${{ runner.temp }}/texpdf-universal-input/dist/macos-universal/texpdf
          TEXPDF_STATA_PACKAGE_MANIFEST: ${{ runner.temp }}/texpdf-memory-package-evidence/package-manifest.json
        run: /bin/bash ci/run_memory_stress.sh stress1000

      - name: Restore exact universal package evidence
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/stata/run
          evidence="$RUNNER_TEMP/texpdf-memory-package-evidence"
          for name in \
            rust-quick.status \
            bundle-info.json \
            package-manifest.json \
            plugin-manifest.json \
            helper-manifest.json \
            memory-input.json
          do
            cp "$evidence/$name" ".ci/stata/run/$name"
          done

      - name: Validate combined receipt and growth gate
        id: validate
        if: ${{ steps.stress.outcome == 'success' && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json \
            .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile stress1000 \
            --require-success \
            --require-rust-success
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json

          data = json.loads(Path(".ci/stata/run/memory-stress.json").read_text(encoding="utf-8"))
          iterations = data.get("iterations_requested")
          expected_failures = iterations // 25 + 2 if isinstance(iterations, int) else None
          required = {
              "minimum_iterations": isinstance(iterations, int) and iterations >= 1000,
              "runner_success": data.get("runner_rc") == 0,
              "growth_gate": data.get("growth_gate") is True,
              "all_successes_recorded": data.get("successful_compile_count") == iterations,
              "all_failures_recorded": (
                  data.get("injected_failure_count") == expected_failures
                  and data.get("expected_injected_failure_count") == expected_failures
              ),
              "post_error_recovery": data.get("post_error_recovery") is True,
              "helper_observed": int(data.get("helper_sample_count", 0)) > 0,
              "one_helper_at_a_time": data.get("max_concurrent_helpers") == 1,
              "no_retained_helpers": data.get("retained_helper_pids") == [],
          }
          failures = [name for name, passed in required.items() if not passed]
          if failures:
              raise SystemExit("memory stress gate failed: " + ", ".join(failures))
          print("TEXPDF_MEMORY_STRESS_GREEN", data)
          PY

      - name: Write attempt record
        id: record
        if: ${{ always() }}
        shell: bash
        env:
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .ci/stata/run
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import platform
          import re

          def load(path: str) -> dict:
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}
              return value if isinstance(value, dict) else {}

          memory = load(".ci/stata/run/memory-stress.json")
          receipt = load(".ci/stata/run/receipt.json")
          plugin = load(".ci/stata/run/plugin-manifest.json")
          helper = load(".ci/stata/run/helper-manifest.json")
          bundle = load(".ci/stata/run/bundle-info.json")
          package = load(".ci/stata/run/package-manifest.json")
          input_record = load(".ci/stata/run/memory-input.json")
          outcomes = {
              "profile": os.environ.get("PROFILE_OUTCOME", "unknown"),
              "build": os.environ.get("BUILD_OUTCOME", "unknown"),
              "stress": os.environ.get("STRESS_OUTCOME", "unknown"),
              "validate": os.environ.get("VALIDATE_OUTCOME", "unknown"),
          }
          iterations = memory.get("iterations_requested")
          expected_failures = iterations // 25 + 2 if isinstance(iterations, int) else None
          sha_pattern = re.compile(r"[0-9a-f]{64}")

          def valid_sha(value: object) -> bool:
              return isinstance(value, str) and sha_pattern.fullmatch(value) is not None

          plugin_sha = plugin.get("sha256")
          helper_sha = helper.get("sha256")
          bundle_sha = bundle.get("zip_sha256")
          qualified = (
              all(value == "success" for value in outcomes.values())
              and receipt.get("tested_sha") == os.environ["GITHUB_SHA"]
              and receipt.get("status") == "success"
              and receipt.get("stata_status") == "success"
              and receipt.get("rust_status") == "success"
              and receipt.get("rust_mode") == "repository-engine"
              and receipt.get("profile") == "stress1000"
              and isinstance(iterations, int)
              and iterations >= 1000
              and memory.get("runner_rc") == 0
              and memory.get("growth_gate") is True
              and memory.get("successful_compile_count") == iterations
              and memory.get("injected_failure_count") == expected_failures
              and memory.get("expected_injected_failure_count") == expected_failures
              and memory.get("post_error_recovery") is True
              and int(memory.get("helper_sample_count", 0)) > 0
              and memory.get("max_concurrent_helpers") == 1
              and memory.get("retained_helper_pids") == []
              and valid_sha(memory.get("stata_log_sha256"))
              and valid_sha(plugin_sha)
              and int(plugin.get("size_bytes", 0)) > 0
              and valid_sha(helper_sha)
              and int(helper.get("size_bytes", 0)) > 0
              and valid_sha(bundle_sha)
              and package.get("plugin_sha256") == plugin_sha
              and package.get("embedded_helper_sha256") == helper_sha
              and package.get("bundle_zip_sha256") == bundle_sha
              and package.get("public_release_mode") is True
              and package.get("license_evidence_included") is True
              and package.get("source_sha") == os.environ["GITHUB_SHA"]
              and input_record.get("source_sha") == os.environ["GITHUB_SHA"]
              and input_record.get("universal_run_id")
                  == int(os.environ["TEXPDF_UNIVERSAL_RUN_ID"])
              and input_record.get("package_zip_sha256")
                  == package.get("package_zip_sha256")
              and input_record.get("plugin_sha256") == plugin_sha
              and input_record.get("arm_helper_sha256") == helper_sha
              and input_record.get("bundle_zip_sha256") == bundle_sha
          )
          record = {
              "schema_version": 3,
              "source_sha": os.environ["GITHUB_SHA"],
              "profile": "stress1000",
              "qualified": qualified,
              "step_outcomes": outcomes,
              "overall_status": receipt.get("status", "failure"),
              "stata_status": receipt.get("stata_status", "failure"),
              "rust_status": receipt.get("rust_status", "failure"),
              "rust_mode": receipt.get("rust_mode"),
              "platform": receipt.get("platform"),
              "stata_version": receipt.get("stata_version"),
              "stata_edition": receipt.get("stata_edition"),
              "process_architecture": platform.machine(),
              "plugin": {
                  "sha256": plugin_sha,
                  "size_bytes": plugin.get("size_bytes"),
                  "exports": plugin.get("exports"),
                  "external_dynamic_dependencies": plugin.get(
                      "external_dynamic_dependencies"
                  ),
              },
              "helper": {
                  "sha256": helper_sha,
                  "size_bytes": helper.get("size_bytes"),
                  "target": helper.get("target"),
              },
              "bundle": {
                  "zip_sha256": bundle_sha,
                  "zip_size_bytes": bundle.get("zip_size_bytes"),
                  "content_digest": bundle.get("tectonic_bundle_digest"),
                  "file_count": bundle.get("file_count"),
              },
              "development_package": {
                  "zip_sha256": package.get("package_zip_sha256"),
                  "zip_size_bytes": package.get("package_zip_size_bytes"),
              },
              "universal_package": input_record,
              "memory": memory,
              "qualification_boundary": (
                  "This records one exact-source macOS Apple Silicon licensed-Stata "
                  "attempt through the exact public universal candidate package from "
                  "the recorded successful universal workflow artifact. The Stata "
                  "parent was held for at least 1000 successful compiles with one "
                  "short-lived embedded helper per request and deliberate error "
                  "recovery. Other architectures require separate runtime qualification."
              ),
          }
          Path(".ci/stata/run/memory-qualification.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("TEXPDF_MEMORY_ATTEMPT_RECORD", record)
          PY

      - name: Publish source-bound memory attempt
        if: ${{ always() && steps.record.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source_record="$GITHUB_WORKSPACE/.ci/stata/run/memory-qualification.json"
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git -C "$GITHUB_WORKSPACE" worktree remove --force "$publish_tree" 2>/dev/null || true
              publish_tree=""
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin main
            publish_tree="$RUNNER_TEMP/texpdf-memory-publish-$attempt"
            rm -rf "$publish_tree"
            git worktree add --detach "$publish_tree" origin/main
            mkdir -p "$publish_tree/release"
            cp "$source_record" "$publish_tree/release/latest-memory-stress-macos-arm64.json"
            /usr/bin/python3 - \
              "$source_record" \
              "$publish_tree/release/targets.json" \
              "$publish_tree/release/scope.json" \
              "$publish_tree/release/memory-stress-macos-arm64.json" <<'PY'
          from pathlib import Path
          import json
          import sys

          record = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          targets_path = Path(sys.argv[2])
          scope = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          candidate_record_path = Path(sys.argv[4])
          targets = json.loads(targets_path.read_text(encoding="utf-8"))
          arm = targets["targets"]["aarch64-apple-darwin"]
          arm["memory_stress_latest_attempt_sha"] = record["source_sha"]
          arm["memory_stress_latest_attempt_qualified"] = record["qualified"]
          is_candidate = record["source_sha"] == scope["candidate_source_sha"]
          if is_candidate and record["qualified"]:
              candidate_record_path.write_text(
                  json.dumps(record, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              memory = record["memory"]
              arm.update(
                  {
                      "memory_stress_source_sha": record["source_sha"],
                      "memory_stress_iterations": memory["iterations_requested"],
                      "memory_stress_successful_compiles": memory["successful_compile_count"],
                      "memory_stress_injected_failures": memory["injected_failure_count"],
                      "memory_stress_peak_stata_rss_kib": memory["peak_stata_rss_kib"],
                      "memory_stress_peak_tree_rss_kib": memory["peak_tree_rss_kib"],
                      "memory_stress_peak_helper_rss_kib": memory["peak_helper_rss_kib"],
                      "memory_stress_helper_samples": memory["helper_sample_count"],
                      "memory_stress_retained_helper_pids": memory["retained_helper_pids"],
                      "memory_stress_warm_median_stata_rss_kib": memory[
                          "warm_median_stata_rss_kib"
                      ],
                      "memory_stress_late_median_stata_rss_kib": memory[
                          "late_median_stata_rss_kib"
                      ],
                      "memory_stress_post_warmup_growth_kib": memory["post_warmup_growth_kib"],
                      "memory_stress_growth_ratio": memory["post_warmup_growth_ratio"],
                      "memory_stress_max_allowed_growth_kib": memory[
                          "max_allowed_growth_kib"
                      ],
                      "memory_stress_post_error_recovery": memory["post_error_recovery"],
                      "memory_stress_stata_log_sha256": memory["stata_log_sha256"],
                      "memory_stress_plugin_sha256": record["plugin"]["sha256"],
                      "memory_stress_helper_sha256": record["helper"]["sha256"],
                      "memory_stress_gate": memory["growth_gate"],
                  }
              )
          targets_path.write_text(
              json.dumps(targets, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add \
              release/latest-memory-stress-macos-arm64.json \
              release/memory-stress-macos-arm64.json \
              release/targets.json
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "ci(target): record 1000-call memory attempt [skip ci]"
            if git -C "$publish_tree" push origin HEAD:main; then
              exit 0
            fi
            cleanup
            sleep "$attempt"
          done
          exit 1

      - name: Upload exact-source stress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: texpdf-memory-stress-${{ github.sha }}-${{ github.run_id }}
          path: .ci/stata/run/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce qualification
        if: ${{ always() && steps.record.outcome == 'success' }}
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          data = json.loads(
              Path(".ci/stata/run/memory-qualification.json").read_text(encoding="utf-8")
          )
          if data.get("qualified") is not True:
              raise SystemExit("1000-call memory qualification did not pass")
          PY
