name: Pin native platform policy once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pin-native-platform-policy-once.yml"

concurrency:
  group: texpdf-pin-native-platform-policy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pin:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, texpdf]
    timeout-minutes: 240
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: quick
      TEXPDF_RUST_PROFILE: engine
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch native dependency and plugin checks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          native = Path("tools/prepare_native_deps.sh")
          text = native.read_text(encoding="utf-8")
          replacements = {
              'triplet="arm64-osx"': 'triplet="arm64-osx-texpdf"',
              'triplet="x64-osx"': 'triplet="x64-osx-texpdf"',
              'triplet="x64-linux"': 'triplet="x64-linux-texpdf"',
              'triplet="x64-windows-static-release"': 'triplet="x64-windows-texpdf"',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          if 'repo_root="$(git rev-parse --show-toplevel)"' not in text:
              anchor = "set -euo pipefail\n"
              if anchor not in text:
                  raise SystemExit("cannot locate native dependency script prologue")
              text = text.replace(
                  anchor,
                  anchor + '\nrepo_root="$(git rev-parse --show-toplevel)"\n',
                  1,
              )
          export_anchor = 'export VCPKG_ROOT="$vcpkg_root"\n'
          overlay_line = 'export VCPKG_OVERLAY_TRIPLETS="$repo_root/tools/vcpkg-triplets"\n'
          if overlay_line not in text:
              if export_anchor not in text:
                  raise SystemExit("cannot locate vcpkg export anchor")
              text = text.replace(export_anchor, export_anchor + overlay_line, 1)
          install_anchor = '    --triplet "$triplet" \\\n'
          overlay_argument = '    --overlay-triplets "$VCPKG_OVERLAY_TRIPLETS" \\\n'
          if overlay_argument not in text:
              if install_anchor not in text:
                  raise SystemExit("cannot locate vcpkg install triplet argument")
              text = text.replace(
                  install_anchor,
                  install_anchor + overlay_argument,
                  1,
              )
          native.write_text(text, encoding="utf-8")

          quick = Path("ci/run_rust_quick.sh")
          text = quick.read_text(encoding="utf-8")
          deployment_block = '''if [[ "$(/usr/bin/uname -s)" == "Darwin" ]]; then
  export MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET:-11.0}"
fi
'''
          if "export MACOSX_DEPLOYMENT_TARGET=" not in text:
              anchor = "set -euo pipefail\n"
              if anchor not in text:
                  raise SystemExit("cannot locate Rust quick script prologue")
              text = text.replace(anchor, anchor + "\n" + deployment_block, 1)
          stage_anchor = '  /usr/bin/python3 tools/stage_plugin.py --target-dir "$CARGO_TARGET_DIR"\n'
          inspection = stage_anchor + '''  if [[ "$(/usr/bin/uname -s)" == "Darwin" ]]; then
    /usr/bin/python3 tools/check_plugin_binary.py \
      stata/_texpdf_plugin.plugin \
      --platform macos \
      --minimum-macos "$MACOSX_DEPLOYMENT_TARGET" \
      --output .ci/stata/run/plugin-binary-policy.json
  fi
'''
          if "plugin-binary-policy.json" not in text:
              if stage_anchor not in text:
                  raise SystemExit("cannot locate plugin staging anchor")
              text = text.replace(stage_anchor, inspection, 1)
          quick.write_text(text, encoding="utf-8")

          for workflow in (
              ".github/workflows/build-macos-universal.yml",
              ".github/workflows/qualify-macos-universal-once.yml",
          ):
              path = Path(workflow)
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("--triplet x64-osx \\", "--triplet x64-osx-texpdf \\")
              text = text.replace("export VCPKGRS_TRIPLET=x64-osx", "export VCPKGRS_TRIPLET=x64-osx-texpdf")
              if "MACOSX_DEPLOYMENT_TARGET:" not in text and "env:\n" in text:
                  text = text.replace("    env:\n", '    env:\n      MACOSX_DEPLOYMENT_TARGET: "11.0"\n', 1)
              path.write_text(text, encoding="utf-8")

          cross = Path(".github/workflows/build-cross-platform.yml")
          if cross.is_file():
              text = cross.read_text(encoding="utf-8")
              text = text.replace("triplet: x64-linux", "triplet: x64-linux-texpdf")
              text = text.replace("triplet: x64-windows-static-md", "triplet: x64-windows-texpdf")
              text = text.replace(
                  '            library: texpdf_stata.dll\n',
                  '            library: texpdf_stata.dll\n            rustflags: "-C target-feature=+crt-static"\n',
              )
              text = text.replace(
                  '            library: libtexpdf_stata.so\n',
                  '            library: libtexpdf_stata.so\n            rustflags: ""\n',
              )
              if "RUSTFLAGS: ${{ matrix.rustflags }}" not in text:
                  text = text.replace(
                      '      CARGO_TARGET_DIR: ${{ github.workspace }}/target\n',
                      '      CARGO_TARGET_DIR: ${{ github.workspace }}/target\n      RUSTFLAGS: ${{ matrix.rustflags }}\n      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/tools/vcpkg-triplets\n',
                      1,
                  )
              text = text.replace(
                  '            --triplet "$VCPKGRS_TRIPLET" \\\n',
                  '            --triplet "$VCPKGRS_TRIPLET" \\\n            --overlay-triplets "$VCPKG_OVERLAY_TRIPLETS" \\\n',
              )
              text = text.replace(
                  '            --triplet $env:VCPKGRS_TRIPLET `\n',
                  '            --triplet $env:VCPKGRS_TRIPLET `\n            --overlay-triplets $env:VCPKG_OVERLAY_TRIPLETS `\n',
              )
              cross.write_text(text, encoding="utf-8")

          Path(".github/workflows/pin-native-platform-policy-once.yml").unlink()
          PY

          git add tools/prepare_native_deps.sh tools/vcpkg-triplets \
            tools/check_plugin_binary.py ci/run_rust_quick.sh
          git add .github/workflows/build-macos-universal.yml \
            .github/workflows/build-cross-platform.yml 2>/dev/null || true
          git add -u .github/workflows/pin-native-platform-policy-once.yml \
            .github/workflows/qualify-macos-universal-once.yml 2>/dev/null || true

      - name: Build real plugin with pinned deployment target
        shell: bash
        run: /bin/bash ci/record_rust_quick.sh

      - name: Preserve Rust and binary-policy evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-platform-policy-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          cp -R .ci/stata/run/. "$evidence/"
          cp bundle/generated/bundle-info.json "$evidence/"
          test -f "$evidence/plugin-binary-policy.json"

      - name: Run licensed Stata comprehensive profile
        shell: bash
        run: /bin/bash ci/run_stata_ci.sh quick

      - name: Restore and validate evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/texpdf-platform-policy-evidence"
          mkdir -p .ci/stata/run
          if [[ -d "$evidence" ]]; then cp -R "$evidence/." .ci/stata/run/; fi
          /usr/bin/python3 ci/augment_ci_receipt.py \
            .ci/stata/run/receipt.json .ci/stata/run/rust-quick.status
          /usr/bin/python3 ci/check_stata_receipt.py \
            .ci/stata/run/receipt.json \
            --expect-tested-sha "$GITHUB_SHA" \
            --expect-profile quick \
            --require-success \
            --require-rust-success

      - name: Commit pinned native policy
        shell: bash
        run: |
          set -euo pipefail
          git reset -- stata/_texpdf_plugin.plugin dist 2>/dev/null || true
          rm -f stata/_texpdf_plugin.plugin
          rm -rf dist .ci/stata/run bundle/generated
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: pin standalone native platform policy"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
